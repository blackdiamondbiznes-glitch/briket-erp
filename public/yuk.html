<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="color-scheme" content="dark" />
  <title>Yuk xati</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="theme.js"></script>
  <script src="erp-back.js"></script>
  <script src="confirm-sheet.js"></script>
  <script src="vendor/leaflet.js"></script>
  <style>
    :root {
      /* Coal scale follows the theme so a light Telegram client is not dark-on-dark. */
      --coal-950: var(--bg);
      --coal-900: var(--bg);
      --coal-800: var(--surface);
      --coal-700: var(--surface-2);
      --coal-600: var(--border);
      --coal-400: var(--hint);
      --coal-200: var(--text);
      --coal-50: var(--text);
      --ember: var(--accent-fill);
      --ember-dark: var(--accent-fill-hover);
      --btn-text: var(--accent-text);
      --line: var(--border);
      --ink: var(--accent-text);
      --vv-h: 100dvh;
      --vv-top: 0px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 16px/1.4 var(--font);
      min-height: 100dvh;
      padding-bottom: calc(76px + env(safe-area-inset-bottom));
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    input, select, textarea { font-size: 16px; }
    button { cursor: pointer; }
    .app { max-width: 32rem; margin: 0 auto; padding: 16px 16px 32px; }
    @media (min-width: 900px) {
      .app { max-width: 960px; }
      .nav { left: 50%; right: auto; width: min(960px, 100%); transform: translateX(-50%); }
    }
    .pagehead { margin-bottom: 16px; }
    .pagehead h1, header.top h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0; }
    .pagehead p, header.top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .eyebrow { margin: 0 0 2px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .who { margin: 0 0 8px; color: var(--faint); font-size: 12px; }
    .card {
      background: var(--coal-800);
      border: 1px solid var(--coal-700);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .grow { flex: 1; min-width: 0; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); font-size: 12px; }
    .btn, .btn-ghost, .btn-danger {
      border: 0; border-radius: 12px; min-height: 48px; padding: 12px 14px; font-weight: 600;
    }
    .btn { background: var(--accent-fill); color: var(--accent-text); width: 100%; }
    .btn:disabled { opacity: .6; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--coal-600); }
    .btn-ghost.on { background: var(--accent-fill); color: var(--accent-text); border-color: var(--accent-fill); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .pick, .field, .money, .qty {
      background: var(--coal-900); border: 1px solid var(--coal-600); border-radius: 12px;
      min-height: 48px; padding: 10px 12px; width: 100%;
      outline: none; box-shadow: none; -webkit-appearance: none; appearance: none;
    }
    .pick { text-align: left; background: var(--coal-800); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pick strong { display: block; font-weight: 500; }
    .pick .ph { color: var(--coal-400); }
    .qty:focus, .money:focus, .field:focus, select:focus { border: 1px solid var(--accent-fill); }
    .banner {
      background: var(--accent-muted); border: 1px solid color-mix(in srgb, var(--accent-fill) 45%, transparent); color: var(--text);
      border-radius: 12px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin: 0 0 16px; font-size: 14px;
    }
    .banner button { background: transparent; color: var(--accent); border: 0; min-height: var(--tap); font-weight: 600; }
    .section-title { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--coal-200); display: flex; align-items: center; gap: 8px; }
    .block { display: block; }
    .product { display: block; }
    .product-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .product-top p { margin: 0; }
    .product-grid { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 8px; }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper button {
      width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--coal-600);
      background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center;
    }
    .qty { width: 56px; text-align: center; padding-left: 4px; padding-right: 4px; }
    .sub { text-align: right; color: var(--coal-400); font-variant-numeric: tabular-nums; font-size: 14px; }
    .num { font-variant-numeric: tabular-nums; }
    label.lbl { display: block; font-size: 12px; color: var(--coal-400); margin: 0 0 4px; }
    .hint { margin: 4px 0 0; font-size: 12px; color: var(--hint); }
    .totals b { font-variant-numeric: tabular-nums; }
    .debt-num { color: var(--accent); font-weight: 600; }
    .debt-ok { color: var(--success); font-weight: 600; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
    .search {
      display: flex; align-items: center; gap: 8px; min-height: 48px; flex: 1; min-width: 0;
      border: 1px solid var(--coal-600); border-radius: 12px; background: var(--coal-800); padding: 0 12px;
    }
    .search svg { flex: 0 0 auto; color: var(--coal-400); }
    .search input {
      flex: 1; min-width: 0; width: 100%; border: 0; outline: none; background: transparent;
      min-height: 44px; padding: 0; box-shadow: none; border-radius: 0;
    }
    .search:focus-within { border-color: var(--accent-fill); }
    .menu-search {
      display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--coal-700); padding: 0 12px;
    }
    .menu-search svg { flex: 0 0 auto; color: var(--coal-400); }
    .menu-search input {
      flex: 1; min-width: 0; width: 100%; border: 0; outline: none; background: transparent;
      min-height: 44px; padding: 0; box-shadow: none;
    }
    .nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: color-mix(in srgb, var(--nav-bg) 94%, transparent); border-top: 1px solid var(--border);
      box-shadow: var(--shadow); backdrop-filter: blur(8px);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav button {
      position: relative; background: transparent; border: 0; color: var(--coal-400);
      min-height: 56px; padding: 6px 2px 8px; font-size: 12px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .nav button.on { color: var(--text); font-weight: 600; }
    .nav .bar { display: none; }
    .nav button.on .bar { display: block; position: absolute; top: 0; left: 8px; right: 8px; height: 2px; border-radius: 2px; background: var(--accent-fill); }
    .btn.fit { width: auto; }
    .btn.sq { width: 48px; min-width: 48px; padding: 0; }
    .card.product { margin-bottom: 8px; }
    .row.mb { margin-bottom: 12px; }
    .nav .ico-wrap { position: relative; display: flex; }
    .badge {
      position: absolute; right: -8px; top: -4px; min-width: 16px; border-radius: 999px;
      background: #dc2626; color: #fff; font-size: 12px; font-weight: 700; padding: 0 4px; line-height: 16px;
    }
    .ico { width: 20px; height: 20px; display: block; }
    .ico.sm { width: 16px; height: 16px; }
    .overlay {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      position: relative; z-index: 41; width: 100%; max-width: 28rem;
      background: var(--coal-800); border: 1px solid var(--coal-600);
      border-radius: 16px 16px 0 0; max-height: 92vh; overflow: auto;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
    }
    .sheet header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
    .sheet header strong { font-size: 16px; }
    .sheet .list { display: flex; flex-direction: column; gap: 12px; }
    .drop {
      position: absolute; z-index: 20; left: 0; right: 0; margin-top: 4px;
      overflow: hidden; border-radius: 12px; border: 1px solid var(--coal-600);
      background: var(--coal-800); box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }
    .drop ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
    .drop li button {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: transparent; border: 0; text-align: left; padding: 12px; min-height: var(--tap);
    }
    .store-row { display: flex; align-items: stretch; gap: 4px; border-bottom: 1px solid var(--coal-700); }
    .store-row .open {
      flex: 1; min-height: 64px; background: transparent; border: 0; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0;
    }
    .pay-side {
      min-width: 48px; background: transparent; border: 0; color: var(--coal-200);
      font-size: 12px; min-height: var(--tap); display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .pay-side:disabled { opacity: .3; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      min-height: var(--tap); border-radius: 999px; padding: 0 12px; font-size: 12px; font-weight: 500;
      background: transparent; color: var(--coal-200); border: 1px solid var(--coal-600);
    }
    .chip.on { background: var(--accent-fill); color: var(--accent-text); border-color: var(--accent-fill); }
    .hit {
      width: 100%; text-align: left; background: transparent; border: 1px solid var(--coal-700);
      border-radius: 16px; padding: 12px; margin-bottom: 8px; color: inherit;
    }
    .hit .debt { color: var(--accent); font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions .btn-ghost { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 500; }
    .actions .share { background: var(--accent-muted); border-color: color-mix(in srgb, var(--accent-fill) 45%, transparent); }
    .okbox { background: var(--success-bg); border: 1px solid var(--success-border); border-radius: 16px; padding: 12px; margin-bottom: 16px; }
    .okbox strong { color: var(--success); font-size: 14px; }
    .err { color: var(--danger); background: var(--danger-bg); border-radius: 12px; padding: 10px; margin-bottom: 12px; }
    .tag { font-size: 12px; border-radius: 4px; padding: 2px 6px; font-weight: 700; }
    .tag.red { background: #dc2626; color: #fff; }
    .tag.amber { background: #eab308; color: #0B0C0F; }
    .tag.muted { border: 1px solid var(--coal-600); color: var(--muted); font-weight: 500; }
    .remind { border-radius: 16px; padding: 12px; width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; color: inherit; }
    .remind.red { border: 1px solid var(--danger-border); background: var(--danger-bg); }
    .remind.amber { border: 1px solid var(--warning-border); background: var(--warning-bg); }
    .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 64px 0; text-align: center; color: var(--coal-400); }
    .rel { position: relative; }
    .hidden { display: none; }
    .lock { min-height: 70dvh; display: flex; flex-direction: column; justify-content: center; }
    .lock h1 { margin: 0; font-size: 28px; }
    .lock .eyebrow { margin: 0 0 6px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
    .pending-box, .reject-box { border-radius: 14px; padding: 12px 14px; margin: 14px 0; }
    .pending-box { background: var(--warning-bg); border: 1px solid var(--warning-border); color: var(--text); }
    .reject-box { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--text); }
    .lock a.btn-ghost { display: flex; justify-content: center; text-decoration: none; margin-top: 10px; }
    a.admin-back { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; margin: 0 0 12px; min-height: var(--tap); }
    .map-box { height: 280px; border-radius: 12px; overflow: hidden; background: var(--coal-900); }
    .leaflet-container { font: inherit; background: var(--coal-900); }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stats.three { grid-template-columns: 1fr 1fr 1fr; }
    .stat { background: var(--coal-800); border: 1px solid var(--coal-700); border-radius: 16px; padding: 10px; }
    .stat b { display: block; font-size: 16px; }
    .stat.ok { border-color: var(--success-border); background: var(--success-bg); }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script src="yuk-app.js"></script>
</body>
</html>
