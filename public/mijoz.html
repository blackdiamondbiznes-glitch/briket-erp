<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Black Diamond — Buyurtma</title>
  <link rel="manifest" href="/mijoz-manifest.webmanifest" />
  <link rel="icon" href="/bd_logo.jpg" type="image/jpeg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0b0e;
      --surface: #14161b;
      --surface-2: #1c1f27;
      --border: #2a2c33;
      --border-strong: #3a3d47;
      --text: #f0eee8;
      --text-muted: #9a9588;
      --accent: #c9a227;
      --accent-soft: rgba(201, 162, 39, 0.14);
      --ok: #7dba8a;
      --ok-soft: rgba(125, 186, 138, 0.14);
      --warn: #e8c56a;
      --danger: #e08a82;
      --danger-soft: rgba(224, 138, 130, 0.14);
      --radius: 16px;
      --radius-sm: 12px;
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
    }

    /* Header */
    .hdr {
      position: sticky; top: 0; z-index: 40;
      background: rgba(10, 11, 14, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
    }
    .hdr-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .brand-text h1 {
      font-size: 0.95rem; font-weight: 700; color: var(--accent);
      letter-spacing: 0.02em;
    }
    .brand-text p { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }
    .user-chip {
      font-size: 0.72rem; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 999px; max-width: 120px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .contact-row {
      display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
    }
    .contact-row a {
      flex: 1; min-width: 120px;
      text-align: center; text-decoration: none;
      font-size: 0.78rem; font-weight: 600; color: var(--accent);
      background: var(--accent-soft); border: 1px solid rgba(201,162,39,0.25);
      padding: 9px 12px; border-radius: var(--radius-sm);
    }

    /* Page */
    .page { padding: 14px 16px 20px; max-width: 560px; margin: 0 auto; }
    .section-title {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      margin: 4px 0 12px;
    }

    /* Toast / msg */
    .toast {
      padding: 12px 14px; border-radius: var(--radius-sm);
      margin-bottom: 12px; font-size: 0.88rem; font-weight: 500;
    }
    .toast.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(125,186,138,0.25); }
    .toast.err { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(224,138,130,0.25); }

    /* Product card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .card:active { border-color: var(--border-strong); }
    .prod {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 0;
    }
    .prod-img-wrap {
      position: relative;
      background: var(--surface-2);
      min-height: 96px;
    }
    .prod-img {
      width: 100%; height: 100%; min-height: 96px;
      object-fit: cover; display: block; cursor: pointer;
    }
    .prod-img.placeholder {
      display: grid; place-items: center;
      color: var(--text-muted); font-size: 0.7rem;
      min-height: 96px;
    }
    .prod-body { padding: 12px 12px 12px 0; display: flex; flex-direction: column; }
    .prod-sku { font-weight: 700; font-size: 0.95rem; }
    .prod-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }
    .prod-desc {
      font-size: 0.72rem; color: var(--text-muted); margin-top: 6px;
      line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .prod-bottom {
      margin-top: auto; padding-top: 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .prod-price { color: var(--accent); font-weight: 700; font-size: 1rem; }
    .badge {
      display: inline-block; font-size: 0.65rem; font-weight: 600;
      padding: 3px 8px; border-radius: 999px;
    }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.out { background: var(--danger-soft); color: var(--danger); }
    .badge.pending { background: var(--accent-soft); color: var(--accent); }
    .badge.confirmed { background: var(--ok-soft); color: var(--ok); }
    .badge.rejected { background: var(--danger-soft); color: var(--danger); }

    /* Qty control */
    .qty {
      display: inline-flex; align-items: center; gap: 0;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .qty button {
      width: 36px; height: 36px; border: none; background: transparent;
      color: var(--text); font-size: 1.15rem; font-weight: 500; cursor: pointer;
    }
    .qty button:active { background: var(--accent-soft); color: var(--accent); }
    .qty span {
      min-width: 28px; text-align: center; font-weight: 700; font-size: 0.9rem;
    }

    /* Cart line */
    .cart-line {
      display: flex; gap: 12px; padding: 12px; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .cart-line:last-child { border-bottom: none; }
    .cart-line img {
      width: 64px; height: 64px; border-radius: 12px; object-fit: cover;
      background: var(--surface-2); flex-shrink: 0;
    }
    .cart-line .info { flex: 1; min-width: 0; }
    .cart-line .sku { font-weight: 600; font-size: 0.9rem; }
    .cart-line .sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    .cart-line .line-total { color: var(--accent); font-weight: 700; margin-top: 4px; }

    /* Form */
    .form-block { padding: 14px; }
    label {
      display: block; font-size: 0.72rem; font-weight: 500;
      color: var(--text-muted); margin-bottom: 5px;
    }
    input, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      padding: 12px 14px; font-size: 0.95rem; margin-bottom: 12px;
      font-family: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    .total-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; margin-bottom: 8px;
      border-top: 1px solid var(--border);
    }
    .total-bar .label { color: var(--text-muted); font-size: 0.9rem; }
    .total-bar .sum { font-size: 1.2rem; font-weight: 700; color: var(--accent); }

    .btn {
      width: 100%; border: none; border-radius: var(--radius-sm);
      padding: 14px 16px; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      background: linear-gradient(180deg, #d4b03a 0%, #c9a227 100%);
      color: #1a1408;
      box-shadow: 0 2px 8px rgba(201, 162, 39, 0.25);
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; box-shadow: none; }

    /* Orders */
    .order-card { padding: 14px; }
    .order-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .order-code { font-weight: 700; font-size: 0.92rem; }
    .order-date { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
    .order-items { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }
    .order-sum {
      margin-top: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .order-sum strong { color: var(--accent); font-size: 1rem; }
    .order-note {
      margin-top: 10px; font-size: 0.8rem; padding: 8px 10px;
      border-radius: 10px; font-weight: 500;
    }
    .order-note.ok { background: var(--ok-soft); color: var(--ok); }
    .order-note.err { background: var(--danger-soft); color: var(--danger); }
    .order-note.wait { background: var(--accent-soft); color: var(--accent); }

    /* Empty / loading */
    .empty {
      text-align: center; padding: 48px 16px; color: var(--text-muted);
    }
    .empty .ico { font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }
    .empty p { font-size: 0.9rem; margin-bottom: 16px; }
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: sk 1.2s ease-in-out infinite;
      border-radius: var(--radius); height: 110px; margin-bottom: 12px;
    }
    @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: rgba(20, 22, 27, 0.96);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-b);
      height: calc(var(--nav-h) + var(--safe-b));
    }
    .bottom-nav button {
      border: none; background: transparent; color: var(--text-muted);
      font-size: 0.68rem; font-weight: 500; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; position: relative; font-family: inherit;
    }
    .bottom-nav button.active { color: var(--accent); font-weight: 700; }
    .bottom-nav .ico { font-size: 1.15rem; line-height: 1; }
    .nav-badge {
      position: absolute; top: 6px; right: calc(50% - 22px);
      background: var(--accent); color: #1a1408;
      font-size: 0.62rem; font-weight: 800;
      min-width: 16px; height: 16px; padding: 0 4px;
      border-radius: 8px; display: grid; place-items: center;
    }

    /* Floating cart summary */
    .fab-cart {
      position: fixed; left: 16px; right: 16px; z-index: 45;
      bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      background: linear-gradient(180deg, #d4b03a 0%, #c9a227 100%);
      color: #1a1408; border: none; border-radius: 14px;
      padding: 14px 18px; font-weight: 700; font-size: 0.9rem;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      cursor: pointer; font-family: inherit;
    }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }
    .lightbox img {
      max-width: 100%; max-height: 75vh; object-fit: contain;
      border-radius: 12px;
    }
    .lightbox .close {
      position: absolute; top: 16px; right: 16px;
      width: 44px; height: 44px; border-radius: 50%;
      border: none; background: rgba(255,255,255,0.12);
      color: #fff; font-size: 1.4rem; cursor: pointer;
    }
    .lb-dots {
      display: flex; gap: 6px; margin-top: 14px;
    }
    .lb-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
    }
    .lb-dots span.on { background: var(--accent); width: 18px; border-radius: 4px; }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      border: none; background: rgba(255,255,255,0.1);
      color: #fff; font-size: 1.2rem; cursor: pointer;
    }
    .lb-nav.prev { left: 12px; }
    .lb-nav.next { right: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
(function () {
  "use strict";
  var API = window.location.origin;
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("#0a0b0e");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#0a0b0e");
    } catch (e) {}
  }

  function money(n) {
    return Number(n || 0).toLocaleString("uz-UZ");
  }
  function getInitData() {
    if (tg && tg.initData) return tg.initData;
    return "";
  }
  function headers(json) {
    var h = {};
    if (json) h["Content-Type"] = "application/json";
    var init = getInitData();
    if (init) h["x-telegram-init-data"] = init;
    var demo = localStorage.getItem("demo_tg_id");
    if (demo) h["x-demo-telegram-id"] = demo;
    return h;
  }
  async function api(path, opts) {
    opts = opts || {};
    var res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: headers(!!opts.body),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok || data.ok === false) {
      throw new Error(data.error || res.statusText || "Xato");
    }
    return data;
  }

  var state = {
    tab: "catalog",
    catalog: [],
    settings: {},
    cart: JSON.parse(localStorage.getItem("bd_cart") || "{}"),
    customer: null,
    orders: [],
    msg: null,
    loading: true,
    phone: localStorage.getItem("bd_phone") || "",
    address: localStorage.getItem("bd_address") || "",
    note: "",
    lightbox: null,
    lbIndex: 0
  };

  function saveCart() {
    localStorage.setItem("bd_cart", JSON.stringify(state.cart));
  }
  function cartCount() {
    var n = 0;
    Object.keys(state.cart).forEach(function (id) { n += Number(state.cart[id]) || 0; });
    return n;
  }
  function cartTotal() {
    var t = 0;
    state.catalog.forEach(function (p) {
      t += (Number(state.cart[p.id]) || 0) * Number(p.price);
    });
    return t;
  }
  function setQty(id, delta) {
    var next = Math.max(0, (Number(state.cart[id]) || 0) + delta);
    if (next === 0) delete state.cart[id];
    else state.cart[id] = next;
    saveCart();
    render();
  }
  function imagesOf(p) {
    if (p.image_urls && p.image_urls.length) return p.image_urls;
    return [];
  }

  async function boot() {
    state.loading = true;
    render();
    try {
      if (!getInitData() && !localStorage.getItem("demo_tg_id")) {
        localStorage.setItem("demo_tg_id", "web-" + Date.now());
      }
      try {
        var auth = await api("/api/customer/auth/telegram", {
          method: "POST",
          body: { initData: getInitData() }
        });
        state.customer = auth.data;
        if (auth.data.phone) state.phone = auth.data.phone;
      } catch (e) {
        /* katalog ochiq qoladi */
      }
      var results = await Promise.all([
        api("/api/customer/catalog"),
        api("/api/customer/settings").catch(function () { return { data: {} }; })
      ]);
      state.catalog = results[0].data || [];
      state.settings = results[1].data || {};
      state.msg = null;
    } catch (e) {
      state.msg = { type: "err", text: e.message };
    }
    state.loading = false;
    render();
  }

  async function loadOrders() {
    try {
      var r = await api("/api/customer/orders");
      state.orders = r.data || [];
      state.msg = null;
    } catch (e) {
      state.msg = { type: "err", text: e.message };
    }
    render();
  }

  async function placeOrder() {
    var items = [];
    Object.keys(state.cart).forEach(function (id) {
      items.push({ product_id: Number(id), qty: Number(state.cart[id]) });
    });
    if (!items.length) {
      state.msg = { type: "err", text: "Savat bo'sh" };
      render();
      return;
    }
    if (!state.phone || String(state.phone).replace(/\D/g, "").length < 9) {
      state.msg = { type: "err", text: "To'liq telefon raqamini kiriting" };
      render();
      return;
    }
    try {
      localStorage.setItem("bd_phone", state.phone);
      localStorage.setItem("bd_address", state.address);
      var r = await api("/api/customer/orders", {
        method: "POST",
        body: {
          initData: getInitData(),
          items: items,
          phone: state.phone,
          address: state.address || null,
          note: state.note || null,
          paid_amount: 0
        }
      });
      state.cart = {};
      saveCart();
      state.msg = { type: "ok", text: "Buyurtma qabul qilindi: " + r.data.order_code };
      state.tab = "orders";
      await loadOrders();
    } catch (e) {
      state.msg = { type: "err", text: e.message };
      render();
    }
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "className") node.className = attrs[k];
        else if (k === "text") node.textContent = attrs[k];
        else if (k.indexOf("on") === 0) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (k === "src") node.src = attrs[k];
        else if (k === "href") node.href = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      if (typeof c === "string") node.appendChild(document.createTextNode(c));
      else node.appendChild(c);
    });
    return node;
  }

  function openLightbox(urls, index) {
    state.lightbox = urls;
    state.lbIndex = index || 0;
    render();
  }

  function renderHeader() {
    var phone = state.settings.customer_phone || "998880090506";
    var tglink = state.settings.customer_telegram || "https://t.me/briketkumir";
    var digits = String(phone).replace(/\D/g, "");
    return el("header", { className: "hdr" }, [
      el("div", { className: "hdr-row" }, [
        el("div", { className: "brand" }, [
          el("div", { className: "brand-mark" }, [
            el("img", { src: "/bd_logo.jpg", alt: "" })
          ]),
          el("div", { className: "brand-text" }, [
            el("h1", { text: "Black Diamond" }),
            el("p", { text: "Briket buyurtma" })
          ])
        ]),
        el("div", {
          className: "user-chip",
          text: state.customer ? state.customer.name : (tg ? "Telegram" : "Mehmon")
        })
      ]),
      el("div", { className: "contact-row" }, [
        el("a", { href: "tel:+" + digits, text: "Qo'ng'iroq" }),
        el("a", { href: tglink, text: "Telegram", target: "_blank", rel: "noopener" })
      ])
    ]);
  }

  function renderCatalog() {
    var wrap = el("div", { className: "page" });
    wrap.appendChild(el("div", { className: "section-title", text: "Katalog" }));
    if (state.loading) {
      wrap.appendChild(el("div", { className: "skeleton" }));
      wrap.appendChild(el("div", { className: "skeleton" }));
      wrap.appendChild(el("div", { className: "skeleton" }));
      return wrap;
    }
    if (!state.catalog.length) {
      wrap.appendChild(el("div", { className: "empty" }, [
        el("div", { className: "ico", text: "◇" }),
        el("p", { text: "Hozircha mahsulot yo'q" })
      ]));
      return wrap;
    }
    state.catalog.forEach(function (p) {
      var q = Number(state.cart[p.id]) || 0;
      var imgs = imagesOf(p);
      var imgWrap = el("div", { className: "prod-img-wrap" });
      if (imgs.length) {
        imgWrap.appendChild(el("img", {
          className: "prod-img",
          src: imgs[0],
          alt: p.sku,
          onClick: function () { openLightbox(imgs, 0); }
        }));
      } else {
        imgWrap.appendChild(el("div", { className: "prod-img placeholder", text: "Rasm yo'q" }));
      }
      var body = el("div", { className: "prod-body" }, [
        el("div", { className: "prod-sku", text: p.sku }),
        el("div", {
          className: "prod-meta",
          text: p.weight_kg + " kg" + (p.balance_qty > 0 ? " · omborda " + p.balance_qty + " dona" : "")
        })
      ]);
      if (p.description) {
        body.appendChild(el("div", { className: "prod-desc", text: p.description }));
      }
      var bottom = el("div", { className: "prod-bottom" }, [
        el("div", null, [
          el("div", { className: "prod-price", text: money(p.price) + " so'm" }),
          el("span", {
            className: "badge " + (p.in_stock ? "ok" : "out"),
            text: p.in_stock ? "Mavjud" : "Buyurtma qabul qilinadi"
          })
        ]),
        el("div", { className: "qty" }, [
          el("button", { type: "button", text: "−", onClick: function () { setQty(p.id, -1); } }),
          el("span", { text: String(q) }),
          el("button", { type: "button", text: "+", onClick: function () { setQty(p.id, 1); } })
        ])
      ]);
      body.appendChild(bottom);
      wrap.appendChild(el("div", { className: "card" }, [
        el("div", { className: "prod" }, [imgWrap, body])
      ]));
    });
    return wrap;
  }

  function renderCart() {
    var wrap = el("div", { className: "page" });
    wrap.appendChild(el("div", { className: "section-title", text: "Savat" }));
    var lines = state.catalog.filter(function (p) { return state.cart[p.id]; });
    if (!lines.length) {
      wrap.appendChild(el("div", { className: "empty" }, [
        el("div", { className: "ico", text: "◇" }),
        el("p", { text: "Savat bo'sh — katalogdan mahsulot qo'shing" }),
        el("button", {
          className: "btn",
          type: "button",
          text: "Katalogga o'tish",
          onClick: function () { state.tab = "catalog"; state.msg = null; render(); }
        })
      ]));
      return wrap;
    }
    var list = el("div", { className: "card" });
    lines.forEach(function (p) {
      var q = Number(state.cart[p.id]);
      var imgs = imagesOf(p);
      var kids = [];
      if (imgs.length) {
        kids.push(el("img", { src: imgs[0], alt: p.sku, onClick: function () { openLightbox(imgs, 0); } }));
      }
      kids.push(el("div", { className: "info" }, [
        el("div", { className: "sku", text: p.sku }),
        el("div", { className: "sub", text: q + " × " + money(p.price) + " so'm" }),
        el("div", { className: "line-total", text: money(q * Number(p.price)) + " so'm" }),
        el("div", { className: "qty", style: "margin-top:8px" }, [
          el("button", { type: "button", text: "−", onClick: function () { setQty(p.id, -1); } }),
          el("span", { text: String(q) }),
          el("button", { type: "button", text: "+", onClick: function () { setQty(p.id, 1); } })
        ])
      ]));
      list.appendChild(el("div", { className: "cart-line" }, kids));
    });
    wrap.appendChild(list);

    var form = el("div", { className: "card form-block" });
    form.appendChild(el("label", { text: "Telefon *" }));
    var phone = el("input", {
      type: "tel",
      placeholder: "+998 XX XXX XX XX",
      onInput: function (e) { state.phone = e.target.value; }
    });
    phone.value = state.phone;
    form.appendChild(phone);
    form.appendChild(el("label", { text: "Yetkazib berish manzili" }));
    var addr = el("input", {
      placeholder: "Shahar, mahalla, ko'cha...",
      onInput: function (e) { state.address = e.target.value; }
    });
    addr.value = state.address;
    form.appendChild(addr);
    form.appendChild(el("label", { text: "Izoh (ixtiyoriy)" }));
    var note = el("input", {
      placeholder: "Masalan: kechqurun yetkazilsin",
      onInput: function (e) { state.note = e.target.value; }
    });
    note.value = state.note;
    form.appendChild(note);
    form.appendChild(el("div", { className: "total-bar" }, [
      el("span", { className: "label", text: "Jami" }),
      el("span", { className: "sum", text: money(cartTotal()) + " so'm" })
    ]));
    form.appendChild(el("button", {
      className: "btn",
      type: "button",
      text: "Buyurtma berish",
      onClick: placeOrder
    }));
    wrap.appendChild(form);
    return wrap;
  }

  function renderOrders() {
    var wrap = el("div", { className: "page" });
    wrap.appendChild(el("div", { className: "section-title", text: "Buyurtmalar tarixi" }));
    if (!state.orders.length) {
      wrap.appendChild(el("div", { className: "empty" }, [
        el("div", { className: "ico", text: "◇" }),
        el("p", { text: "Hali buyurtma yo'q" })
      ]));
      return wrap;
    }
    var statusMap = {
      pending: { label: "Kutilmoqda", cls: "pending", note: "Admin tasdig'ini kuting", noteCls: "wait" },
      confirmed: { label: "Tasdiqlangan", cls: "confirmed", note: "Buyurtmangiz qabul qilindi", noteCls: "ok" },
      paid: { label: "To'langan", cls: "confirmed", note: "To'lov qabul qilindi", noteCls: "ok" },
      partial: { label: "Qisman to'langan", cls: "pending", note: null, noteCls: null },
      rejected: { label: "Rad etilgan", cls: "rejected", note: "Buyurtma rad etilgan", noteCls: "err" },
      cancelled: { label: "Bekor", cls: "rejected", note: null, noteCls: null },
      closed: { label: "Yopilgan", cls: "confirmed", note: null, noteCls: null }
    };
    state.orders.forEach(function (o) {
      var st = statusMap[o.status] || { label: o.status, cls: "pending", note: null };
      var head = el("div", { className: "order-head" }, [
        el("div", null, [
          el("div", { className: "order-code", text: o.order_code }),
          o.created_at
            ? el("div", { className: "order-date", text: new Date(o.created_at).toLocaleString("uz-UZ") })
            : null
        ]),
        el("span", { className: "badge " + st.cls, text: st.label })
      ]);
      var cardKids = [head];
      if (o.items && o.items.length) {
        cardKids.push(el("div", {
          className: "order-items",
          text: o.items.map(function (i) { return i.sku + " × " + i.qty; }).join(" · ")
        }));
      }
      cardKids.push(el("div", { className: "order-sum" }, [
        el("span", { text: Number(o.debt_amount) > 0 && o.status !== "rejected" ? "Qarz: " + money(o.debt_amount) : "Summa" }),
        el("strong", { text: money(o.total_amount) + " so'm" })
      ]));
      if (st.note) {
        cardKids.push(el("div", { className: "order-note " + st.noteCls, text: st.note }));
      }
      wrap.appendChild(el("div", { className: "card order-card" }, cardKids));
    });
    return wrap;
  }

  function renderLightbox() {
    if (!state.lightbox || !state.lightbox.length) return null;
    var urls = state.lightbox;
    var i = state.lbIndex;
    var kids = [
      el("button", {
        className: "close",
        type: "button",
        text: "×",
        onClick: function (e) { e.stopPropagation(); state.lightbox = null; render(); }
      }),
      el("img", { src: urls[i], alt: "" })
    ];
    if (urls.length > 1) {
      kids.push(el("button", {
        className: "lb-nav prev",
        type: "button",
        text: "‹",
        onClick: function (e) {
          e.stopPropagation();
          state.lbIndex = (i - 1 + urls.length) % urls.length;
          render();
        }
      }));
      kids.push(el("button", {
        className: "lb-nav next",
        type: "button",
        text: "›",
        onClick: function (e) {
          e.stopPropagation();
          state.lbIndex = (i + 1) % urls.length;
          render();
        }
      }));
      var dots = [];
      for (var d = 0; d < urls.length; d++) {
        dots.push(el("span", { className: d === i ? "on" : "" }));
      }
      kids.push(el("div", { className: "lb-dots" }, dots));
    }
    return el("div", {
      className: "lightbox",
      onClick: function () { state.lightbox = null; render(); }
    }, kids);
  }

  function render() {
    var root = document.getElementById("root");
    root.innerHTML = "";
    root.appendChild(renderHeader());

    var content =
      state.tab === "catalog" ? renderCatalog() :
      state.tab === "cart" ? renderCart() :
      renderOrders();

    if (state.msg) {
      content.insertBefore(
        el("div", { className: "toast " + state.msg.type, text: state.msg.text }),
        content.firstChild
      );
    }
    root.appendChild(content);

    var cc = cartCount();
    /* Floating CTA on catalog when cart has items */
    if (state.tab === "catalog" && cc > 0) {
      root.appendChild(el("button", {
        className: "fab-cart",
        type: "button",
        onClick: function () { state.tab = "cart"; state.msg = null; render(); }
      }, [
        el("span", { text: "Savat · " + cc + " dona" }),
        el("span", { text: money(cartTotal()) + " so'm →" })
      ]));
    }

    root.appendChild(el("nav", { className: "bottom-nav" }, [
      el("button", {
        type: "button",
        className: state.tab === "catalog" ? "active" : "",
        onClick: function () { state.tab = "catalog"; state.msg = null; render(); }
      }, [
        el("span", { className: "ico", text: "▣" }),
        document.createTextNode("Katalog")
      ]),
      el("button", {
        type: "button",
        className: state.tab === "cart" ? "active" : "",
        onClick: function () { state.tab = "cart"; state.msg = null; render(); }
      }, [
        el("span", { className: "ico", text: "◫" }),
        document.createTextNode("Savat"),
        cc ? el("span", { className: "nav-badge", text: String(cc) }) : null
      ]),
      el("button", {
        type: "button",
        className: state.tab === "orders" ? "active" : "",
        onClick: function () {
          state.tab = "orders";
          state.msg = null;
          loadOrders();
        }
      }, [
        el("span", { className: "ico", text: "☰" }),
        document.createTextNode("Buyurtmalar")
      ])
    ]));

    var lb = renderLightbox();
    if (lb) root.appendChild(lb);
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/mijoz-sw.js").catch(function () {});
  }
  boot();
})();
  </script>
</body>
</html>
