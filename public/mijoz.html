<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="color-scheme" content="dark" />
  <title>Black Diamond — Buyurtma</title>
  <link rel="manifest" href="/mijoz-manifest.webmanifest" />
  <link rel="icon" href="/bd_logo.jpg" type="image/jpeg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --bg: #0a0a0b;
      --surface: #141210;
      --surface-2: #1a1814;
      --border: #2e2a22;
      --border-hover: #3f3a30;
      --text: #f5f0e6;
      --text-secondary: #b0a894;
      --text-muted: #8a8270;
      --accent: #c9a227;
      --accent-hover: #a8841a;
      --accent-soft: rgba(201, 162, 39, 0.14);
      --ok: #22c55e;
      --ok-soft: rgba(34, 197, 94, 0.12);
      --warn: #eab308;
      --warn-soft: rgba(234, 179, 8, 0.12);
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      padding-bottom: calc(72px + max(12px, env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
      font-size: 15px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    html { background: var(--bg); }

    .top {
      background: linear-gradient(180deg, #1a1608 0%, var(--bg) 100%);
      padding: 20px 20px 24px; position: sticky; top: 0; z-index: 50;
      border-bottom: 1px solid var(--border);
    }
    .top h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); }
    .top p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }

    .container { padding: 16px; max-width: 560px; margin: 0 auto; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    }
    .card-title {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px;
    }

    label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; }
    input, textarea, select {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text); padding: 12px 14px;
      font-size: 15px; outline: none; transition: border-color .15s; font-family: inherit;
    }
    input:focus, textarea:focus { border-color: var(--accent); }

    .btn {
      width: 100%; border: none; border-radius: var(--radius-sm); padding: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      background: linear-gradient(180deg, #d4b03a 0%, #c9a227 45%, #a8841a 100%);
      color: #1a1408; margin-top: 14px; transition: filter .15s, transform .1s; font-family: inherit;
      box-shadow: 0 2px 10px rgba(201, 162, 39, 0.28);
    }
    .btn:active { transform: scale(0.98); filter: brightness(0.95); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-warn { background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); color: #1a1408; }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; margin: 0; }
    .btn-block { display: block; text-align: center; text-decoration: none; }
    .btn-added {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%) !important;
      color: #fff !important;
    }

    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(20,18,16,0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border); display: flex; z-index: 100;
      padding-top: 6px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px));
      box-shadow: 0 -2px 12px rgba(0,0,0,0.45);
    }
    .nav button {
      flex: 1; background: transparent; border: none; color: var(--text-muted);
      font-size: 11px; font-weight: 500; padding: 8px 4px; cursor: pointer;
      font-family: inherit; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      -webkit-text-fill-color: currentColor; opacity: 1;
    }
    .nav button.active { color: var(--text); }
    .nav svg { width: 22px; height: 22px; stroke-width: 1.7; }
    .nav button.active svg { stroke-width: 2.1; stroke: var(--accent); }
    .nav-icon-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
    .nav-badge {
      position: absolute; top: -6px; right: -10px;
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--accent); color: #1a1408; font-size: 11px; font-weight: 700;
      line-height: 18px; text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35); border: 1.5px solid var(--surface);
    }
    .nav-badge.warn { background: var(--warn); color: #1a1408; }

    .product {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
      transition: border-color .2s;
    }
    .product-img {
      position: relative;
      background: #ffffff;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 240px;
      overflow: hidden;
      cursor: pointer;
    }
    .product-img img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #ffffff;
    }
    .product-body { padding: 16px; }
    .product-body h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.02em; cursor: pointer; }

    .price-block { margin: 10px 0; }
    .price-main { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); }
    .price-main span { font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .price-bulk {
      margin-top: 8px; padding: 8px 12px;
      background: var(--ok-soft); border: 1px solid rgba(34,197,94,0.25);
      border-radius: 12px; font-size: 13px; color: #86efac;
    }
    .price-bulk strong { color: #bbf7d0; }
    .price-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; margin: 10px 0; }
    .badge-soft {
      display: inline-flex; align-items: center; font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 20px; background: var(--accent-soft); color: #e8d5a3;
    }

    .stock-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-secondary); margin-top: 6px;
    }
    .stock-ok { color: var(--ok); font-weight: 600; }
    .stock-out { color: var(--warn); font-weight: 600; }

    .qty-row {
      display: flex; align-items: center; gap: 8px; margin-top: 12px;
    }
    .qty-row button {
      width: 42px; height: 42px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .qty-row input {
      width: 56px; text-align: center; padding: 10px 4px; font-size: 16px; flex-shrink: 0;
    }
    .qty-row .btn { flex: 1; margin-top: 0; padding: 12px 8px; font-size: 14px; white-space: nowrap; min-width: 0; }

    .qty-actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 14px; }
    .qty-actions .qty-label {
      font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: -2px;
    }
    .qty-actions .row { display: flex; align-items: center; gap: 8px; }
    .qty-actions .row button.qbtn {
      width: 44px; height: 44px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .qty-actions .row input {
      flex: 1; min-width: 72px; max-width: 120px;
      text-align: center; padding: 11px 6px; font-size: 18px; font-weight: 700;
      border: 2px solid var(--accent); background: var(--surface-2); border-radius: var(--radius-sm);
    }
    .qty-actions .row input::placeholder { color: #888; font-weight: 500; font-size: 13px; }
    .qty-actions .qty-hint { font-size: 12px; color: var(--text-muted); line-height: 1.35; }

    .detail-page {
      position: fixed; inset: 0; z-index: 80; background: var(--bg);
      overflow-y: auto;
      padding-bottom: calc(130px + env(safe-area-inset-bottom, 0px));
    }
    .detail-header {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 12px; display: flex; align-items: center; gap: 10px;
    }
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(180deg, #d4b03a 0%, #c9a227 100%); color: #1a1408; border: none;
      border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0;
    }
    .detail-back:active { transform: scale(0.97); background: var(--accent-hover); }
    .detail-header h2 {
      font-size: 15px; font-weight: 600; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detail-gallery {
      position: relative;
      background: #ffffff;
      aspect-ratio: 1 / 1;
      max-height: 55vh;
      min-height: 220px;
      overflow: hidden;
    }
    .detail-gallery img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #ffffff;
    }
    .gallery-ctrl {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: none; color: #fff;
      font-size: 22px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; z-index: 5;
      line-height: 1; padding: 0;
    }
    .gallery-ctrl.prev { left: 10px; } .gallery-ctrl.next { right: 10px; }
    .gallery-dots {
      position: absolute; bottom: 12px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 6px; z-index: 5;
    }
    .gallery-dots span {
      width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3);
    }
    .gallery-dots span.on { background: #fff; width: 18px; border-radius: 4px; }
    .detail-body { padding: 16px; }
    .detail-desc {
      font-size: 14px; color: var(--text-secondary); line-height: 1.6;
      margin-top: 14px; white-space: pre-line;
    }
    .detail-actions {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(20,18,16,0.96); backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding: 14px 14px calc(14px + max(16px, env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
      z-index: 90; box-shadow: 0 -4px 16px rgba(0,0,0,0.35);
    }
    .detail-actions .qty-row { gap: 8px; }
    .detail-actions .qty-row button:not(.btn) { width: 48px; height: 48px; font-size: 22px; }
    .detail-actions .qty-row input { width: 56px; height: 48px; font-size: 18px; font-weight: 700; }
    .detail-actions .qty-row .btn { height: 48px; font-size: 16px; padding: 0 16px; }

    .lightbox {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.94);
      display: flex; align-items: center; justify-content: center; flex-direction: column;
    }
    .lightbox img { max-width: 94vw; max-height: 78vh; object-fit: contain; border-radius: 8px; }
    .lightbox-close {
      position: absolute; top: max(12px, env(safe-area-inset-top, 12px)); right: 14px;
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: none; color: #fff;
      font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .lightbox-nav.prev { left: 16px; } .lightbox-nav.next { right: 16px; }
    .lightbox-counter { margin-top: 16px; color: #a1a1aa; font-size: 13px; font-weight: 500; }
    .lightbox-hint {
      position: absolute; bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 0; right: 0; text-align: center; color: rgba(255,255,255,0.6); font-size: 13px; pointer-events: none;
    }

    .cart-item {
      display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 12px; background: #0d0d0f; flex-shrink: 0;
    }
    .cart-item .info { flex: 1; min-width: 0; }
    .cart-item .info strong { font-size: 15px; }
    .later-badge {
      display: inline-block; font-size: 11px; padding: 3px 8px;
      border-radius: 6px; background: var(--warn-soft); color: var(--warn);
      margin-top: 4px; font-weight: 500;
    }
    .total-box {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-top: 16px;
    }
    .total-box .row { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
    .total-box .big { font-size: 18px; font-weight: 700; color: var(--text); margin-top: 8px; }
    .bulk-note {
      background: var(--ok-soft); border: 1px solid rgba(34,197,94,0.25);
      border-radius: 12px; padding: 10px 12px; margin-top: 10px;
      font-size: 13px; color: #86efac;
    }
    .pay-note {
      font-size: 13px; color: var(--text-secondary); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 14px 0 4px; line-height: 1.5;
    }

    .toast {
      position: fixed; left: 16px; right: 16px;
      bottom: calc(96px + max(12px, env(safe-area-inset-bottom, 0px), var(--tg-safe-bottom, 0px)));
      z-index: 200; padding: 14px 16px; border-radius: 14px; font-size: 14px; font-weight: 500;
      box-shadow: var(--shadow); max-width: 560px; margin: 0 auto;
    }
    .toast.ok { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
    .toast.err { background: #450a0a; color: #fecaca; border: 1px solid #ef4444; }

    .empty { text-align: center; color: var(--text-muted); padding: 48px 20px; font-size: 14px; }
    .empty-icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
      border-radius: 50%; background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .empty-title { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .empty-desc {
      font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 18px;
      max-width: 280px; margin-left: auto; margin-right: auto;
    }

    .tip-banner {
      background: linear-gradient(135deg, rgba(201,162,39,0.16), rgba(201,162,39,0.05));
      border: 1px solid rgba(201,162,39,0.32);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 14px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .tip-banner .tip-text { flex: 1; font-size: 13px; color: #e8d5a3; line-height: 1.45; }
    .tip-banner .tip-text strong { color: #f5e6b8; }
    .tip-banner .tip-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; flex-shrink: 0;
    }

    .success-panel { text-align: center; padding: 36px 20px 24px; }
    .success-panel .success-icon {
      width: 72px; height: 72px; margin: 0 auto 16px;
      border-radius: 50%; background: var(--ok-soft);
      border: 2px solid rgba(34,197,94,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; color: var(--ok);
    }
    .success-panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .success-panel p { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }

    .skeleton-wrap { padding: 4px 0 12px; }
    .skeleton-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: 14px;
    }
    .skeleton-img {
      aspect-ratio: 1/1;
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite;
    }
    .skeleton-body { padding: 14px; }
    .skeleton-line {
      height: 14px; border-radius: 6px; margin-bottom: 10px;
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite;
    }
    .skeleton-line.sm { width: 40%; height: 12px; }
    .skeleton-line.md { width: 70%; }
    .skeleton-line.lg { width: 55%; height: 22px; margin-top: 6px; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .product-img img, .detail-gallery img, .cart-item img {
      opacity: 0; transition: opacity 0.35s ease;
    }
    .product-img img.loaded, .detail-gallery img.loaded, .cart-item img.loaded { opacity: 1; }

    .order-timeline {
      display: flex; align-items: center; gap: 0; margin: 10px 0 6px; padding: 0 2px;
    }
    .tl-step {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
    }
    .tl-step:not(:last-child)::after {
      content: ''; position: absolute; top: 7px; left: 50%; right: -50%;
      height: 2px; background: var(--border); z-index: 0;
    }
    .tl-step.done:not(:last-child)::after { background: var(--ok); }
    .tl-step.active:not(:last-child)::after {
      background: linear-gradient(90deg, var(--accent), var(--border));
    }
    .tl-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--border); border: 2px solid var(--surface);
      z-index: 1; position: relative;
    }
    .tl-step.done .tl-dot { background: var(--ok); border-color: rgba(34,197,94,0.4); }
    .tl-step.active .tl-dot {
      background: var(--accent); border-color: rgba(201,162,39,0.5);
      box-shadow: 0 0 0 3px rgba(201,162,39,0.2);
    }
    .tl-step.fail .tl-dot { background: var(--danger); border-color: rgba(239,68,68,0.4); }
    .tl-label { font-size: 10px; color: var(--text-muted); text-align: center; line-height: 1.2; }
    .tl-step.done .tl-label { color: #86efac; }
    .tl-step.active .tl-label { color: var(--accent); font-weight: 600; }
    .tl-step.fail .tl-label { color: #fca5a5; }

    .loading {
      text-align: center; padding: 56px 16px; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.12);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    .spinner.sm {
      width: 18px; height: 18px; border-width: 2.5px;
      border-color: rgba(255,255,255,0.25); border-top-color: #fff;
      display: inline-block; vertical-align: middle; flex-shrink: 0;
    }
    .spinner.sm.dark {
      border-color: rgba(0,0,0,0.15); border-top-color: #111;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--text-muted); letter-spacing: 0.02em; }
    .btn-loading { display: inline-flex; align-items: center; justify-content: center; gap: 10px; }

    .meta { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
    .order-card { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .order-card:last-child { border-bottom: none; }
    .badge {
      display: inline-block; font-size: 11px; padding: 3px 8px;
      border-radius: 6px; font-weight: 600; margin-left: 6px;
    }
    .badge-wait { background: var(--warn-soft); color: var(--warn); }
    .badge-ok { background: var(--ok-soft); color: var(--ok); }
    .badge-no { background: rgba(239,68,68,0.12); color: var(--danger); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">

const { useState, useEffect, useCallback, useMemo, useRef } = React;

const API = window.location.origin;
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#0a0a0b');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#0a0a0b');
  } catch (e) {}
}

function money(n) {
  return Number(n || 0).toLocaleString('uz-UZ');
}

function getInitData() {
  return (tg && tg.initData) ? tg.initData : '';
}

function demoId() {
  let id = localStorage.getItem('demo_tg_id');
  if (!id) {
    id = 'web-' + Date.now();
    localStorage.setItem('demo_tg_id', id);
  }
  return id;
}

function apiHeaders(json) {
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  const init = getInitData();
  if (init) h['x-telegram-init-data'] = init;
  h['x-demo-telegram-id'] = demoId();
  return h;
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: apiHeaders(!!opts.body),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || data.ok === false) throw new Error(data.error || res.statusText || 'Xato');
  return data;
}

function productImages(p) {
  if (p.image_urls && p.image_urls.length) return p.image_urls;
  return [];
}

/* DB price = yirik (chegirmali). Asosiy = price + bulk_discount */
function prices(p, settings) {
  const disc = Number(settings.bulk_discount) || 3000;
  const yirik = Number(p.price) || 0;
  const asosiy = yirik + disc;
  const minQty = Number(settings.bulk_min_qty) || 500;
  return { asosiy, yirik, disc, minQty };
}

function unitPrice(p, qty, settings) {
  const { asosiy, yirik, minQty } = prices(p, settings);
  return (Number(qty) || 0) >= minQty ? yirik : asosiy;
}

function Toast({ msg }) {
  if (!msg) return null;
  return <div className={'toast ' + (msg.err ? 'err' : 'ok')}>{msg.text}</div>;
}

function Loading({ text }) {
  return <div className="loading">{text || 'Yuklanmoqda...'}</div>;
}

function Gallery({ images, alt }) {
  const [i, setI] = useState(0);
  if (!images || !images.length) {
    return <div className="product-img" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#666', minHeight: 240 }}>Rasm yo‘q</div>;
  }
  const n = images.length;
  return (
    <div className="product-img" style={{ position: 'relative' }}>
      <img src={images[i]} alt={alt || ''} loading="lazy" />
      {n > 1 && (
        <>
          <button type="button" className="gallery-ctrl prev" onClick={(e) => { e.stopPropagation(); setI((i - 1 + n) % n); }}>‹</button>
          <button type="button" className="gallery-ctrl next" onClick={(e) => { e.stopPropagation(); setI((i + 1) % n); }}>›</button>
          <div className="gallery-dots">{images.map((_, d) => <span key={d} className={d === i ? 'on' : ''} />)}</div>
        </>
      )}
    </div>
  );
}

function Lightbox({ images, index, onClose }) {
  const [i, setI] = useState(index || 0);
  if (!images || !images.length) return null;
  const n = images.length;
  return (
    <div className="lightbox" onClick={onClose}>
      <button type="button" className="lightbox-close" onClick={onClose}>×</button>
      {n > 1 && (
        <>
          <button type="button" className="lightbox-nav prev" onClick={(e) => { e.stopPropagation(); setI((i - 1 + n) % n); }}>‹</button>
          <button type="button" className="lightbox-nav next" onClick={(e) => { e.stopPropagation(); setI((i + 1) % n); }}>›</button>
        </>
      )}
      <img src={images[i]} alt="" onClick={(e) => e.stopPropagation()} />
      {n > 1 && <div className="lightbox-counter">{i + 1} / {n}</div>}
    </div>
  );
}

  const [qtyStr, setQtyStr] = useState('0');

  const imgs = productImages(p);

  return (
    <div className="product">
      <div onClick={() => imgs.length && onLightbox(imgs, 0)}>
        <Gallery images={imgs} alt={p.sku} />
      </div>
      <div className="product-body">
        <h3 onClick={() => onDetail(p)}>{p.sku}</h3>
        <div className="price-block">

        <div className="stock-row">

            <button type="button" className="qbtn" onClick={() => setQtyStr(String(qty + 1))}>+</button>

function Savat({ cart, katalog, settings, user, setCart, showMsg, onOrdered, onGoCatalog }) {
  const [tolangan, setTolangan] = useState('');
  const [muddat, setMuddat] = useState('');
  const [izoh, setIzoh] = useState('');
  const [phone, setPhone] = useState(user.phone || localStorage.getItem('bd_phone') || '');
  const [address, setAddress] = useState(localStorage.getItem('bd_address') || '');
  const [busy, setBusy] = useState(false);
  const [qtyStr, setQtyStr] = useState({});

  const map = {};
  (katalog || []).forEach((p) => { map[p.id] = p; });

  const lines = cart.map((c) => {
    const p = map[c.id];
    if (!p) return null;
    const up = unitPrice(p, c.qty, settings);
    return { p, qty: c.qty, up, sum: up * c.qty };
  }).filter(Boolean);

  const jamiDona = lines.reduce((s, l) => s + l.qty, 0);
  const jamiKg = lines.reduce((s, l) => s + l.qty * (Number(l.p.weight_kg) || 0), 0);
  const jami = lines.reduce((s, l) => s + l.sum, 0);
  const minQty = Number(settings.bulk_min_qty) || 500;
  const yirik = jamiDona >= minQty;
  const hasLater = lines.some((l) => (Number(l.p.balance_qty) || 0) <= 0);

  const maxDate = () => {
    const d = new Date();
    d.setDate(d.getDate() + 7);
    return d.toISOString().slice(0, 10);
  };
  const minDate = () => new Date().toISOString().slice(0, 10);

  const setQty = (id, n) => {
    n = Math.max(0, Math.floor(Number(n) || 0));
    setCart((prev) => {
      const next = prev.map((x) => (x.id === id ? { ...x, qty: n } : x)).filter((x) => x.qty > 0);
      localStorage.setItem('bd_cart_v2', JSON.stringify(next));
      return next;
    });
  };

  if (!cart.length) {
    return (
      <div className="container">
        <div className="empty">
          <div className="empty-icon">🛒</div>
          <div className="empty-title">Savat bo‘sh</div>
          <div className="empty-desc">Katalogdan mahsulot tanlab, miqdorni yozing va savatga qo‘shing.</div>
          <button className="btn" style={{ maxWidth: 240, margin: '0 auto' }} onClick={onGoCatalog}>Katalogga o‘tish</button>
        </div>
      </div>
    );
  }

  const submit = async () => {
    if (!phone || String(phone).replace(/\D/g, '').length < 9) {
      showMsg('Telefon raqamini to‘liq kiriting', true);
      return;
    }
    const tol = Math.max(0, Number(String(tolangan).replace(/\s/g, '')) || 0);
    const qarz = Math.max(0, jami - tol);
    if (qarz > 0 && !muddat) {
      showMsg('Qarz bo‘lsa, qaytarish sanasini tanlang', true);
      return;
    }
    setBusy(true);
    try {
      localStorage.setItem('bd_phone', phone);
      localStorage.setItem('bd_address', address);
      const r = await api('/api/customer/orders', {
        method: 'POST',
        body: {
          initData: getInitData(),
          items: cart.map((c) => ({ product_id: c.id, qty: c.qty })),
          phone,
          address: address || null,
          note: [izoh, muddat ? ('Qarz muddati: ' + muddat) : ''].filter(Boolean).join(' | ') || null,
          paid_amount: tol
        }
      });
      setCart([]);
      localStorage.setItem('bd_cart_v2', '[]');
      showMsg('Buyurtma qabul qilindi: ' + r.data.order_code, false);
      onOrdered(r.data);
    } catch (e) {
      showMsg(e.message, true);
    }
    setBusy(false);
  };

  return (
    <div className="container">
      <div className="card">
        <div className="card-title">Savat</div>
        <div className="meta" style={{ marginBottom: 10 }}>{user.name || 'Mijoz'} · {phone || '—'}</div>

        {lines.map((l) => {
          const display = qtyStr[l.p.id] !== undefined ? qtyStr[l.p.id] : String(l.qty);
          const out = (Number(l.p.balance_qty) || 0) <= 0;
          const imgs = productImages(l.p);
          return (
            <div className="cart-item" key={l.p.id}>
              {imgs[0]
                ? <img src={imgs[0]} alt="" loading="lazy" />
                : <div style={{ width: 72, height: 72, background: '#0d0d0f', borderRadius: 12 }} />}
              <div className="info">
                <strong>{l.p.sku}</strong>
                {out && <div className="later-badge">Savatga (3–7 kun)</div>}
                <div className="meta">{money(l.sum)} so‘m</div>
                <div className="qty-row" style={{ marginTop: 8 }}>
                  <button type="button" onClick={() => { setQtyStr({ ...qtyStr, [l.p.id]: undefined }); setQty(l.p.id, l.qty - 1); }}>−</button>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={display}
                    onChange={(e) => setQtyStr({ ...qtyStr, [l.p.id]: e.target.value.replace(/\D/g, '') })}
                    onBlur={() => {
                      const n = parseInt(qtyStr[l.p.id], 10);
                      setQtyStr({ ...qtyStr, [l.p.id]: undefined });
                      setQty(l.p.id, isNaN(n) ? 0 : n);
                    }}
                  />
                  <button type="button" onClick={() => { setQtyStr({ ...qtyStr, [l.p.id]: undefined }); setQty(l.p.id, l.qty + 1); }}>+</button>
                </div>
              </div>
            </div>
          );
        })}

        <div className="total-box">
          <div className="row"><span>Jami dona</span><span>{jamiDona}</span></div>
          <div className="row"><span>Jami kg</span><span>{jamiKg.toFixed(1)}</span></div>
          <div className="row"><span>Narx turi</span><span>{yirik ? 'Yirik (500+ chegirma)' : 'Oddiy narx'}</span></div>
          <div className="row big"><span>Jami summa</span><span>{money(jami)} so‘m</span></div>
        </div>

        {yirik && (
          <div className="bulk-note">Siz {minQty}+ dona xarid qilyapsiz — yirik chegirma qo‘llanmoqda.</div>
        )}
        {hasLater && (
          <div className="pay-note" style={{ borderColor: 'rgba(234,179,8,0.3)' }}>
            Ba’zi mahsulotlar hozir omborda yo‘q. Ular 3–7 kunda tayyor bo‘ladi.
          </div>
        )}
        <div className="pay-note">
          Buyurtma qabul qilingandan keyin <b>naqd</b> yoki <b>karta</b> orqali to‘lanadi.
        </div>

        <label>Telefon *</label>
        <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+998 ..." />

        <label>Manzil</label>
        <input value={address} onChange={(e) => setAddress(e.target.value)} placeholder="Yetkazib berish manzili" />

        <label>Naqd to‘lanadigan summa</label>
        <input type="number" value={tolangan} onChange={(e) => setTolangan(e.target.value)} placeholder="0" />

        <label>Qarz qaytarish sanasi (max 7 kun)</label>
        <input type="date" value={muddat} min={minDate()} max={maxDate()} onChange={(e) => setMuddat(e.target.value)} />

        <label>Izoh (ixtiyoriy)</label>
        <textarea rows={2} value={izoh} onChange={(e) => setIzoh(e.target.value)} placeholder="Masalan: manzilingiz" />

        <button className="btn" disabled={busy} onClick={submit}>
          {busy ? 'Buyurtma yuborilmoqda...' : 'Buyurtmani yuborish'}
        </button>
        <button className="btn btn-secondary" onClick={() => { setCart([]); localStorage.setItem('bd_cart_v2', '[]'); }}>
          Savatni tozalash
        </button>
      </div>
    </div>
  );
}

function Buyurtmalar({ orders, loading, onReload, orderSuccess, onClearSuccess, onGoCatalog }) {
  if (orderSuccess) {
    return (
      <div className="container">
        <div className="card">
          <div className="success-panel">
            <div className="success-icon">✓</div>
            <h3>Buyurtma qabul qilindi</h3>
            <p>Tez orada siz bilan bog‘lanamiz.<br />Holatni shu yerda kuzatishingiz mumkin.</p>
            <button className="btn" onClick={() => { onClearSuccess(); onReload(); }}>Buyurtmalarni ko‘rish</button>
            <button className="btn btn-secondary" onClick={onGoCatalog}>Katalogga qaytish</button>
          </div>
        </div>
      </div>
    );
  }

  if (loading) return <div className="container"><Loading text="Buyurtmalar yuklanmoqda..." /></div>;

  if (!orders.length) {
    return (
      <div className="container">
        <div className="empty">
          <div className="empty-icon">📋</div>
          <div className="empty-title">Hali buyurtma yo‘q</div>
          <div className="empty-desc">Birinchi buyurtmangizni bering — holatni shu yerda kuzatasiz.</div>
          <button className="btn" style={{ maxWidth: 240, margin: '0 auto' }} onClick={onGoCatalog}>Katalogga o‘tish</button>
        </div>
      </div>
    );
  }

  const normalizeStatus = (raw) => {
    const low = String(raw || '').toLowerCase();
    if (!low || low === 'pending' || low === 'yangi' || low === 'kutilmoqda') {
      return { badgeCls: 'badge-wait', text: 'Ko‘rib chiqilmoqda' };
    }
    if (low.indexOf('confirm') >= 0 || low.indexOf('tasdiq') >= 0 || low === 'paid' || low === 'closed') {
      return { badgeCls: 'badge-ok', text: low === 'paid' ? 'To‘langan' : 'Tasdiqlandi' };
    }
    if (low.indexOf('reject') >= 0 || low.indexOf('rad') >= 0 || low.indexOf('cancel') >= 0) {
      return { badgeCls: 'badge-no', text: 'Rad etildi' };
    }
    return { badgeCls: 'badge-wait', text: raw };
  };

  return (
    <div className="container">
      <div className="card">
        <div className="card-title">Buyurtmalarim</div>
        {orders.map((b) => {
          const st = normalizeStatus(b.status);
          return (
            <div className="order-card" key={b.id}>
              <strong>{b.order_code}</strong>
              <span className={'badge ' + st.badgeCls}>{st.text}</span>
              <div className="meta">{b.created_at ? new Date(b.created_at).toLocaleString('uz-UZ') : ''}</div>
              {(b.items || []).map((it, i) => (
                <div className="meta" key={i}>• {it.sku} × {it.qty}</div>
              ))}
              <div className="meta">
                Jami: {money(b.total_amount)} · To‘lov: {money(b.paid_amount)} · Qarz: {money(b.debt_amount)}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

        <div className="card-title">Aloqa</div>
        <p style={{ fontSize: 14, marginBottom: 12 }}>
          Siz: <b>{user.name || 'Mijoz'}</b><br />
          {user.phone || '—'}
        </p>
        <a className="btn btn-block" href={'tel:+' + digits} style={{ textDecoration: 'none' }}>
          Qo‘ng‘iroq qilish: +{digits}
        </a>
        <a className="btn btn-secondary btn-block" href={tgl} target="_blank" rel="noreferrer" style={{ textDecoration: 'none' }}>
          Telegram
        </a>
      </div>
    </div>
  );
}

function Nav({ tab, setTab, cartCount, onOrders }) {
  const Icon = ({ d }) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d={d} strokeLinecap="round" strokeLinejoin="round" /></svg>
  );
  return (
    <nav className="nav">
      <button type="button" className={tab === 'catalog' ? 'active' : ''} onClick={() => setTab('catalog')}>
        <span className="nav-icon-wrap"><Icon d="M4 6h16M4 12h16M4 18h16" /></span>
        Katalog
      </button>
      <button type="button" className={tab === 'cart' ? 'active' : ''} onClick={() => setTab('cart')}>
        <span className="nav-icon-wrap">
          <Icon d="M3 3h2l.4 2M7 13h10l3-8H6.4M7 13L5.4 5M7 13l-1.5 6h13M10 19a1 1 0 100 2 1 1 0 000-2zm8 0a1 1 0 100 2 1 1 0 000-2z" />
          {cartCount > 0 && <span className="nav-badge">{cartCount}</span>}
        </span>
        Savat
      </button>
      <button type="button" className={tab === 'orders' ? 'active' : ''} onClick={() => { setTab('orders'); onOrders(); }}>
        <span className="nav-icon-wrap"><Icon d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></span>
        Buyurtmalar
      </button>
      <button type="button" className={tab === 'aloqa' ? 'active' : ''} onClick={() => setTab('aloqa')}>
        <span className="nav-icon-wrap"><Icon d="M3 5a2 2 0 012-2h3.28a1 1 0 01.95.68l1.5 4.5a1 1 0 01-.5 1.21l-2.26 1.13a11 11 0 005.52 5.52l1.13-2.26a1 1 0 011.21-.5l4.5 1.5a1 1 0 01.68.95V19a2 2 0 01-2 2h-1C9.72 21 3 14.28 3 6V5z" /></span>
        Aloqa
      </button>
    </nav>
  );
}

function App() {
  const [tab, setTab] = useState('catalog');
  const [katalog, setKatalog] = useState([]);
  const [settings, setSettings] = useState({
    bulk_discount: '3000',
    bulk_min_qty: '500',
    customer_phone: '998880090506',
    customer_telegram: 'https://t.me/briketkumir'
  });
  const [cart, setCart] = useState(() => {
    try { return JSON.parse(localStorage.getItem('bd_cart_v2') || '[]'); } catch (e) { return []; }
  });
  const [user, setUser] = useState({ name: 'Mijoz', phone: '' });
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [ordersLoading, setOrdersLoading] = useState(false);
  const [msg, setMsg] = useState(null);
  const [detail, setDetail] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [tipOpen, setTipOpen] = useState(localStorage.getItem('bd_tip_closed') !== '1');
  const [orderSuccess, setOrderSuccess] = useState(null);
  const msgTimer = useRef(null);

  const showMsg = useCallback((text, err) => {
    setMsg({ text, err: !!err });
    if (msgTimer.current) clearTimeout(msgTimer.current);
    msgTimer.current = setTimeout(() => setMsg(null), 4000);
  }, []);

  const loadCatalog = useCallback(async () => {
    setLoading(true);
    try {
      try {
        const auth = await api('/api/customer/auth/telegram', { method: 'POST', body: { initData: getInitData() } });
        setUser({ name: auth.data.name || 'Mijoz', phone: auth.data.phone || '' });
      } catch (e) {}
      const cat = await api('/api/customer/catalog');
      setKatalog(cat.data || []);
      try {
        const st = await api('/api/customer/settings');
        setSettings((s) => Object.assign({}, s, st.data || {}));
      } catch (e) {}
    } catch (e) {
      showMsg(e.message, true);
    }
    setLoading(false);
  }, [showMsg]);

  useEffect(() => { loadCatalog(); }, [loadCatalog]);

  const addToCart = (p, qty) => {
    setCart((prev) => {
      const i = prev.findIndex((x) => x.id === p.id);
      let next;
      if (i >= 0) {
        next = prev.slice();
        next[i] = { id: p.id, qty: next[i].qty + qty };
      } else {
        next = prev.concat([{ id: p.id, qty }]);
      }
      localStorage.setItem('bd_cart_v2', JSON.stringify(next));
      return next;
    });
    showMsg('Savatga qo‘shildi', false);
  };

  const loadOrders = async () => {
    setOrdersLoading(true);
    try {
      const r = await api('/api/customer/orders');
      setOrders(r.data || []);
    } catch (e) {
      showMsg(e.message, true);
    }
    setOrdersLoading(false);
  };

  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  return (
    <>
      {tab === 'catalog' && !detail && (
        <Catalog
          katalog={katalog}
          settings={settings}
          loading={loading}
          onAdd={addToCart}
          onDetail={setDetail}
          onLightbox={(imgs, i) => setLightbox({ images: imgs, index: i })}
          tipOpen={tipOpen}
          setTipOpen={setTipOpen}
          onRefresh={loadCatalog}
        />
      )}
      {tab === 'cart' && !detail && (
        <Savat
          cart={cart}
          katalog={katalog}
          settings={settings}
          user={user}
          setCart={setCart}
          showMsg={showMsg}
          onOrdered={(o) => { setOrderSuccess(o); setTab('orders'); }}
          onGoCatalog={() => setTab('catalog')}
        />
      )}
      {tab === 'orders' && !detail && (
        <Buyurtmalar
          orders={orders}
          loading={ordersLoading}
          onReload={loadOrders}
          orderSuccess={orderSuccess}
          onClearSuccess={() => setOrderSuccess(null)}
          onGoCatalog={() => setTab('catalog')}
        />
      )}
      {tab === 'aloqa' && !detail && <Aloqa user={user} settings={settings} />}

      {detail && (
        <DetailPage
          p={detail}
          settings={settings}
          onClose={() => setDetail(null)}
          onAdd={addToCart}
          showMsg={showMsg}
        />
      )}
      {lightbox && (
        <Lightbox images={lightbox.images} index={lightbox.index} onClose={() => setLightbox(null)} />
      )}

      {!detail && (
        <Nav tab={tab} setTab={setTab} cartCount={cartCount} onOrders={loadOrders} />
      )}
      <Toast msg={msg} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
