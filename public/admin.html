<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe4" />
  <meta name="color-scheme" content="light" />
  <title>Black Diamond — Operatsion tizim</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      function readyTg() {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          if (tg.expand) tg.expand();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        } catch (e) {}
      }
      readyTg();
      document.addEventListener("DOMContentLoaded", readyTg);
      window.addEventListener("pageshow", readyTg);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script type="text/babel" src="/admin-v2-components.jsx"></script>
  <style>
    /* ========== Design tokens - Black Diamond ERP ========== */
    :root {
      /* Black Diamond OPS — ochiq fon, oltin aksent (ko'chada o'qiladi) */
      --bg: #f4efe4;
      --bg-mid: #efe8d8;
      --bg-elevated: #fffdf8;
      --card: #ffffff;
      --card-hover: #f7f1e4;
      --border: #d9d0b8;
      --border-subtle: #e6decc;
      --text: #1c1914;
      --muted: #6b6456;
      --accent: #9a7b14;
      --accent-hover: #7e640e;
      --accent-muted: rgba(154, 123, 20, 0.14);
      --accent-text: #fffdf6;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --warning: #92400e;
      --warning-bg: #fef3c7;
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.12);
      --info: #38bdf8;
      --info-bg: rgba(56, 189, 248, 0.12);
      --radius-sm: 6px;
      --radius: 8px;
      --radius-lg: 10px;
      --shadow: 0 8px 24px rgba(40, 32, 12, 0.08);
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      --fs-label: 0.75rem;
      --fs-body: 0.8125rem;
      --fs-body-lg: 0.875rem;
      --fs-title: 1rem;
      --fs-kpi: 1.35rem;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --row-h: 34px;
      --nav-h: 64px;
      --sidebar-w: 220px;
      --focus-ring: 0 0 0 3px var(--accent-muted);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      font-size: var(--fs-body-lg);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
    }
    button, input, select, textarea { font-family: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .shell { min-height: 100vh; }

    /* Eski Index.html qobig'i: sticky header + 4 pastki menyu */
    .header {
      background: rgba(255,253,248,0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 12px;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      display: flex; align-items: center; gap: 12px;
      max-width: 640px; margin: 0 auto;
    }
    .header-role {
      font-size: 10px; color: var(--accent); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .header-mark {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(145deg, #d4b03a 0%, #c9a227 50%, #8a6f12 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(201,162,39,0.4);
    }
    .header-mark img { width: 100%; height: 100%; object-fit: cover; }
    .header h1 {
      font-size: 17px; font-weight: 700; letter-spacing: -0.03em;
      color: var(--text); line-height: 1.2;
    }
    .header p {
      font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500;
    }
    .header-right {
      margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    }
    .header .logout-btn { width: auto; margin: 0; padding: 6px 10px; }

    .main {
      padding: 14px 16px 28px;
      max-width: 640px; margin: 0 auto;
    }

    /* Segment (sub-tabs) — eski .segments */
    .segment {
      display: flex; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 3px; margin-bottom: 16px; gap: 2px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .segment::-webkit-scrollbar { display: none; }
    .segment button {
      flex: 1; min-width: 72px; border: none; background: transparent;
      color: var(--muted); padding: 8px 8px; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      white-space: nowrap;
    }
    .segment button.active {
      background: linear-gradient(180deg, #d4b03a 0%, #c9a227 100%);
      color: #1a1408; box-shadow: 0 2px 8px rgba(201,162,39,0.3);
    }
    .segment button:hover:not(.active) { color: var(--text); }
    .segment button:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
      display: flex;
      height: var(--nav-h);
      background: rgba(255,253,248,0.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0);
      box-shadow: 0 -4px 20px rgba(40, 32, 12, 0.1);
    }
    .bottom-nav button {
      flex: 1; text-align: center; font-size: 11px; padding: 8px 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-weight: 500; font-family: inherit;
    }
    .bottom-nav button.active { color: var(--accent); }
    .bottom-nav button .nav-ico { width: 22px; height: 22px; }
    .bottom-nav button .nav-ico svg { width: 22px; height: 22px; display: block; stroke-width: 1.7; }
    .bottom-nav button.active .nav-ico svg { stroke-width: 2.2; stroke: var(--accent); }
    .bottom-nav button:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card h2 {
      font-size: 0.8125rem; margin-bottom: 12px;
      color: var(--muted); font-weight: 600;
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .card.tight { padding: 12px 14px; margin-bottom: 10px; }
    .card.tight h2 { font-size: 0.75rem; margin-bottom: 8px; }
    .card.tight table { font-size: 0.75rem; }
    .card.tight th, .card.tight td { padding: 6px 8px; height: auto; }

    /* KPI */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .kpi, .dash-kpi {
      position: relative;
      overflow: hidden;
      background: var(--card);
      border-radius: var(--radius);
      padding: 10px 12px 10px 14px;
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .kpi::before, .dash-kpi::before {
      content: "";
      position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .kpi .label, .dash-kpi .label {
      font-size: 0.68rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
    }
    .kpi .value, .dash-kpi .value {
      font-size: var(--fs-kpi); font-weight: 700; margin-top: 4px;
      line-height: 1.15; font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em; color: var(--text);
    }
    .kpi .trend, .dash-kpi .trend {
      margin-top: 4px; font-size: 0.68rem; color: var(--muted);
      min-height: 1em;
    }
    .dash-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .dash-kpis.cols-5 {
      grid-template-columns: 1fr 1fr;
    }
    @media (min-width: 720px) {
      .dash-kpis { grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .dash-kpis.cols-5 { grid-template-columns: repeat(5, 1fr); }
    }
    @media (max-width: 380px) {
      .dash-kpis, .dash-kpis.cols-5 { grid-template-columns: 1fr 1fr; }
      .dash-kpi .value { font-size: 0.98rem; }
    }
    .dash-kpi-danger {
      border-color: rgba(229, 72, 77, 0.45);
      background: var(--danger-bg);
    }
    .dash-meta {
      display: flex; flex-wrap: wrap; gap: 6px 14px;
      margin-bottom: 12px; padding: 10px 12px;
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      font-size: 0.75rem; color: var(--muted);
    }
    .dash-meta strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .dash-alert {
      font-size: 0.78rem; padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 6px;
      border: 1px solid transparent;
    }
    .dash-alert.danger { background: var(--danger-bg); color: var(--danger); border-color: rgba(229,72,77,0.25); }
    .dash-alert.warn { background: var(--warning-bg); color: var(--warning); border-color: rgba(245,166,35,0.25); }
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
    }
    .neg {
      color: var(--danger); font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .neg::before { content: ""; font-weight: 600; opacity: 0.9; }
    @media (max-width: 700px) {
      .dash-grid { grid-template-columns: 1fr; }
      .main { padding-left: 12px; padding-right: 12px; overflow-x: hidden; }
      .dash-kpi { padding: 10px 12px; min-width: 0; }
      .dash-kpi .value {
        font-size: 1.05rem;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .dash-meta {
        gap: 6px 10px;
        font-size: 0.7rem;
      }
      .table-wrap { margin: 0 -4px; }
    }

    /* Tables - dense enterprise */
    .table-wrap {
      width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 560px;
    }
    th, td {
      text-align: left;
      padding: 0 10px;
      height: var(--row-h);
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }
    th {
      color: var(--muted); font-weight: 650; font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.04em;
      background: var(--bg-mid);
      position: sticky; top: 0; z-index: 1;
      height: 30px;
    }
    tbody tr:nth-child(even) { background: rgba(154,123,20,0.035); }
    tbody tr:hover { background: var(--card-hover); }
    tbody tr:last-child td { border-bottom: none; }
    .order-row-code {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
      max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .note-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: 280px;
    }

    /* Forms */
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      font-size: var(--fs-body-lg);
      margin-bottom: 8px;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    label {
      font-size: var(--fs-label); color: var(--muted);
      display: block; margin-bottom: 4px;
      font-weight: 500; letter-spacing: 0.02em;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 700px) {
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }
    .field-error {
      font-size: 0.72rem; color: var(--danger); margin: -4px 0 8px;
    }

    /* Buttons */
    .btn {
      background: var(--accent); color: var(--accent-text); border: none;
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-weight: 600; cursor: pointer; font-size: 0.84rem;
      letter-spacing: 0.01em;
      transition: background 0.12s ease, transform 0.08s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn-ghost {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.75rem; font-weight: 600;
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .btn-ghost:hover { border-color: var(--accent); background: var(--accent-muted); color: var(--accent-hover); }
    .btn-sm { padding: 3px 8px; font-size: 0.72rem; border-radius: 5px; }
    .btn-danger {
      background: var(--danger-bg); color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.35);
      padding: 5px 10px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.75rem; font-weight: 600;
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.18); }
    .btn-danger.btn-sm { padding: 3px 8px; font-size: 0.72rem; border-radius: 5px; }

    /* Messages — toast */
    .msg {
      padding: 10px 12px; border-radius: var(--radius-sm);
      margin-bottom: 10px; font-size: 0.84rem;
      border: 1px solid transparent;
    }
    .msg.ok { background: var(--success-bg); color: var(--success); border-color: rgba(63,185,80,0.25); }
    .msg.err { background: var(--danger-bg); color: var(--danger); border-color: rgba(229,72,77,0.25); }
    .msg.toast {
      position: fixed; top: 16px; right: 16px; z-index: 240;
      margin: 0; min-width: 220px; max-width: min(360px, calc(100vw - 32px));
      box-shadow: var(--shadow); cursor: pointer;
    }
    .muted { color: var(--muted); font-size: 0.8rem; }

    /* Badges - 4 semantic states */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 99px;
      font-size: 0.68rem; font-weight: 550; letter-spacing: 0.01em;
      background: var(--bg-mid); color: var(--muted);
      border: 1px solid transparent;
    }
    .badge .mark { font-size: 0.72rem; line-height: 1; }
    .badge.active, .badge.paid, .badge.success,
    .badge.confirmed {
      background: var(--success-bg); color: var(--success); border-color: rgba(63,185,80,0.2);
    }
    .badge.closed, .badge.neutral {
      background: var(--bg-mid); color: var(--muted);
    }
    .badge.partial, .badge.pending, .badge.warning {
      background: var(--warning-bg); color: var(--warning); border-color: rgba(245,166,35,0.2);
    }
    .badge.rejected, .badge.cancelled, .badge.danger {
      background: var(--danger-bg); color: var(--danger); border-color: rgba(229,72,77,0.2);
    }
    .badge.info {
      background: var(--info-bg); color: var(--info); border-color: rgba(88,166,255,0.2);
    }

    .empty {
      text-align: center; padding: 28px 16px; color: var(--muted);
      font-size: 0.84rem;
    }
    .empty-title { color: var(--text); font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }

    .settings-bar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .settings-bar > div { flex: 1; min-width: 160px; }
    .line-items {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 10px; margin-bottom: 10px;
    }
    .line-row {
      display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 6px;
      align-items: end; margin-bottom: 6px;
    }
    @media (max-width: 600px) { .line-row { grid-template-columns: 1fr 1fr; } }
    .total-box {
      background: var(--bg-elevated); border-radius: var(--radius-sm);
      padding: 10px 12px; margin: 8px 0;
      display: flex; justify-content: space-between; font-weight: 600;
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--border-subtle);
    }

    /* Login — eski PIN oynasi uslubi, lekin ADMIN_KEY */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(201,162,39,0.15), transparent),
        var(--bg);
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }
    .login-card h1 { font-size: 1.1rem; color: var(--text); margin-bottom: 4px; font-weight: 650; }
    .login-card p { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; }
    .login-card label { display: block; font-size: var(--fs-label); color: var(--muted); margin-bottom: 6px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 0.95rem; margin-bottom: 14px;
    }
    .login-card input:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
    }
    .login-card .btn {
      width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
      font-weight: 700; background: var(--accent); color: var(--accent-text); cursor: pointer;
    }
    .login-card .btn:hover { background: var(--accent-hover); }
    .login-card .err { color: var(--danger); font-size: 0.85rem; margin-bottom: 10px; }
    .logout-btn {
      margin-top: 8px; width: 100%; padding: 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle); background: transparent; color: var(--muted);
      font-size: 0.75rem; cursor: pointer;
    }
    .logout-btn:hover { color: var(--text); border-color: var(--border); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 220; padding: 16px;
    }
    .modal-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px; max-width: 400px; width: 100%;
      box-shadow: var(--shadow);
    }
    @media (prefers-reduced-motion: no-preference) {
      .modal-backdrop { animation: fadeIn 0.15s ease; }
      .modal-card { animation: riseIn 0.18s ease; }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  
    /* === MOBILE / RESPONSIVE (2026-09) === */
    html, body { max-width: 100%; overflow-x: hidden; }
    .shell, .main, .card { min-width: 0; max-width: 100%; }
    .card { overflow: hidden; }
    .table-wrap {
      display: block; width: 100%; max-width: 100%;
      overflow-x: auto; /* no !important — cards override at <=700 */
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap table { width: 100%; }
    @media (min-width: 701px) {
      .table-wrap table { min-width: 560px; }
      th, td { white-space: nowrap; }
    }
    .segment {
      flex-wrap: nowrap !important;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .segment::-webkit-scrollbar { display: none; }
    .segment button { flex: 0 0 auto; white-space: nowrap; }

    @media (max-width: 860px) {
      .main {
        padding: 14px 16px 28px !important;
        overflow-x: hidden;
      }
      .dash-grid { grid-template-columns: 1fr !important; }

    const { useState, useEffect, useCallback } = React;

    function money(n) {
      return Math.round(Number(n || 0)).toLocaleString("uz-UZ");
    }
    function mijozNarx(optom, disc) {
      return Math.round((Number(optom) || 0) + (Number(disc) || 3000));
    }
    function tashkentTime(d) {
      try {
        return new Intl.DateTimeFormat("uz-UZ", {
          timeZone: "Asia/Tashkent", hour: "2-digit", minute: "2-digit", second: "2-digit"
        }).format(d || new Date());
      } catch (e) {
        return (d || new Date()).toLocaleTimeString("uz-UZ");
      }
    }

    const STATUS_UZ = {
      pending: "Kutilmoqda", confirmed: "Tasdiqlangan", paid: "To'langan",
      partial: "Qisman", closed: "Yopilgan", cancelled: "Bekor", rejected: "Rad"
    };
    function statusLabel(s) { return STATUS_UZ[String(s || "").toLowerCase()] || s || "-"; }
    function statusMark(s) {
      const k = String(s || "").toLowerCase();
      if (k === "confirmed" || k === "paid" || k === "active" || k === "success") return "✓";
      if (k === "closed") return "■";
      if (k === "pending" || k === "partial" || k === "warning") return "⏳";
      if (k === "rejected" || k === "cancelled" || k === "danger") return "✕";
      return "•";
    }
    function StatusBadge(props) {
      const raw = String(props.status || "").toLowerCase();
      const cls = props.className || raw;
      return (
        <span className={"badge " + cls}>
          <span className="mark" aria-hidden="true">{statusMark(raw)}</span>
          {props.children || statusLabel(raw)}
        </span>
      );
    }
    function FieldErr(props) {
      if (!props.text) return null;
      return <div className="field-error">{props.text}</div>;
    }
    function matchQ(q, parts) {
      const s = String(q || "").trim().toLowerCase();
      if (!s) return true;
      return parts.some(function (p) {
        return String(p == null ? "" : p).toLowerCase().indexOf(s) !== -1;
      });
    }
    function ymdTashkent(d) {
      if (!d) return "";
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Tashkent", year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date(d));
      } catch (e) {
        return String(d).slice(0, 10);
      }
    }
    function inDateRange(val, from, to) {
      if (!from && !to) return true;
      const y = ymdTashkent(val);
      if (!y) return false;
      if (from && y < from) return false;
      if (to && y > to) return false;
      return true;
    }
    function downloadCsv(filename, rows, cols) {
      const esc = function (v) {
        const s = v == null ? "" : String(v);
        if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const lines = [cols.map(function (c) { return esc(c.label); }).join(",")];
      rows.forEach(function (r) {
        lines.push(cols.map(function (c) { return esc(typeof c.get === "function" ? c.get(r) : r[c.key]); }).join(","));
      });
      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);

          timeZone: "Asia/Tashkent", dateStyle: "medium", timeStyle: "short"

    function PageHead(props) {

    function formKeyDown(e, onEsc) {
      if (e.key === "Escape" && typeof onEsc === "function") {
        e.preventDefault();
        onEsc();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        const form = e.currentTarget;
        if (form && typeof form.requestSubmit === "function") form.requestSubmit();
      }
    }


    // Sessiya: sessionStorage + 12 soat. localStorage dagi eski kalit o'chiriladi —
    // brauzerni yopib qayta ochganda kirish so'raladi.
    const SESSION_MS = 12 * 60 * 60 * 1000;
    const SESSION_LONG_MS = 7 * 24 * 60 * 60 * 1000;
    const SS = (function () {
      try {
        var s = window.sessionStorage;
        s.setItem("__bd", "1");
        s.removeItem("__bd");
        return s;
      } catch (e) {
        var mem = {};
        return {
          getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
          setItem: function (k, v) { mem[k] = String(v); },
          removeItem: function (k) { delete mem[k]; }
        };
      }
    })();

    try {
      if (localStorage.getItem("erp_persist") !== "1") {
        localStorage.removeItem("erp_key");
        localStorage.removeItem("erp_key_at");
        localStorage.removeItem("erp_operator");
      }
    } catch (e0) {}

    function useApi() {
      const [apiBase, setApiBase] = useState(function () {
        return localStorage.getItem("erp_api") || DEFAULT_API;
      });
      const [adminKey, setAdminKey] = useState(function () {
        const key = SS.getItem("erp_key") || "";
        const at = Number(SS.getItem("erp_key_at") || 0);
        if (key && at && Date.now() - at > SESSION_MS) {
          SS.removeItem("erp_key");
          SS.removeItem("erp_key_at");
          SS.removeItem("erp_operator");
          return "";
        }
        return key;
      });
      const [operatorName, setOperatorName] = useState(function () {
        return SS.getItem("erp_operator") || "Admin";
      });

      function saveSettings(base, key, operator, remember) {
        setApiBase(base);
        setAdminKey(key);
        const op = operator || "Admin";
        setOperatorName(op);
        try { localStorage.setItem("erp_api", base); } catch (e1) {}
        SS.setItem("erp_key", key);
        SS.setItem("erp_key_at", String(Date.now()));
        SS.setItem("erp_operator", op);
        try {
          if (remember) {
            localStorage.setItem("erp_persist", "1");
            localStorage.setItem("erp_key", key);
            localStorage.setItem("erp_key_at", String(Date.now()));
            localStorage.setItem("erp_operator", op);
          } else {
            localStorage.removeItem("erp_persist");
            localStorage.removeItem("erp_key");
            localStorage.removeItem("erp_key_at");
            localStorage.removeItem("erp_operator");
          }
        } catch (e2) {}
      }

      const api = useCallback(async function (path, opts) {
        opts = opts || {};
        const at = Number(SS.getItem("erp_key_at") || 0);
        if (adminKey && at && Date.now() - at > SESSION_MS) {
          setAdminKey("");
          SS.removeItem("erp_key");
          SS.removeItem("erp_key_at");
          const err = new Error("Sessiya muddati tugadi - qayta kiring");
          err.code = 401;
          throw err;
        }
        const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
        if (adminKey) headers["x-admin-key"] = adminKey;
        const op = operatorName || SS.getItem("erp_operator") || "";
        if (op) headers["x-operator-name"] = op;
        const res = await fetch(apiBase.replace(/\/$/, "") + path, { ...opts, headers: headers });
        const data = await res.json().catch(function () { return {}; });
        if (res.status === 401) {
          setAdminKey("");
          SS.removeItem("erp_key");
          SS.removeItem("erp_key_at");
          const err = new Error(data.error || "Unauthorized");
          err.code = 401;
          throw err;
        }
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || res.statusText || "Xato");
        }
        return data;
      }, [apiBase, adminKey, operatorName]);

      function logout() {
        setAdminKey("");
        setOperatorName("Admin");
        SS.removeItem("erp_key");
        SS.removeItem("erp_key_at");
        SS.removeItem("erp_ui_role");
      }

      return {
        api: api,
        apiBase: apiBase,
        adminKey: adminKey,
        operatorName: operatorName,
        saveSettings: saveSettings,
        logout: logout
      };
    }

    function LoginScreen(props) {
      const [key, setKey] = useState("");
      const [showKey, setShowKey] = useState(false);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const [remember, setRemember] = useState(false);

      async function submit(e) {
        e.preventDefault();
        if (!key.trim()) {
          setErr("Parolni kiriting");
          return;
        }
        setBusy(true);
        setErr("");
        try {
          const base = (props.apiBase || window.location.origin).replace(/\/$/, "");
          const res = await fetch(base + "/api/dashboard", {
            headers: {
              "x-admin-key": key.trim(),
              "x-operator-name": "Admin"
            }
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            setErr(data.error || "Parol noto'g'ri");
            setBusy(false);
            return;
          }
          props.onLogin(key.trim(), remember);
        } catch (ex) {
          setErr(ex.message || "Ulanish xatosi");
        }
        setBusy(false);
      }

      return (
        <div className="login-wrap">
          <form className="login-card" onSubmit={submit}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <img src="/bd_logo.jpg" alt="Black Diamond" style={{width:40,height:40,borderRadius:8,objectFit:"cover"}} />
              <h1 style={{margin:0}}>Black Diamond OPS</h1>
            </div>
            <p>Kirish uchun parolni yozing</p>
            {err ? <div className="err">{err}</div> : null}
            <label htmlFor="f-1">Parol</label>
            <div style={{ position: "relative", marginBottom: 14 }}>
              <input
                id="f-1"
                type={showKey ? "text" : "password"}
                value={key}
                onChange={function (e) { setKey(e.target.value); }}
                placeholder="Parol"
                autoComplete="current-password"
                autoFocus
                className={err ? "invalid" : ""}
                style={{ marginBottom: 0, paddingRight: 44 }}
              />
              <button
                type="button"
                className="btn-ghost btn-sm"
                onClick={function () { setShowKey(function (v) { return !v; }); }}
                style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)" }}
                aria-label={showKey ? "Yashirish" : "Ko'rsatish"}
              >
                {showKey ? "Yashir" : "Ko'r"}
              </button>
            </div>
            <label className="remember">
              <input type="checkbox" checked={remember} onChange={function (e) { setRemember(e.target.checked); }} />
              Meni eslab qol (7 kun)
            </label>
            <button className="btn" type="submit" disabled={busy}>
              {busy ? "Tekshirilmoqda..." : "Kirish"}
            </button>
          </form>
        </div>
      );
    }


    function ConfirmModal(props) {
      useEffect(function () {
        if (!props.open) return;
        function onKey(e) {
          if (e.key === "Escape") props.onCancel();
          if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) props.onConfirm();
        }
        window.addEventListener("keydown", onKey);
        return function () { window.removeEventListener("keydown", onKey); };
      }, [props.open]);
      if (!props.open) return null;
      return (
        <div className="modal-backdrop" role="dialog" aria-modal="true" onClick={props.onCancel}>
          <div className="modal-card" onClick={function (e) { e.stopPropagation(); }}>
            <p style={{ marginBottom: 14, fontSize: "0.9rem" }}>{props.text}</p>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button className="btn-ghost" type="button" onClick={props.onCancel}>Bekor</button>
              <button className="btn" type="button" onClick={props.onConfirm}>Tasdiqlash</button>
            </div>
          </div>
        </div>
      );
    }

    function useAutoMsg() {
      const [msg, setMsgRaw] = useState({});
      function setMsg(m) {
        setMsgRaw(m || {});
        if (m && m.text) {
          const ms = m.type === "err" ? 6000 : 2500;
          setTimeout(function () {
            setMsgRaw(function (cur) { return cur && cur.text === m.text ? {} : cur; });
          }, ms);
        }
      }
      return [msg, setMsg];
    }

    function Msg(props) {
      if (!props.text) return null;
      const typ = props.type || "ok";
      const mark = typ === "err" ? "✕" : "✓";
      return (
        <div className={"msg toast " + typ} role="status">
          <span className="mark" aria-hidden="true">{mark}</span>
          <span style={{ flex: 1 }}>{props.text}</span>
          <button type="button" className="msg-x" aria-label="Yopish" onClick={props.onClose}>×</button>
        </div>
      );
    }

        if (!arr || !arr.length) return [];
        return dashMore[key] ? arr : arr.slice(0, DASH_LIMIT);
      }
      function DashMoreBtn(props) {
        const arr = props.arr || [];
        const k = props.k;
        if (arr.length <= DASH_LIMIT) return null;
        return (
          <button
            type="button"
            className="btn-ghost btn-sm dash-more"
            onClick={function () {
              setDashMore(function (prev) {
                var next = Object.assign({}, prev);
                next[k] = !prev[k];
                return next;

            {dashMore[k] ? "Kamroq" : ("Ko‘proq · " + (arr.length - DASH_LIMIT))}

                  <div className="empty-title">Buyurtma yo'q</div>
                  Savdo yoki mijoz ilovasidan keladi
                </div>
              ) : (
                <div className="table-wrap dash-dense">
                <table>
                  <thead>
                    <tr><th>Kod</th><th>Mijoz</th><th>Summa</th><th>Holat</th></tr>
                  </thead>
                  <tbody>
                    {dashSlice(orders, "order").map(function (o) {
                      return (
                        <tr key={o.id}>
                          <td data-label="Kod" title={o.order_code}>{shortCode(o.order_code)}</td>
                          <td data-label="Mijoz">{o.customer_name || "-"}</td>
                          <td data-label="Summa">{money(o.total_amount)}</td>
                          <td data-label="Holat"><StatusBadge status={o.status} /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <DashMoreBtn arr={orders} k="order" />
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Stock(props) {
      const api = props.api;
      const [materials, setMaterials] = useState([]);
      const [products, setProducts] = useState([]);
      const [err, setErr] = useState("");
      const [loading, setLoading] = useState(true);

      useEffect(function () {
        setLoading(true);
        Promise.all([api("/api/stock/materials"), api("/api/stock/products")])
          .then(function (arr) {
            setMaterials(arr[0].data || []);
            setProducts(arr[1].data || []);
          })
          .catch(function (e) { setErr(e.message); })
          .finally(function () { setLoading(false); });
      }, [api]);

      if (err) return <div className="msg err">{err}</div>;
      if (loading) return <div className="muted">Yuklanmoqda...</div>;

      return (
        <div>
          <PageHead title="Ombor" sub="Tan narx = ko'mir + retsept + qadoq ish haqi. SKU tannarx > 0 bo'lsa qo'lda. Foyda = optom − tan narx." />
          <div className="card">
            <h2>Material qoldiq</h2>
            {materials.length === 0 ? (
              <div className="empty">
                <div className="empty-title">Material qoldiq yo'q</div>
                Katalog → Material dan qo'shing
              </div>
            ) : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>Nomi</th><th>Birlik</th><th>Kirim</th><th>Chiqim</th><th>Qoldiq</th></tr>
                </thead>
                <tbody>
                  {materials.map(function (m) {
                    return (
                      <tr key={m.id}>
                        <td data-label="Nomi">{m.name}</td>
                        <td data-label="Birlik">{m.unit}</td>
                        <td data-label="Kirim">{Number(m.total_in)}</td>
                        <td data-label="Chiqim">{Number(m.total_out)}</td>
                        <td data-label="Qoldiq"><strong>{Number(m.balance)}</strong></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table></div>
            )}
          </div>
          <div className="card">
            <h2>Mahsulot qoldiq</h2>
            {products.length === 0 ? (
              <EmptyState icon="box" title="Mahsulot qoldiq yo'q" sub="Avval qadoqlash qiling" />
            ) : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>SKU</th><th>Qoldiq</th><th>Tannarx</th><th>Sotish</th><th>Foyda/dona</th><th>Ombor tannarx</th><th>Ombor savdo</th><th>Kutilgan foyda</th></tr>
                </thead>
                <tbody>
                  {products.map(function (p) {
                    const cost = p.unitCost != null ? p.unitCost : p.cost_price;
                    const prof = p.margin != null ? p.margin : p.profit_unit;
                    const cval = p.costValue != null ? p.costValue : p.cost_value;
                    const pval = p.potentialProfit != null ? p.potentialProfit : p.profit_value;
                    return (
                      <tr key={p.id}>
                        <td data-label="SKU">
                          {p.sku}
                          {p.cost_override ? <div className="muted" style={{ fontSize: "0.7rem" }}>qo'lda</div> : null}
                        </td>
                        <td data-label="Qoldiq" className={Number(p.balance_qty) < 0 ? "neg" : ""}><strong>{Number(p.balance_qty)}</strong></td>
                        <td data-label="Tannarx">{money(cost)}</td>
                        <td data-label="Sotish">{money(p.sell_price != null ? p.sell_price : p.price)}</td>
                        <td data-label="Foyda/dona">{money(prof)}</td>
                        <td data-label="Ombor tannarx">{money(cval)}</td>
                        <td data-label="Ombor savdo">{money(p.value)}</td>
                        <td data-label="Kutilgan foyda" className={Number(pval) < 0 ? "neg" : ""}>{money(pval)}</td>
                      </tr>
                    );
                  })}
                </tbody>
                                <tfoot>
                  <tr className="row-total">
                    <td data-label="Jami">Jami</td>
                    <td data-label="Qoldiq"><strong>{products.reduce(function (a, p) { return a + Number(p.balance_qty || 0); }, 0)}</strong></td>
                    <td className="desk-only" colSpan="3"></td>
                    <td data-label="Ombor tannarx"><strong>{money(products.reduce(function (a, p) { return a + Number(p.costValue != null ? p.costValue : p.cost_value || 0); }, 0))}</strong></td>
                    <td data-label="Ombor savdo"><strong>{money(products.reduce(function (a, p) { return a + Number(p.value || 0); }, 0))}</strong></td>
                    <td data-label="Kutilgan foyda"><strong>{money(products.reduce(function (a, p) { return a + Number(p.potentialProfit != null ? p.potentialProfit : p.profit_value || 0); }, 0))}</strong></td>
                  </tr>
                </tfoot>
              </table></div>
            )}
          </div>
        </div>
      );
    }

    // ---------- Products ----------
    function Products(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const emptyForm = { sku: "", weight_kg: "", price: "", cost_price: "", description: "", img1: "", img2: "", img3: "" };
      const [form, setForm] = useState(emptyForm);
      const [editId, setEditId] = useState(null);
      const [editForm, setEditForm] = useState({ sku: "", weight_kg: "", price: "", cost_price: "", description: "", is_active: true, img1: "", img2: "", img3: "" });
      const [materials, setMaterials] = useState([]);
      const [recipeRows, setRecipeRows] = useState([]);
      const [q, setQ] = useState("");
      const [ferr, setFerr] = useState({});
      const [inlineId, setInlineId] = useState(null);
      const [inlineVal, setInlineVal] = useState("");

      function urlsFrom(f) {
        return [f.img1, f.img2, f.img3].map(function (s) { return String(s || "").trim(); }).filter(Boolean);
      }
      function urlsTo(arr) {
        const a = Array.isArray(arr) ? arr : [];
        return { img1: a[0] || "", img2: a[1] || "", img3: a[2] || "" };
      }
      const [msg, setMsg] = useAutoMsg();

      const load = useCallback(function () {
        Promise.all([api("/api/products?active=0"), api("/api/materials?active=0")])
          .then(function (arr) {
            setList(arr[0].data || []);
            setMaterials(arr[1].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!String(form.sku || "").trim()) next.sku = "SKU majburiy";
        if (form.price !== "" && Number(form.price) < 0) next.price = "Narx manfiy bo'lmasin";
        setFerr(next);
        if (next.sku || next.price) return;
        try {
          await api("/api/products", {
            method: "POST",
            body: JSON.stringify({
              sku: form.sku,
              weight_kg: Number(form.weight_kg) || 0,
              price: Math.round(Number(form.price) || 0),
              cost_price: Math.round(Number(form.cost_price) || 0),
              description: form.description || null,
              image_urls: urlsFrom(form)
            })
          });
          setMsg({ text: "SKU qo'shildi", type: "ok" });
          setForm(emptyForm);
          setFerr({});
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function startEdit(p) {
        setEditId(p.id);
        const imgs = urlsTo(p.image_urls);
        setEditForm({
          sku: p.sku || "",
          weight_kg: String(p.weight_kg != null ? p.weight_kg : ""),
          price: String(p.price != null ? p.price : ""),
          cost_price: "0",
          description: p.description || "",
          is_active: p.is_active !== false,
          img1: imgs.img1,
          img2: imgs.img2,
          img3: imgs.img3
        });
        setRecipeRows([]);
        api("/api/products/" + p.id + "/recipes")
          .then(function (r) {
            setRecipeRows((r.data || []).map(function (x) {
              return {
                material_id: String(x.material_id),
                qty: String(x.qty != null ? x.qty : ""),
                line_amount: String(x.line_amount != null ? Math.round(Number(x.line_amount)) : "")
              };
            }));
          })
          .catch(function () { setRecipeRows([]); });
      }

      function cancelEdit() {
        setEditId(null);
        setRecipeRows([]);
      }

      function matPrice(id) {
        const m = materials.filter(function (x) { return String(x.id) === String(id); })[0];
        return m ? Number(m.price || 0) : 0;
      }
      function rowAmount(row) {
        if (row.line_amount !== "" && row.line_amount != null) return Math.round(Number(row.line_amount) || 0);
        return Math.round((Number(row.qty) || 0) * matPrice(row.material_id));
      }
      function recipeTotal() {
        return recipeRows.reduce(function (s, row) { return s + rowAmount(row); }, 0);
      }

      async function saveEdit(e) {
        e.preventDefault();
        try {
          await api("/api/products/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              sku: editForm.sku,
              weight_kg: Number(editForm.weight_kg) || 0,
              price: Math.round(Number(editForm.price) || 0),
              cost_price: Math.round(Number(editForm.cost_price) || 0),
              description: editForm.description || null,
              is_active: !!editForm.is_active,
              image_urls: urlsFrom(editForm)
            })
          });
          await api("/api/products/" + editId + "/recipes", {
            method: "PUT",
            body: JSON.stringify({
              lines: recipeRows.filter(function (x) { return x.material_id; }).map(function (x) {
                return {
                  material_id: Number(x.material_id),
                  qty: Number(x.qty) || 0,
                  line_amount: x.line_amount === "" ? null : Math.round(Number(x.line_amount) || 0)
                };
              })
            })
          });
          setMsg({ text: "SKU va tan narx saqlandi", type: "ok" });
          setEditId(null);
          setRecipeRows([]);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });

      async function saveInlinePrice(p) {
        const next = Math.round(Number(inlineVal));
        setInlineId(null);
        if (!Number.isFinite(next) || next < 0) {
          setMsg({ text: "Narx noto'g'ri", type: "err" });
          return;
        }
        if (next === Math.round(Number(p.price || 0))) return;
        try {
          await api("/api/products/" + p.id, {
            method: "PUT",
            body: JSON.stringify({
              sku: p.sku,
              weight_kg: Number(p.weight_kg) || 0,
              price: next,
              cost_price: Math.round(Number(p.cost_price) || 0),
              description: p.description || null,
              is_active: p.is_active !== false,
              image_urls: Array.isArray(p.image_urls) ? p.image_urls : []
            })
          });
          setMsg({ text: "Narx saqlandi", type: "ok" });
          load();
        } catch (e) {
          setMsg({ text: e.message, type: "err" });
        }
      }

      async function softDelete(id) {
        setConfirmState({
          open: true,
          text: "SKU ni nofaol qilish?",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/products/" + id, { method: "DELETE" });
              setMsg({ text: "SKU nofaol qilindi", type: "ok" });
              load();
            } catch (e) {
              setMsg({ text: e.message, type: "err" });
            }
          }
        });
      }

      return (
        <div>
          <ConfirmModal
            open={confirmState.open}
            text={confirmState.text}
            onCancel={function () { setConfirmState({ open: false, text: "", onConfirm: null }); }}
            onConfirm={function () { if (confirmState.onConfirm) confirmState.onConfirm(); }}
          />
          <PageHead title="Mahsulotlar" sub="Bazadagi narx = optom. Mijoz 500 donagacha optom + 3000 to'laydi." />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">
            <h2>Yangi SKU</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e); }}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-2">SKU</label>
                  <input id="f-2" value={form.sku} onChange={function (e) { setForm({ ...form, sku: e.target.value }); }} />
                  <FieldErr text={ferr.sku} />
                </div>
                <div>
                  <label htmlFor="f-3">Ogirlik (kg)</label>
                  <input id="f-3" type="number" step="0.1" value={form.weight_kg} onChange={function (e) { setForm({ ...form, weight_kg: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-4">Optom narx (so'm)</label>
                  <input id="f-4" type="number" min="0" step="1" value={form.price} onChange={function (e) { setForm({ ...form, price: e.target.value }); }} />
                  <FieldErr text={ferr.price} />
                  {form.price ? (
                    <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                      Mijoz: {money(mijozNarx(form.price))} so'm
                    </div>
                  ) : null}
                </div>
                <div>
                  <label htmlFor="f-cost">Tannarx qo'lda (0 = avto)</label>
                  <input id="f-cost" type="number" min="0" step="1" value={form.cost_price} onChange={function (e) { setForm({ ...form, cost_price: e.target.value }); }} />
                  {form.price && form.cost_price ? (
                    <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                      Foyda: {money(Math.round(Number(form.price) - Number(form.cost_price)))} so'm
                    </div>
                  ) : null}
                </div>
                <div>
                  <label htmlFor="f-5">Batafsil (mijozga)</label>
                  <textarea id="f-5" rows={4} placeholder="Mahsulot haqida matn — mijoz Batafsilida chiqadi" value={form.description} onChange={function (e) { setForm({ ...form, description: e.target.value }); }} />
                </div>
              </div>
              <div className="form-row">
                <div>
                  <label htmlFor="f-img1">Rasm 1 URL</label>
                  <input id="f-img1" value={form.img1} onChange={function (e) { setForm({ ...form, img1: e.target.value }); }} placeholder="https://lh3.googleusercontent.com/d/..." />
                </div>
                <div>
                  <label htmlFor="f-img2">Rasm 2 URL</label>
                  <input id="f-img2" value={form.img2} onChange={function (e) { setForm({ ...form, img2: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-img3">Rasm 3 URL</label>
                  <input id="f-img3" value={form.img3} onChange={function (e) { setForm({ ...form, img3: e.target.value }); }} />
                </div>
              </div>
              <p className="muted" style={{ fontSize: "0.72rem", marginTop: -4 }}>Drive fayl ID: https://lh3.googleusercontent.com/d/FILE_ID — bot galereyasida shu tartibda chiqadi.</p>
              <button className="btn" type="submit">Qo'shish</button>
            </form>
          </div>

          {editId ? (
            <div className="card">
              <h2>SKU tahrirlash</h2>
              <form onSubmit={saveEdit} onKeyDown={function (e) { formKeyDown(e, cancelEdit); }}>
                <div className="form-row">
                  <div>
                    <label htmlFor="f-6">SKU</label>
                    <input id="f-6" value={editForm.sku} onChange={function (e) { setEditForm({ ...editForm, sku: e.target.value }); }} required />
                  </div>
                  <div>
                    <label htmlFor="f-7">Ogirlik (kg)</label>
                    <input id="f-7" type="number" step="0.1" value={editForm.weight_kg} onChange={function (e) { setEditForm({ ...editForm, weight_kg: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-8">Optom narx (so'm)</label>
                    <input id="f-8" type="number" min="0" step="1" value={editForm.price} onChange={function (e) { setEditForm({ ...editForm, price: e.target.value }); }} />
                    {editForm.price ? (
                      <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                        Mijoz: {money(mijozNarx(editForm.price))} so'm
                      </div>
                    ) : null}
                  </div>
                  <div>
                    <label htmlFor="f-ecost">Tannarx qo'lda (0 = avto)</label>
                    <input id="f-ecost" type="number" min="0" step="1" value={editForm.cost_price} onChange={function (e) { setEditForm({ ...editForm, cost_price: e.target.value }); }} />
                    {editForm.price && editForm.cost_price ? (
                      <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                        Foyda: {money(Math.round(Number(editForm.price) - Number(editForm.cost_price)))} so'm
                      </div>
                    ) : null}
                  </div>
                  <div>
                    <label htmlFor="f-9">Batafsil (mijozga)</label>
                    <textarea id="f-9" rows={4} placeholder="Mahsulot haqida matn — mijoz Batafsilida chiqadi" value={editForm.description} onChange={function (e) { setEditForm({ ...editForm, description: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-10">Holat</label>
                    <select id="f-10" value={editForm.is_active ? "1" : "0"} onChange={function (e) { setEditForm({ ...editForm, is_active: e.target.value === "1" }); }}>
                      <option value="1">Faol</option>
                      <option value="0">Nofaol</option>
                    </select>
                  </div>
                </div>
                <div className="form-row">
                  <div>
                    <label htmlFor="f-eimg1">Rasm 1 URL</label>
                    <input id="f-eimg1" value={editForm.img1} onChange={function (e) { setEditForm({ ...editForm, img1: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-eimg2">Rasm 2 URL</label>
                    <input id="f-eimg2" value={editForm.img2} onChange={function (e) { setEditForm({ ...editForm, img2: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-eimg3">Rasm 3 URL</label>
                    <input id="f-eimg3" value={editForm.img3} onChange={function (e) { setEditForm({ ...editForm, img3: e.target.value }); }} />
                  </div>
                </div>
                <h3 style={{ fontSize: "0.85rem", margin: "12px 0 8px" }}>Tan narx — xomashyo (1 dona)</h3>
                <p className="muted" style={{ fontSize: "0.72rem", marginTop: 0 }}>Miqdor va summani qo'lda yozing. Summa bo'sh qolsa: miqdor × material narxi. Tan narx = qatorlar yig'indisi.</p>
                <div className="table-wrap list-dense">
                  <table>
                    <thead>
                      <tr><th>Xomashyo</th><th>Miqdor</th><th>Summa (so'm)</th><th></th></tr>
                    </thead>
                    <tbody>
                      {recipeRows.map(function (row, idx) {
                        return (
                          <tr key={idx}>
                            <td>
                              <select value={row.material_id} onChange={function (e) {
                                const next = recipeRows.slice();
                                next[idx] = { ...row, material_id: e.target.value };
                                setRecipeRows(next);
                              }}>
                                <option value="">— tanlang —</option>
                                {materials.map(function (m) {
                                  return <option key={m.id} value={m.id}>{m.name} ({m.unit})</option>;
                                })}
                              </select>
                            </td>
                            <td>
                              <input type="number" step="0.0001" value={row.qty} onChange={function (e) {
                                const next = recipeRows.slice();
                                next[idx] = { ...row, qty: e.target.value };
                                setRecipeRows(next);
                              }} />
                            </td>
                            <td>
                              <input type="number" min="0" step="1" value={row.line_amount} placeholder={String(Math.round((Number(row.qty) || 0) * matPrice(row.material_id)))} onChange={function (e) {
                                const next = recipeRows.slice();
                                next[idx] = { ...row, line_amount: e.target.value };
                                setRecipeRows(next);
                              }} />
                            </td>
                            <td>
                              <button type="button" className="btn-ghost btn-sm" onClick={function () {
                                setRecipeRows(recipeRows.filter(function (_, i) { return i !== idx; }));
                              }}>O'chirish</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "8px 0 12px" }}>
                  <button type="button" className="btn-ghost btn-sm" onClick={function () {
                    setRecipeRows(recipeRows.concat([{ material_id: "", qty: "", line_amount: "" }]));
                  }}>+ qator</button>
                  <span className="muted">Tan narx: <strong>{money(recipeTotal())}</strong> so'm</span>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn" type="submit">Saqlash</button>
                  <button className="btn-ghost" type="button" onClick={cancelEdit}>Bekor</button>
                </div>
              </form>
            </div>
          ) : null}

          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>Mahsulotlar ({list.filter(function (p) { return matchQ(q, [p.sku, p.description]); }).length})</h2>
              <input type="search" placeholder="Qidiruv: SKU..." value={q} onChange={function (e) { setQ(e.target.value); }} />
            </div>
            <div className="table-wrap list-dense"><table>
              <thead>
                <tr><th>SKU</th><th>kg</th><th>Tannarx</th><th>Optom</th><th>Foyda</th><th>Mijoz</th><th>Rasm</th><th>Holat</th><th></th></tr>
              </thead>
              <tbody>
                {list.filter(function (p) { return matchQ(q, [p.sku, p.description]); }).map(function (p) {
                  return (
                    <tr key={p.id}>
                      <td data-label="SKU">{p.sku}</td>
                      <td>{p.weight_kg}</td>
                      <td>{money(p.cost_price)}</td>
                      <td>
                        {inlineId === p.id ? (
                          <input
                            className="inline-edit"
                            type="number"
                            autoFocus
                            value={inlineVal}
                            onChange={function (e) { setInlineVal(e.target.value); }}
                            onBlur={function () { saveInlinePrice(p); }}
                            onKeyDown={function (e) {
                              if (e.key === "Enter") { e.preventDefault(); saveInlinePrice(p); }
                              if (e.key === "Escape") setInlineId(null);
                            }}
                          />
                        ) : (
                          <span className="price-edit">
                            <span className="price-cell">{money(p.price)}</span>
                            <button type="button" aria-label="Narxni tahrirlash" onClick={function () { setInlineId(p.id); setInlineVal(String(Math.round(Number(p.price) || 0))); }}>✎</button>
                          </span>
                        )}
                      </td>
                      <td>{money(Math.round(Number(p.price || 0) - Number(p.cost_price || 0)))}</td>
                      <td>{money(mijozNarx(p.price))}</td>
                      <td>{(p.image_urls && p.image_urls.length) ? p.image_urls.length : 0}</td>
                      <td>
                        <StatusBadge status={p.is_active ? "active" : "closed"}>{p.is_active ? "faol" : "nofaol"}</StatusBadge>
                      </td>
                      <td>
                        <button type="button" className="btn-ghost btn-sm" onClick={function () { startEdit(p); }}>Tahrir</button>
                        {" "}
                        {p.is_active ? (
                          <button type="button" className="btn-danger btn-sm" onClick={function () { softDelete(p.id); }}>O'chirish</button>
                        ) : null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table></div>
          </div>
        </div>
      );
    }

    function Materials(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [form, setForm] = useState({ name: "", unit: "kg", price: "", initial_stock: "" });
      const [editId, setEditId] = useState(null);
      const [editForm, setEditForm] = useState({ name: "", unit: "kg", price: "", is_active: true });
      const [mov, setMov] = useState({ material_id: "", qty: "", unit_price: "", note: "" });
      const [msg, setMsg] = useAutoMsg();
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [q, setQ] = useState("");
      const [ferr, setFerr] = useState({});
      const [inlineId, setInlineId] = useState(null);
      const [inlineVal, setInlineVal] = useState("");

      const load = useCallback(function () {
        api("/api/materials?active=0")
          .then(function (r) { setList(r.data || []); })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function saveInlinePrice(m) {
        const next = Number(inlineVal);
        setInlineId(null);
        if (!Number.isFinite(next) || next < 0) {
          setMsg({ text: "Narx noto'g'ri", type: "err" });
          return;
        }
        if (next === Number(m.price || 0)) return;
        try {
          await api("/api/materials/" + m.id, {
            method: "PUT",
            body: JSON.stringify({
              name: m.name,
              unit: m.unit || "kg",
              price: next,
              is_active: m.is_active !== false
            })
          });
          setMsg({ text: "Narx saqlandi", type: "ok" });
          load();
        } catch (e) {
          setMsg({ text: e.message, type: "err" });
        }
      }

      async function submitMat(e) {
        e.preventDefault();
        const next = {};
        if (!String(form.name || "").trim()) next.name = "Nomi majburiy";
        setFerr(next);
        if (next.name) return;
        try {
          await api("/api/materials", {
            method: "POST",
            body: JSON.stringify({
              name: form.name,
              unit: form.unit || "kg",
              price: Number(form.price) || 0,
              initial_stock: Number(form.initial_stock) || 0

          });
          setMsg({ text: "Material qo'shildi", type: "ok" });
          setForm({ name: "", unit: "kg", price: "", initial_stock: "" });
          load();

          setMsg({ text: err.message, type: "err" });
        }
      }

      function startEdit(m) {
        setEditId(m.id);
        setEditForm({

          unit: m.unit || "kg",

          is_active: m.is_active !== false
        });

        e.preventDefault();
        try {
          await api("/api/materials/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              name: editForm.name,
              unit: editForm.unit || "kg",
              price: Number(editForm.price) || 0,
              is_active: !!editForm.is_active

            setConfirmState({ open: false, text: "", onConfirm: null });

              await api("/api/materials/" + id, { method: "DELETE" });

              load();

              setMsg({ text: err.message, type: "err" });

          }

          await api("/api/material-movements", {
            method: "POST",

              material_id: Number(mov.material_id),
              movement_type: "in",
              qty: Number(mov.qty),

        });

          open: true,

          setForm({ bags_count: "", bag_price: "", dry_kg: "", workers_count: "", press_wage: "", note: "", material_id: form.material_id || "" });
          load();

          setMsg({ text: err.message, type: "err" });
        }
        setBusy(false);

      return (
        <div>

          />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">

                <div>
                  <label htmlFor="f-21">Quruq kg *</label>
                  <input id="f-21" type="number" step="0.1" value={form.dry_kg} onChange={function (e) { setForm({ ...form, dry_kg: e.target.value }); }} />
                  <FieldErr text={ferr.dry_kg} />

                <div>
                  <label htmlFor="f-22">Ishchilar</label>
                  <input id="f-22" type="number" value={form.workers_count} onChange={function (e) { setForm({ ...form, workers_count: e.target.value }); }} />

                    <option value="">Avto (ko'mir)</option>

                      return <option key={m.id} value={m.id}>{m.name}</option>;

                  </select>

    // ---------- Packaging ----------
    function Packaging(props) {
      const api = props.api;
      const PAGE = 40;
      const [list, setList] = useState([]);
      const [products, setProducts] = useState([]);
      const [batches, setBatches] = useState([]);
      const [form, setForm] = useState({
        product_id: "", qty: "", unit_wage: "700", workers_count: "1", batch_id: ""
      });
      const [msg, setMsg] = useAutoMsg();
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [ferr, setFerr] = useState({});
      const [loading, setLoading] = useState(true);
      const [loadingMore, setLoadingMore] = useState(false);
      const [offset, setOffset] = useState(0);
      const [hasMore, setHasMore] = useState(true);
      const [busyPack, setBusyPack] = useState(false);

      function deleteBatch(id) {
        setConfirmState({
          open: true,
          text: "Partiyani o'chirish? (faqat qadoqlanmagan)",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/batches/" + id, { method: "DELETE" });
              setMsg({ text: "Partiya o'chirildi", type: "ok" });
              load();
            } catch (err) {
              setMsg({ text: err.message, type: "err" });
            }
          }
        });
      }

      const load = useCallback(function () {
        setLoading(true);
        setOffset(0);
        Promise.all([
          api("/api/packaging?limit=" + PAGE + "&offset=0"),
          api("/api/products"),
          api("/api/batches?status=active")
        ])
          .then(function (arr) {
            const rows = arr[0].data || [];
            setList(rows);
            setHasMore(rows.length >= PAGE);
            setProducts(arr[1].data || []);
            setBatches(arr[2].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); })
          .finally(function () { setLoading(false); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function loadMore() {
        if (loadingMore || !hasMore) return;
        setLoadingMore(true);
        const next = offset + PAGE;
        try {
          const r = await api("/api/packaging?limit=" + PAGE + "&offset=" + next);
          const rows = r.data || [];
          setList(function (prev) { return prev.concat(rows); });
          setOffset(next);
          setHasMore(rows.length >= PAGE);
        } catch (e) {
          setMsg({ text: e.message, type: "err" });
        }
        setLoadingMore(false);
      }

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!form.product_id) next.product_id = "Mahsulot majburiy";
        if (!(Number(form.qty) > 0)) next.qty = "Dona musbat bo'lsin";
        setFerr(next);
        if (next.product_id || next.qty) return;
        if (busyPack) return;
        setBusyPack(true);
        try {
          await api("/api/packaging", {
            method: "POST",
            body: JSON.stringify({
              product_id: Number(form.product_id),
              qty: Number(form.qty),
              unit_wage: Number(form.unit_wage) || 700,
              workers_count: Number(form.workers_count) || 1,
              batch_id: form.batch_id ? Number(form.batch_id) : null
            })
          });
          setMsg({ text: "Qadoqlandi", type: "ok" });
          setForm({ ...form, qty: "" });
          setFerr({});
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
        setBusyPack(false);
      }

      return (
        <div>
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">
            <h2>Qadoqlash</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e); }}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-25">Mahsulot *</label>
                  <select id="f-25" value={form.product_id} onChange={function (e) { setForm({ ...form, product_id: e.target.value }); }}>
                    <option value="">Tanlang</option>
                    {products.map(function (p) {
                      return <option key={p.id} value={p.id}>{p.sku} ({p.weight_kg} kg)</option>;
                    })}
                  </select>
                  <FieldErr text={ferr.product_id} />
                </div>
                <div>
                  <label htmlFor="f-26">Dona *</label>
                  <input id="f-26" type="number" value={form.qty} onChange={function (e) { setForm({ ...form, qty: e.target.value }); }} />
                  <FieldErr text={ferr.qty} />
                </div>
                <div>
                  <label htmlFor="f-27">1 dona ish haqi</label>
                  <input id="f-27" type="number" value={form.unit_wage} onChange={function (e) { setForm({ ...form, unit_wage: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-28">Ishchilar</label>
                  <input id="f-28" type="number" value={form.workers_count} onChange={function (e) { setForm({ ...form, workers_count: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-29">Partiya (bosh = FIFO)</label>
                  <select id="f-29" value={form.batch_id} onChange={function (e) { setForm({ ...form, batch_id: e.target.value }); }}>
                    <option value="">Avto (FIFO)</option>
                    {batches.map(function (b) {
                      return <option key={b.id} value={b.id}>{b.batch_code} - {b.remaining_kg} kg</option>;

          <div className="card">
            <h2>Songgi qadoqlar</h2>
            {loading ? (
              <div className="muted">Yuklanmoqda...</div>
            ) : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>SKU</th><th>Dona</th><th>kg</th><th>Partiya</th><th>Ish haqi</th></tr>
                </thead>
                <tbody>
                  {list.map(function (p) {
                    return (
                      <tr key={p.id}>
                        <td data-label="SKU">{p.sku}</td>
                        <td data-label="Dona">{p.qty}</td>
                        <td data-label="kg">{p.kg}</td>
                        <td data-label="Partiya">{p.batch_code || "-"}</td>
                        <td data-label="Ish haqi">{money(p.total_wage)}</td>
                      </tr>
                    );
                  })}

              </table></div>
            )}
            {!loading && hasMore ? (
              <div style={{ marginTop: 12, textAlign: "center" }}>
                <button type="button" className="btn-ghost" disabled={loadingMore} onClick={loadMore}>

                </button>
