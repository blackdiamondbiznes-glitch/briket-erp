<body>
  <div id="root">Yuklanmoqda…</div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const DEFAULT_API = window.location.origin;

    function money(n) {
      var v = Math.round(Number(n || 0));
      var body = Math.abs(v).toLocaleString("uz-UZ");
      return (v < 0 ? "−" : "") + body;
    }
    function qtyText(n) {
      var v = Number(n) || 0;
      return (v < 0 ? "−" : "") + String(Math.abs(v));
    }
    // Tannarx = bir dona xarajat. Foyda = sotish − tannarx. Jami = × qoldiq.
    function stockLine(p) {
      const sale = Math.round(Number(p.sell_price != null ? p.sell_price : p.price) || 0);
      const qty = Number(p.balance_qty) || 0;
      const cost = Math.round(Number(p.unitCost != null ? p.unitCost : (p.unit_cost != null ? p.unit_cost : p.cost_price)) || 0);
      const prof = Math.round(sale - cost);
      return {
        sale: sale,
        qty: qty,
        cost: cost,
        prof: prof,
        cval: Math.round(qty * cost),
        pval: Math.round(qty * prof),
        sval: Math.round(qty * sale)
      };
    }
    function mijozNarx(optom, disc) {
      return Math.round((Number(optom) || 0) + (Number(disc) || 3000));
    }
    function tashkentTime(d) {
      try {
        return new Intl.DateTimeFormat("uz-UZ", {
          timeZone: "Asia/Tashkent", hour: "2-digit", minute: "2-digit", second: "2-digit"
        }).format(d || new Date());
      } catch (e) {
        return (d || new Date()).toLocaleTimeString("uz-UZ");
      }
    }

    const STATUS_UZ = {
      pending: "Kutilmoqda", confirmed: "Tasdiqlangan", paid: "To'langan",
      partial: "Qisman", closed: "Yopilgan", cancelled: "Bekor", rejected: "Rad"
    };
    function statusLabel(s) { return STATUS_UZ[String(s || "").toLowerCase()] || s || "-"; }
    function statusMark(s) {
      const k = String(s || "").toLowerCase();
      if (k === "confirmed" || k === "paid" || k === "active" || k === "success") return "✓";
      if (k === "closed") return "■";
      if (k === "pending" || k === "partial" || k === "warning") return "⏳";
      if (k === "rejected" || k === "cancelled" || k === "danger") return "✕";
      return "•";
    }
    function StatusBadge(props) {
      const raw = String(props.status || "").toLowerCase();
      const cls = props.className || raw;
      return (
        <span className={"badge " + cls}>
          <span className="mark" aria-hidden="true">{statusMark(raw)}</span>
          {props.children || statusLabel(raw)}
        </span>
      );
    }
    function FieldErr(props) {
      if (!props.text) return null;
      return <div className="field-error">{props.text}</div>;
    }
    function matchQ(q, parts) {
      const s = String(q || "").trim().toLowerCase();
      if (!s) return true;
      return parts.some(function (p) {
        return String(p == null ? "" : p).toLowerCase().indexOf(s) !== -1;
      });
    }
    function ymdTashkent(d) {
      if (!d) return "";
      try {
        return new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Tashkent", year: "numeric", month: "2-digit", day: "2-digit"
        }).format(new Date(d));
      } catch (e) {
        return String(d).slice(0, 10);
      }
    }
    function inDateRange(val, from, to) {
      if (!from && !to) return true;
      const y = ymdTashkent(val);
      if (!y) return false;
      if (from && y < from) return false;
      if (to && y > to) return false;
      return true;
    }
    function downloadCsv(filename, rows, cols) {
      const esc = function (v) {
        const s = v == null ? "" : String(v);
        if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const lines = [cols.map(function (c) { return esc(c.label); }).join(",")];
      rows.forEach(function (r) {
        lines.push(cols.map(function (c) { return esc(typeof c.get === "function" ? c.get(r) : r[c.key]); }).join(","));
      });
      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    }
    function Ico(props) {
      const n = props.name;
      const common = {
        viewBox: "0 0 24 24", fill: "none", stroke: "currentColor",
        strokeWidth: 1.75, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true
      };
      if (n === "layout") return <svg {...common}><rect x="3" y="3" width="7" height="9" rx="1" /><rect x="14" y="3" width="7" height="5" rx="1" /><rect x="14" y="12" width="7" height="9" rx="1" /><rect x="3" y="16" width="7" height="5" rx="1" /></svg>;
      if (n === "factory") return <svg {...common}><path d="M3 21h18" /><path d="M5 21V10l4 3V10l4 3V7l4 3v11" /></svg>;
      if (n === "cart") return <svg {...common}><circle cx="9" cy="20" r="1" /><circle cx="17" cy="20" r="1" /><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H7" /></svg>;
      if (n === "users") return <svg {...common}><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" /><circle cx="9.5" cy="7" r="3" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a3 3 0 0 1 0 5.74" /></svg>;
      if (n === "catalog") return <svg {...common}><path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h10" /></svg>;
      if (n === "box") return <svg {...common}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><path d="M3.3 7L12 12l8.7-5" /><path d="M12 22V12" /></svg>;
      if (n === "coin") return <svg {...common}><circle cx="12" cy="12" r="9" /><path d="M12 7v10M9.5 9.5c.6-.8 1.5-1.2 2.5-1.2 1.7 0 3 1 3 2.6 0 3.1-6 1.6-6 4.6 0 1.6 1.4 2.6 3.1 2.6 1.1 0 2-.5 2.6-1.3" /></svg>;
      if (n === "truck") return <svg {...common}><path d="M3 7h11v10H3z" /><path d="M14 10h4l3 3v4h-7z" /><circle cx="7" cy="18" r="2" /><circle cx="18" cy="18" r="2" /></svg>;
      if (n === "search") return <svg {...common}><circle cx="11" cy="11" r="7" /><path d="M20 20l-3-3" /></svg>;
      if (n === "more") return <svg {...common}><circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" /><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none" /></svg>;
      return null;
    }
    function useFocusForm(pageFilter, key) {
      useEffect(function () {
        if (!pageFilter || pageFilter.focusForm !== key) return;
        var el = document.getElementById("form-" + key);
        if (!el) return;
        el.classList.add("form-focus");
        try { el.scrollIntoView({ behavior: "smooth", block: "start" }); } catch (e) {}
        var t = setTimeout(function () { el.classList.remove("form-focus"); }, 2600);
        return function () { clearTimeout(t); };
      }, [pageFilter, key]);
    }
    function tashkentNowLabel() {
      try {
        return new Intl.DateTimeFormat("uz-UZ", {
          timeZone: "Asia/Tashkent", dateStyle: "medium", timeStyle: "short"
        }).format(new Date());
      } catch (e) { return new Date().toLocaleString("uz-UZ"); }
    }
    function EmptyState(props) {
      return (
        <div className="empty-state empty">
          <div className="empty-ico"><Ico name={props.icon || "box"} /></div>
          <div className="empty-title">{props.title || "Ro'yxat bo'sh"}</div>
          {props.sub ? <div>{props.sub}</div> : null}
        </div>
      );
    }
    function PageHead(props) {
      return (
        <div className="page-head">
          <div>
            <h1>{props.title}</h1>
            {props.sub ? <div className="sub">{props.sub}</div> : null}
          </div>
          <div className="page-actions">{props.children}</div>
        </div>
      );
    }
    function formKeyDown(e, onEsc) {
      if (e.key === "Escape" && typeof onEsc === "function") {
        e.preventDefault();
        onEsc();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        const form = e.currentTarget;
        if (form && typeof form.requestSubmit === "function") form.requestSubmit();
      }
    }


    // Sessiya: sessionStorage + 12 soat. localStorage dagi eski kalit o'chiriladi —
    // brauzerni yopib qayta ochganda kirish so'raladi.
    const SESSION_MS = 12 * 60 * 60 * 1000;
    const SESSION_LONG_MS = 7 * 24 * 60 * 60 * 1000;
    const SS = (function () {
      try {
        var s = window.sessionStorage;
        s.setItem("__bd", "1");
        s.removeItem("__bd");
        return s;
      } catch (e) {
        var mem = {};
        return {
          getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
          setItem: function (k, v) { mem[k] = String(v); },
          removeItem: function (k) { delete mem[k]; }
        };
      }
    })();

    try {
      if (localStorage.getItem("erp_persist") !== "1") {
        localStorage.removeItem("erp_key");
        localStorage.removeItem("erp_key_at");
        localStorage.removeItem("erp_operator");
      }
    } catch (e0) {}

    function useApi() {
      const [apiBase, setApiBase] = useState(function () {
        return localStorage.getItem("erp_api") || DEFAULT_API;
      });
      const [adminKey, setAdminKey] = useState(function () {
        const key = SS.getItem("erp_key") || "";
        const at = Number(SS.getItem("erp_key_at") || 0);
        if (key && at && Date.now() - at > SESSION_MS) {
          SS.removeItem("erp_key");
          SS.removeItem("erp_key_at");
          SS.removeItem("erp_operator");
          return "";
        }
        return key;
      });
      const [operatorName, setOperatorName] = useState(function () {
        return SS.getItem("erp_operator") || "Admin";
      });

      function saveSettings(base, key, operator, remember) {
        setApiBase(base);
        setAdminKey(key);
        const op = operator || "Admin";
        setOperatorName(op);
        try { localStorage.setItem("erp_api", base); } catch (e1) {}
        SS.setItem("erp_key", key);
        SS.setItem("erp_key_at", String(Date.now()));
        SS.setItem("erp_operator", op);
        try {
          if (remember) {
            localStorage.setItem("erp_persist", "1");
            localStorage.setItem("erp_key", key);
            localStorage.setItem("erp_key_at", String(Date.now()));
            localStorage.setItem("erp_operator", op);
          } else {
            localStorage.removeItem("erp_persist");
            localStorage.removeItem("erp_key");
            localStorage.removeItem("erp_key_at");
            localStorage.removeItem("erp_operator");
          }
        } catch (e2) {}
      }

      const api = useCallback(async function (path, opts) {
        opts = opts || {};
        const at = Number(SS.getItem("erp_key_at") || 0);
        if (adminKey && at && Date.now() - at > SESSION_MS) {
          setAdminKey("");
          SS.removeItem("erp_key");
          SS.removeItem("erp_key_at");
          const err = new Error("Sessiya muddati tugadi - qayta kiring");
          err.code = 401;
          throw err;
        }
        const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
        if (adminKey) headers["x-admin-key"] = adminKey;
        const op = operatorName || SS.getItem("erp_operator") || "";
        if (op) headers["x-operator-name"] = op;
        const res = await fetch(apiBase.replace(/\/$/, "") + path, { ...opts, headers: headers });
        const data = await res.json().catch(function () { return {}; });
        if (res.status === 401) {
          setAdminKey("");
          SS.removeItem("erp_key");
          SS.removeItem("erp_key_at");
          const err = new Error(data.error || "Unauthorized");
          err.code = 401;
          throw err;
        }
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || res.statusText || "Xato");
        }
        return data;
      }, [apiBase, adminKey, operatorName]);

      function logout() {
        setAdminKey("");
        setOperatorName("Admin");
        SS.removeItem("erp_key");
        SS.removeItem("erp_key_at");
        SS.removeItem("erp_ui_role");
      }

      return {
        api: api,
        apiBase: apiBase,
        adminKey: adminKey,
        operatorName: operatorName,
        saveSettings: saveSettings,
        logout: logout
      };
    }

    function LoginScreen(props) {
      const [key, setKey] = useState("");
      const [showKey, setShowKey] = useState(false);
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);
      const [remember, setRemember] = useState(false);

      async function submit(e) {
        e.preventDefault();
        if (!key.trim()) {
          setErr("Parolni kiriting");
          return;
        }
        setBusy(true);
        setErr("");
        try {
          const base = (props.apiBase || window.location.origin).replace(/\/$/, "");
          const res = await fetch(base + "/api/dashboard", {
            headers: {
              "x-admin-key": key.trim(),
              "x-operator-name": "Admin"
            }
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            setErr(data.error || "Parol noto'g'ri");
            setBusy(false);
            return;
          }
          props.onLogin(key.trim(), remember);
        } catch (ex) {
          setErr(ex.message || "Ulanish xatosi");
        }
        setBusy(false);
      }

      return (
        <div className="login-wrap">
          <form className="login-card" onSubmit={submit}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <img src="/bd_logo.jpg" alt="Black Diamond" style={{width:40,height:40,borderRadius:8,objectFit:"cover"}} />
              <h1 style={{margin:0}}>Black Diamond OPS</h1>
            </div>
            <p>Kirish uchun parolni yozing</p>
            {err ? <div className="err">{err}</div> : null}
            <label htmlFor="f-1">Parol</label>
            <div style={{ position: "relative", marginBottom: 14 }}>
              <input
                id="f-1"
                type={showKey ? "text" : "password"}
                value={key}
                onChange={function (e) { setKey(e.target.value); }}
                placeholder="Parol"
                autoComplete="current-password"
                autoFocus
                className={err ? "invalid" : ""}
                style={{ marginBottom: 0, paddingRight: 44 }}
              />
              <button
                type="button"
                className="btn-ghost btn-sm"
                onClick={function () { setShowKey(function (v) { return !v; }); }}
                style={{ position: "absolute", right: 6, top: "50%", transform: "translateY(-50%)" }}
                aria-label={showKey ? "Yashirish" : "Ko'rsatish"}
              >
                {showKey ? "Yashir" : "Ko'r"}
              </button>
            </div>
            <label className="remember">
              <input type="checkbox" checked={remember} onChange={function (e) { setRemember(e.target.checked); }} />
              Meni eslab qol (7 kun)
            </label>
            <button className="btn" type="submit" disabled={busy}>
              {busy ? "Tekshirilmoqda..." : "Kirish"}
            </button>
          </form>
        </div>
      );
    }


    function ConfirmModal(props) {
      useEffect(function () {
        if (!props.open) return undefined;
        function onKey(e) {
          if (e.key === "Escape") props.onCancel();
        }
        if (props.money) {
          window.addEventListener("keydown", onKey);
          return function () { window.removeEventListener("keydown", onKey); };
        }
        var tg = window.Telegram && window.Telegram.WebApp;
        var platform = tg ? String(tg.platform || "") : "";
        var inside = !!(tg && (tg.initData || (platform && platform !== "unknown")));
        if (!inside || typeof tg.showConfirm !== "function") {
          window.addEventListener("keydown", onKey);
          return function () { window.removeEventListener("keydown", onKey); };
        }
        var settled = false;
        try {
          tg.showConfirm(props.text || "", function (ok) {
            if (settled) return;
            settled = true;
            if (ok) props.onConfirm();
            else props.onCancel();
          });
        } catch (e) {
          window.addEventListener("keydown", onKey);
          return function () { window.removeEventListener("keydown", onKey); };
        }
        return function () { settled = true; };
      }, [props.open, props.money, props.text]);
      if (!props.open) return null;
      var tg = window.Telegram && window.Telegram.WebApp;
      var platform = tg ? String(tg.platform || "") : "";
      var inside = !!(tg && (tg.initData || (platform && platform !== "unknown")) && typeof tg.showConfirm === "function");
      if (!props.money && inside) return null;
      return (
        <div className="bd-sheet-back" role="presentation" onClick={props.onCancel}>
          <div className="bd-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-sheet-title" onClick={function (e) { e.stopPropagation(); }}>
            <h2 id="confirm-sheet-title">{props.title || (props.money ? "Pul amali" : "Tasdiqlash")}</h2>
            <p className="bd-sheet-text">{props.text}</p>
            {props.detail ? <p className="bd-sheet-detail">{props.detail}</p> : null}
            <div className="bd-sheet-actions">
              <button className="btn btn-ghost" type="button" onClick={props.onCancel}>Bekor</button>
              <button className="btn" type="button" onClick={props.onConfirm}>Tasdiqlash</button>
            </div>
          </div>
        </div>
      );
    }

    function useAutoMsg() {
      const [msg, setMsgRaw] = useState({});
      function setMsg(m) {
        setMsgRaw(m || {});
        if (m && m.text) {
          const ms = m.type === "err" ? 6000 : 2500;
          setTimeout(function () {
            setMsgRaw(function (cur) { return cur && cur.text === m.text ? {} : cur; });
          }, ms);
        }
      }
      return [msg, setMsg];
    }

    function Msg(props) {
      if (!props.text) return null;
      const typ = props.type || "ok";
      const mark = typ === "err" ? "✕" : "✓";
      return (
        <div className={"msg toast " + typ} role="status">
          <span className="mark" aria-hidden="true">{mark}</span>
          <span style={{ flex: 1 }}>{props.text}</span>
          <button type="button" className="msg-x" aria-label="Yopish" onClick={props.onClose}>×</button>
        </div>
      );
    }

    // ---------- Dashboard ----------
    function Dashboard(props) {
      const api = props.api;
      const onNavigate = props.onNavigate;
      const [data, setData] = useState(null);
      const [err, setErr] = useState("");
      const [lastUpdated, setLastUpdated] = useState(null);
      const [period, setPeriod] = useState("today");
      const [dashMore, setDashMore] = useState({ sku: false, mat: false, batch: false, order: false });
      const DASH_LIMIT = 5;
      function dashSlice(arr, key) {
        if (!arr || !arr.length) return [];
        return dashMore[key] ? arr : arr.slice(0, DASH_LIMIT);
      }
      function DashMoreBtn(props) {
        const arr = props.arr || [];
        const k = props.k;
        if (arr.length <= DASH_LIMIT) return null;
        return (
          <button
            type="button"
            className="btn-ghost btn-sm dash-more"
            onClick={function () {
              setDashMore(function (prev) {
                var next = Object.assign({}, prev);
                next[k] = !prev[k];
                return next;
              });
            }}
          >
            {dashMore[k] ? "Kamroq" : ("Ko‘proq · " + (arr.length - DASH_LIMIT))}
          </button>
        );
      }

      function load() {
        api("/api/dashboard")
          .then(function (r) {
            setData(r.data);
            setErr("");
            setLastUpdated(new Date());
          })
          .catch(function (e) { setErr(e.message); });
      }

      useEffect(function () {
        load();
        const interval = setInterval(load, 60000);
        return function () { clearInterval(interval); };
      }, [api]);

      function QuickActions() {
        return (
          <div>
            <div className="dash-section-title">Tez amallar</div>
            <div className="quick-actions">
              <button type="button" onClick={function () { if (onNavigate) onNavigate("orders", { focusForm: "order" }); }}>
                <span className="qa-ico"><Ico name="cart" /></span>
                <span className="qa-title">Sotuv</span>
                <span className="qa-sub">Yangi buyurtma</span>
              </button>
              <button type="button" onClick={function () { if (onNavigate) onNavigate("payments", { focusForm: "payment" }); }}>
                <span className="qa-ico"><Ico name="coin" /></span>
                <span className="qa-title">To'lov</span>
                <span className="qa-sub">Naqd yoki karta</span>
              </button>
              <button type="button" onClick={function () { if (onNavigate) onNavigate("expenses", { focusForm: "expense" }); }}>
                <span className="qa-ico"><Ico name="coin" /></span>
                <span className="qa-title">Xarajat</span>
                <span className="qa-sub">Press, qadoq, boshqa</span>
              </button>
              <button type="button" onClick={function () { if (onNavigate) onNavigate("batches", { focusForm: "batch" }); }}>
                <span className="qa-ico"><Ico name="factory" /></span>
                <span className="qa-title">Partiya</span>
                <span className="qa-sub">Ishlab chiqarish</span>
              </button>
            </div>
          </div>
        );
      }

      if (err) return (
        <div>
          <PageHead title="Bugun" sub="Kunlik ko'rsatkichlar" />
          <div className="msg err">{err}</div>
          <QuickActions />
        </div>
      );
      if (!data) return (
        <div>
          <PageHead title="Bugun" sub="Ma'lumot yuklanmoqda..." />
          <div className="dash-kpis cols-5">
            {[1,2,3,4,5].map(function(i){
              return <div key={i} className="dash-kpi" style={{opacity:0.4}}>
                <div className="label">&nbsp;</div>
                <div className="value">...</div>
              </div>;
            })}
          </div>
        </div>
      );

      const alerts = data.alerts || [];
      const skuStock = data.sku_stock || [];
      const mats = data.material_stock || [];
      const batches = data.active_batches || [];
      const orders = data.recent_orders || [];
      const isMonth = period === "month";
      const savdo = Number(isMonth ? data.oylik_savdo : data.bugungi_savdo || 0);
      const xarajat = Number(isMonth ? data.oylik_xarajat : data.bugungi_xarajat || 0);
      const foyda = Number(isMonth ? data.oylik_foyda : data.bugungi_foyda || 0);
      const naqd = Number(isMonth ? data.oylik_naqd_tushum : data.bugungi_naqd_tushum || 0);
      const qadoqKg = Number(isMonth ? data.oylik_qadoq_kg : data.bugungi_qadoq_kg || 0);

      function shortCode(code) {
        if (!code) return "-";
        const s = String(code);
        if (s.length <= 14) return s;
        return s.slice(0, 6) + "-" + s.slice(-4);
      }

      const omborQiymat = skuStock.reduce(function (s, x) { return s + Number(x.value || 0); }, 0);
      const kunlar = data.kunlar || [];
      const topMahsulot = data.top_mahsulot || [];
      const stockBars = skuStock.slice().sort(function (a, b) {
        return Math.abs(Number(b.balance_qty) || 0) - Math.abs(Number(a.balance_qty) || 0);
      }).slice(0, 6);

      function deltaPct(cur, prev) {
        if (prev === undefined || prev === null || cur === undefined || cur === null) return null;
        var c = Number(cur) || 0;
        var p = Number(prev) || 0;
        if (p === 0 && c === 0) return { dir: "flat", label: "0%" };
        if (p === 0) return { dir: c > 0 ? "up" : "down", label: "yangi" };
        var pct = ((c - p) / Math.abs(p)) * 100;
        var dir = pct > 0.5 ? "up" : pct < -0.5 ? "down" : "flat";
        var sign = pct > 0 ? "+" : pct < 0 ? "−" : "";
        return { dir: dir, label: sign + Math.abs(Math.round(pct)) + "%" };
      }

      function Delta(props2) {
        var d = props2.delta;
        if (!d) return null;
        var cls = "kpi-delta " + d.dir;
        if (props2.invert && d.dir === "up") cls += " bad-up";
        if (props2.invert && d.dir === "down") cls += " good-down";
        var arrow = d.dir === "up" ? "↑" : d.dir === "down" ? "↓" : "·";
        return <div className={cls}>{arrow} {d.label} <span className="kpi-delta-vs">{props2.vs}</span></div>;
      }

      function grouped(n) {
        var v = Math.round(Number(n || 0));
        var body = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        return (v < 0 ? "−" : "") + body;
      }
      function Amount(props2) {
        return (
          <div className="value">
            <span className={props2.neg ? "neg" : ""}>{grouped(props2.n)}</span>
            <span className="kpi-unit">so'm</span>
          </div>
        );
      }

      const vsLabel = isMonth ? "o'tgan oyga" : "kechaga";
      const prevSavdo = isMonth ? data.oldingi_oy_savdo : data.kecha_savdo;
      const prevXarajat = isMonth ? data.oldingi_oy_xarajat : data.kecha_xarajat;
      const prevFoyda = isMonth ? data.oldingi_oy_foyda : data.kecha_foyda;
      const prevNaqd = isMonth ? data.oldingi_oy_naqd : data.kecha_naqd;

      function DualBars() {
        var rows = kunlar;
        var max = 1;
        rows.forEach(function (r) {
          max = Math.max(max, Math.abs(Number(r.savdo) || 0), Math.abs(Number(r.foyda) || 0));
        });
        var w = 640;
        var h = 168;
        var pad = 8;
        var n = Math.max(rows.length, 1);
        var gap = 10;
        var bw = (w - pad * 2 - gap * (n - 1)) / n;
        return (
          <svg className="chart-svg" viewBox={"0 0 " + w + " " + h} role="img" aria-label="7 kunlik savdo va foyda">
            {rows.map(function (r, i) {
              var x = pad + i * (bw + gap);
              var sh = Math.max(2, (Math.abs(Number(r.savdo) || 0) / max) * (h - 28));
              var fh = (Math.abs(Number(r.foyda) || 0) / max) * (h - 28);
              var base = h - 20;
              var day = String(r.sana || "").slice(8);
              return (
                <g key={r.sana || i}>
                  <rect x={x} y={base - sh} width={Math.max(4, bw * 0.42)} height={sh} rx="3" fill="var(--accent-fill)">
                    <title>{"Savdo " + grouped(r.savdo) + " so'm"}</title>
                  </rect>
                  <rect x={x + bw * 0.5} y={base - Math.max(fh, Number(r.foyda) ? 2 : 0)} width={Math.max(4, bw * 0.42)} height={Math.max(fh, 0)} rx="3" fill={Number(r.foyda) < 0 ? "var(--danger)" : "var(--success)"}>
                    <title>{"Foyda " + grouped(r.foyda) + " so'm"}</title>
                  </rect>
                  <text x={x + bw / 2} y={h - 4} textAnchor="middle" fontSize="12" fill="var(--hint)">{day}</text>
                </g>
              );
            })}
          </svg>
        );
      }

      function HBars(props2) {
        var rows = props2.rows || [];
        if (!rows.length) return <div className="empty">Ma'lumot yo'q</div>;
        var max = 1;
        rows.forEach(function (r) { max = Math.max(max, Math.abs(Number(r.value) || 0)); });
        return (
          <div>
            {rows.map(function (r) {
              var pct = Math.max(4, (Math.abs(Number(r.value) || 0) / max) * 100);
              return (
                <div className="hbar" key={r.name}>
                  <div className="hbar-name" title={r.name}>{r.name}</div>
                  <div className="hbar-track"><div className="hbar-fill" style={{ width: pct + "%" }} /></div>
                  <div className="hbar-val">{r.caption}</div>
                </div>
              );
            })}
          </div>
        );
      }

      return (
        <div>
          <PageHead
            title="Bugun"
            sub={(data.business_date || "") + " · Toshkent vaqti · ombor " + money(omborQiymat) + " so'm"}
          >
            <span className="tz-chip">{tashkentNowLabel()}</span>
            <div className="period-toggle">
              <button type="button" className={!isMonth ? "on" : ""} onClick={function () { setPeriod("today"); }}>Bugun</button>
              <button type="button" className={isMonth ? "on" : ""} onClick={function () { setPeriod("month"); }}>Shu oy</button>
            </div>
            <button className="btn-ghost btn-sm" type="button" onClick={load} title="Yangilash">↻</button>
          </PageHead>

          <div className="dash-section-title">Diqqat / ogohlantirish</div>
          <div className="dash-alerts-sticky">
          {alerts.length > 0 ? (
            <div>
              {alerts.map(function (a, i) {
                return (
                  <div key={i} className={"dash-alert " + (a.type === "danger" ? "danger" : "warn")}>
                    {a.text}
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="dash-alert" style={{ background: "var(--success-bg)", color: "var(--success)" }}>
              Ogohlantirish yo'q — zaxira va qarz normal.
            </div>
          )}
          </div>

          <div className="dash-section-title">Asosiy ko'rsatkichlar</div>
          <div className="dash-kpis cols-5">
            <div className="dash-kpi kpi-hero">
              <div className="kpi-top"><span className="kpi-ico"><Ico name="coin" /></span><div className="label">{isMonth ? "Oylik foyda" : "Bugungi foyda"}</div></div>
              <Amount n={foyda} neg={foyda < 0} />
              <Delta delta={deltaPct(foyda, prevFoyda)} vs={vsLabel} />
              <div className="trend">savdo − xarajat</div>
            </div>
            <div className="dash-kpi kpi-click" role="button" tabIndex="0" onClick={function () { if (onNavigate) onNavigate("orders"); }}>
              <div className="kpi-top"><span className="kpi-ico"><Ico name="cart" /></span><div className="label">Savdo</div></div>
              <Amount n={savdo} />
              <Delta delta={deltaPct(savdo, prevSavdo)} vs={vsLabel} />
            </div>
            <div className="dash-kpi kpi-click" role="button" tabIndex="0" onClick={function () { if (onNavigate) onNavigate("payments"); }}>
              <div className="kpi-top"><span className="kpi-ico"><Ico name="coin" /></span><div className="label">Naqd tushum</div></div>
              <Amount n={naqd} />
              <Delta delta={deltaPct(naqd, prevNaqd)} vs={vsLabel} />
            </div>
            <div className="dash-kpi kpi-click" role="button" tabIndex="0" onClick={function () { if (onNavigate) onNavigate("expenses"); }}>
              <div className="kpi-top"><span className="kpi-ico"><Ico name="box" /></span><div className="label">Xarajat</div></div>
              <Amount n={xarajat} />
              <Delta delta={deltaPct(xarajat, prevXarajat)} vs={vsLabel} invert />
            </div>
            <div className={"dash-kpi kpi-click" + (Number(data.jami_qarz) > 3000000 ? " dash-kpi-danger" : "")} role="button" tabIndex="0" onClick={function () { if (onNavigate) onNavigate("people-debt"); }}>
              <div className="kpi-top"><span className="kpi-ico"><Ico name="users" /></span><div className="label">Qarz</div></div>
              <Amount n={data.jami_qarz} neg={Number(data.jami_qarz) > 3000000} />
              <div className="trend">joriy balans</div>
            </div>
          </div>

          <div className="dash-section-title">Grafiklar</div>
          <div className="dash-charts">
            <div className="chart-card wide">
              <h2>7 kun — savdo va foyda</h2>
              <div className="chart-legend">
                <span><i className="chart-swatch" style={{ background: "var(--accent-fill)" }} /> Savdo</span>
                <span><i className="chart-swatch" style={{ background: "var(--success)" }} /> Foyda</span>
                <span><i className="chart-swatch" style={{ background: "var(--danger)" }} /> Zarar</span>
              </div>
              {kunlar.length ? <DualBars /> : <div className="empty">Ma'lumot yo'q</div>}
            </div>
            <div className="chart-card">
              <h2>Top 5 mahsulot</h2>
              <div className="trend">so'nggi 7 kun, summa</div>
              <HBars rows={topMahsulot.map(function (p) {
                return { name: p.name, value: p.summa, caption: grouped(p.summa) };
              })} />
            </div>
            <div className="chart-card">
              <h2>Ombor qoldig'i</h2>
              <div className="trend">tayyor mahsulot, dona</div>
              <HBars rows={stockBars.map(function (s) {
                return { name: s.sku, value: s.balance_qty, caption: qtyText(s.balance_qty) };
              })} />
            </div>
          </div>

          <QuickActions />

          <div className="dash-meta">
            <span>Qadoqlangan: <strong>{qadoqKg.toFixed(1)} kg</strong></span>
            <span>Partiya: <strong>{data.faol_partiya}</strong></span>
            <span>Quruq: <strong>{Number(data.quruq_qoldiq_kg || 0).toFixed(1)} kg</strong></span>
            <span>Mahsulot: <strong>{data.faol_sku}</strong></span>
            {lastUpdated ? <span>Yangilangan: <strong>{tashkentTime(lastUpdated)}</strong></span> : null}
          </div>

          <details className="dash-details">
            <summary>Batafsil ko'rsatkichlar</summary>
          <div className="dash-grid">
            <div className="card tight">
              <h2>Tayyor mahsulot (zavod)</h2>
              {skuStock.length === 0 ? (
                <div className="empty">
                  <div className="empty-ico"><Ico name="box" /></div>
                  <div className="empty-title">Tayyor mahsulot yo'q</div>
                  Avval qadoqlash qiling — Ishlab chiqarish bo'limida
                </div>
              ) : (
                <div className="table-wrap dash-dense">
                <table>
                  <thead>
                    <tr>
                      <th>Mahsulot</th>
                      <th>Qadoqlangan</th>
                      <th>Sotuv</th>
                      <th>Diler</th>
                      <th>Yo'lda</th>
                      <th>Qoldiq</th>
                      <th>Qiymat</th>
                    </tr>
                  </thead>
                  <tbody>
                    {dashSlice(skuStock, "sku").map(function (s) {
                      const bal = Number(s.balance_qty);
                      return (
                        <tr key={s.id} className={bal <= 0 ? "row-zero" : ""}>
                          <td data-label="Mahsulot">{s.sku}</td>
                          <td data-label="Qadoqlangan">{Number(s.packed_qty)}</td>
                          <td data-label="Sotuv">{Number(s.sold_qty)}</td>
                          <td data-label="Diler">{Number(s.shipped_qty || 0)}</td>
                          <td data-label="Yo'lda">{Number(s.yolda_qty || 0)}</td>
                          <td data-label="Qoldiq" className={bal <= 0 ? "neg" : ""}><strong>{qtyText(bal)}</strong></td>
                          <td data-label="Qiymat">{money(s.value)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <DashMoreBtn arr={skuStock} k="sku" />
                </div>
              )}
            </div>

            <div className="card tight">
              <h2>Material</h2>
              {mats.length === 0 ? (
                <div className="empty">
                  <div className="empty-ico"><Ico name="catalog" /></div>
                  <div className="empty-title">Xomashyo yo'q</div>
                  Sozlamalar → Xomashyo va retseptlar
                </div>
              ) : (
                <div className="table-wrap dash-dense">
                <table>
                  <thead>
                    <tr><th>Nomi</th><th>Birlik</th><th>Qoldiq</th><th>Qiymat</th></tr>
                  </thead>
                  <tbody>
                    {dashSlice(mats, "mat").map(function (m) {
                      const bal = Number(m.balance);
                      return (
                        <tr key={m.id} className={bal <= 0 ? "row-zero" : ""}>
                          <td data-label="Nomi">{m.name}</td>
                          <td data-label="Birlik">{m.unit}</td>
                          <td data-label="Qoldiq" className={bal < 0 ? "neg" : ""}><strong>{qtyText(bal)}</strong></td>
                          <td data-label="Qiymat">{money(m.value)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <DashMoreBtn arr={mats} k="mat" />
                </div>
              )}
            </div>
          </div>

          <div className="split-2">
            <div className="card tight">
              <h2>Faol partiyalar</h2>
              {batches.length === 0 ? (
                <div className="empty">
                  <div className="empty-ico"><Ico name="factory" /></div>
                  <div className="empty-title">Faol partiya yo'q</div>
                  Ishlab chiqarish → Partiyalar
                </div>
              ) : (
                <div className="table-wrap dash-dense">
                <table>
                  <thead>
                    <tr><th>Kod</th><th>Quruq</th><th>Qadoqlangan</th><th>Qoldiq</th></tr>
                  </thead>
                  <tbody>
                    {dashSlice(batches, "batch").map(function (b) {
                      const rem = Number(b.remaining_kg);
                      const dry = Number(b.dry_kg) || 1;
                      return (
                        <tr key={b.id}>
                          <td data-label="Kod">{b.batch_code}</td>
                          <td data-label="Quruq">{Number(b.dry_kg).toFixed(1)}</td>
                          <td data-label="Qadoqlangan">{Number(b.packed_kg).toFixed(1)}</td>
                          <td data-label="Qoldiq">
                            {rem.toFixed(1)}
                            <div className="bar-track"><div className="bar-fill" style={{ width: Math.min(100, rem / dry * 100) + "%" }} /></div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <DashMoreBtn arr={batches} k="batch" />
                </div>
              )}
            </div>

            <div className="card tight">
              <h2>So'nggi buyurtmalar</h2>
              {orders.length === 0 ? (
                <div className="empty">
                  <div className="empty-ico"><Ico name="cart" /></div>
                  <div className="empty-title">Buyurtma yo'q</div>
                  Sotuv bo'limidan yoki mijoz ilovasidan keladi
                </div>
              ) : (
                <div className="table-wrap dash-dense">
                <table>
                  <thead>
                    <tr><th>Kod</th><th>Mijoz</th><th>Summa</th><th>Holat</th></tr>
                  </thead>
                  <tbody>
                    {dashSlice(orders, "order").map(function (o) {
                      return (
                        <tr key={o.id}>
                          <td data-label="Kod" title={o.order_code}>{shortCode(o.order_code)}</td>
                          <td data-label="Mijoz">{o.customer_name || "-"}</td>
                          <td data-label="Summa">{money(o.total_amount)}</td>
                          <td data-label="Holat"><StatusBadge status={o.status} /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                <DashMoreBtn arr={orders} k="order" />
                </div>
              )}
            </div>

            <div className="card tight">
              <h2>Yuk tarqatish</h2>
              {(data.recent_field_sales || []).length === 0 ? (
                <div className="empty">
                  <div className="empty-ico"><Ico name="box" /></div>
                  <div className="empty-title">Yuk xati yo'q</div>
                  Sotuv → Yuk tarqatish dan yoziladi. Buyurtmalar ro'yxatiga tushmaydi.
                </div>
              ) : (
                <div className="table-wrap dash-dense">
                <table>
                  <thead>
                    <tr><th>Kod</th><th>Mijoz</th><th>Summa</th><th>Qarz</th></tr>
                  </thead>
                  <tbody>
                    {dashSlice(data.recent_field_sales, "field").map(function (w) {
                      return (
                        <tr key={w.id} onClick={function () { if (onNavigate) onNavigate("yukxati"); }} style={{ cursor: "pointer" }}>
                          <td data-label="Kod">{w.waybill_code}</td>
                          <td data-label="Mijoz">{w.customer_name || "-"}</td>
                          <td data-label="Summa">{money(w.total_amount)}</td>
                          <td data-label="Qarz">{money(w.debt_amount)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
                </div>
              )}
            </div>
          </div>
          </details>
        </div>
      );
    }

    function Stock(props) {
      const api = props.api;
      const [materials, setMaterials] = useState([]);
      const [products, setProducts] = useState([]);
      const [err, setErr] = useState("");
      const [loading, setLoading] = useState(true);

      useEffect(function () {
        setLoading(true);
        Promise.all([api("/api/stock/materials"), api("/api/stock/products")])
          .then(function (arr) {
            setMaterials(arr[0].data || []);
            setProducts(arr[1].data || []);
          })
          .catch(function (e) { setErr(e.message); })
          .finally(function () { setLoading(false); });
      }, [api]);

      if (err) return <div className="msg err">{err}</div>;
      if (loading) return <div className="muted">Yuklanmoqda...</div>;

      const part = props.part || "all";
      const showMat = part === "all" || part === "materials";
      const showProd = part === "all" || part === "products";
      const headTitle = part === "products" ? "Tayyor mahsulot qoldig'i" : (part === "materials" ? "Xomashyo qoldig'i" : "Ombor");
      const headSub = part === "products"
        ? "Qadoqlangan va sotilmagan dona. Narx va foyda shu yerda."
        : (part === "materials"
          ? "Xomashyo qancha qolgani. Kirim shu bo'limning pastida."
          : "Tayyor mahsulot va xomashyo qoldig'i.");

      return (
        <div>
          <PageHead title={headTitle} sub={headSub} />
          {showMat ? (
          <div className="card">
            <h2>Xomashyo qoldig'i</h2>
            {materials.length === 0 ? (
              <div className="empty">
                <div className="empty-title">Xomashyo qoldig'i yo'q</div>
                Sozlamalar → Xomashyo va retseptlar dan qo'shing
              </div>
            ) : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>Nomi</th><th>Birlik</th><th>Kirim</th><th>Chiqim</th><th>Qoldiq</th></tr>
                </thead>
                <tbody>
                  {materials.map(function (m) {
                    return (
                      <tr key={m.id}>
                        <td data-label="Nomi">{m.name}</td>
                        <td data-label="Birlik">{m.unit}</td>
                        <td data-label="Kirim">{Number(m.total_in)}</td>
                        <td data-label="Chiqim">{Number(m.total_out)}</td>
                        <td data-label="Qoldiq"><strong>{Number(m.balance)}</strong></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table></div>
            )}
          </div>
          ) : null}
          {showProd ? (
          <div className="card">
            <h2>Tayyor mahsulot qoldig'i</h2>
            {products.length === 0 ? (
              <EmptyState icon="box" title="Mahsulot qoldiq yo'q" sub="Avval qadoqlash qiling" />
            ) : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>Mahsulot</th><th>Qoldiq</th><th>Yo'lda</th><th>Tannarx</th><th>Sotish</th><th>Foyda/dona</th><th>Ombor tannarx</th><th>Ombor savdo</th><th>Kutilgan foyda</th></tr>
                </thead>
                <tbody>
                  {products.map(function (p) {
                    const line = stockLine(p);
                    const cost = line.cost;
                    const prof = line.prof;
                    const cval = line.cval;
                    const pval = line.pval;
                    return (
                      <tr key={p.id}>
                        <td data-label="Mahsulot">
                          {p.sku}
                          {p.cost_override ? <div className="muted" style={{ fontSize: "0.7rem" }}>qo'lda</div> : null}
                        </td>
                        <td data-label="Qoldiq" className={Number(p.balance_qty) < 0 ? "neg" : ""}><strong>{qtyText(p.balance_qty)}</strong></td>
                        <td data-label="Yo'lda">{Number(p.yolda_qty || 0)}</td>
                        <td data-label="Tannarx">{money(cost)}</td>
                        <td data-label="Sotish">{money(line.sale)}</td>
                        <td data-label="Foyda/dona">{money(prof)}</td>
                        <td data-label="Ombor tannarx">{money(cval)}</td>
                        <td data-label="Ombor savdo">{money(line.sval)}</td>
                        <td data-label="Kutilgan foyda" className={Number(pval) < 0 ? "neg" : ""}>{money(pval)}</td>
                      </tr>
                    );
                  })}
                </tbody>
                                <tfoot>
                  <tr className="row-total">
                    <td data-label="Jami">Jami</td>
                    <td data-label="Qoldiq"><strong>{products.reduce(function (a, p) { return a + Number(p.balance_qty || 0); }, 0)}</strong></td>
                    <td data-label="Yo'lda"><strong>{products.reduce(function (a, p) { return a + Number(p.yolda_qty || 0); }, 0)}</strong></td>
                    <td className="desk-only" colSpan="3"></td>
                    <td data-label="Ombor tannarx"><strong>{money(products.reduce(function (a, p) { return a + stockLine(p).cval; }, 0))}</strong></td>
                    <td data-label="Ombor savdo"><strong>{money(products.reduce(function (a, p) { return a + stockLine(p).sval; }, 0))}</strong></td>
                    <td data-label="Kutilgan foyda"><strong>{money(products.reduce(function (a, p) { return a + stockLine(p).pval; }, 0))}</strong></td>
                  </tr>
                </tfoot>
              </table></div>
            )}
          </div>
          ) : null}
        </div>
      );
    }

    // ---------- Products ----------
    function Products(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const emptyForm = { sku: "", weight_kg: "", price: "", cost_price: "", description: "", img1: "", img2: "", img3: "" };
      const [form, setForm] = useState(emptyForm);
      const [editId, setEditId] = useState(null);
      const [editForm, setEditForm] = useState({ sku: "", weight_kg: "", price: "", cost_price: "", description: "", is_active: true, img1: "", img2: "", img3: "" });
      const [materials, setMaterials] = useState([]);
      const [recipeRows, setRecipeRows] = useState([]);
      const [q, setQ] = useState("");
      const [ferr, setFerr] = useState({});
      const [inlineId, setInlineId] = useState(null);
      const [inlineVal, setInlineVal] = useState("");

      function urlsFrom(f) {
        return [f.img1, f.img2, f.img3].map(function (s) { return String(s || "").trim(); }).filter(Boolean);
      }
      function urlsTo(arr) {
        const a = Array.isArray(arr) ? arr : [];
        return { img1: a[0] || "", img2: a[1] || "", img3: a[2] || "" };
      }
      const [msg, setMsg] = useAutoMsg();

      const load = useCallback(function () {
        Promise.all([api("/api/products?active=0"), api("/api/materials?active=0")])
          .then(function (arr) {
            setList(arr[0].data || []);
            setMaterials(arr[1].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!String(form.sku || "").trim()) next.sku = "Mahsulot kodi majburiy";
        if (form.price !== "" && Number(form.price) < 0) next.price = "Narx manfiy bo'lmasin";
        setFerr(next);
        if (next.sku || next.price) return;
        try {
          await api("/api/products", {
            method: "POST",
            body: JSON.stringify({
              sku: form.sku,
              weight_kg: Number(form.weight_kg) || 0,
              price: Math.round(Number(form.price) || 0),
              cost_price: Math.round(Number(form.cost_price) || 0),
              description: form.description || null,
              image_urls: urlsFrom(form)
            })
          });
          setMsg({ text: "Mahsulot qo'shildi", type: "ok" });
          setForm(emptyForm);
          setFerr({});
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function startEdit(p) {
        setEditId(p.id);
        const imgs = urlsTo(p.image_urls);
        setEditForm({
          sku: p.sku || "",
          weight_kg: String(p.weight_kg != null ? p.weight_kg : ""),
          price: String(p.price != null ? p.price : ""),
          cost_price: String(Math.round(Number(p.cost_price) || 0)),
          description: p.description || "",
          is_active: p.is_active !== false,
          img1: imgs.img1,
          img2: imgs.img2,
          img3: imgs.img3
        });
        setRecipeRows([]);
        api("/api/products/" + p.id + "/recipes")
          .then(function (r) {
            setRecipeRows((r.data || []).map(function (x) {
              return {
                material_id: String(x.material_id),
                qty: String(x.qty != null ? x.qty : ""),
                line_amount: String(x.line_amount != null ? Math.round(Number(x.line_amount)) : "")
              };
            }));
          })
          .catch(function () { setRecipeRows([]); });
      }

      function cancelEdit() {
        setEditId(null);
        setRecipeRows([]);
      }

      function matPrice(id) {
        const m = materials.filter(function (x) { return String(x.id) === String(id); })[0];
        return m ? Number(m.price || 0) : 0;
      }
      function rowAmount(row) {
        if (row.line_amount !== "" && row.line_amount != null) return Math.round(Number(row.line_amount) || 0);
        return Math.round((Number(row.qty) || 0) * matPrice(row.material_id));
      }
      function recipeTotal() {
        return recipeRows.reduce(function (s, row) { return s + rowAmount(row); }, 0);
      }

      async function saveEdit(e) {
        e.preventDefault();
        try {
          await api("/api/products/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              sku: editForm.sku,
              weight_kg: Number(editForm.weight_kg) || 0,
              price: Math.round(Number(editForm.price) || 0),
              cost_price: Math.round(Number(editForm.cost_price) || 0),
              description: editForm.description || null,
              is_active: !!editForm.is_active,
              image_urls: urlsFrom(editForm)
            })
          });
          await api("/api/products/" + editId + "/recipes", {
            method: "PUT",
            body: JSON.stringify({
              lines: recipeRows.filter(function (x) { return x.material_id; }).map(function (x) {
                return {
                  material_id: Number(x.material_id),
                  qty: Number(x.qty) || 0,
                  line_amount: x.line_amount === "" ? null : Math.round(Number(x.line_amount) || 0)
                };
              })
            })
          });
          setMsg({ text: "Mahsulot va narx saqlandi", type: "ok" });
          setEditId(null);
          setRecipeRows([]);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });

      async function saveInlinePrice(p) {
        const next = Math.round(Number(inlineVal));
        setInlineId(null);
        if (!Number.isFinite(next) || next < 0) {
          setMsg({ text: "Narx noto'g'ri", type: "err" });
          return;
        }
        if (next === Math.round(Number(p.price || 0))) return;
        try {
          await api("/api/products/" + p.id, {
            method: "PUT",
            body: JSON.stringify({
              sku: p.sku,
              weight_kg: Number(p.weight_kg) || 0,
              price: next,
              cost_price: Math.round(Number(p.cost_price) || 0),
              description: p.description || null,
              is_active: p.is_active !== false,
              image_urls: Array.isArray(p.image_urls) ? p.image_urls : []
            })
          });
          setMsg({ text: "Narx saqlandi", type: "ok" });
          load();
        } catch (e) {
          setMsg({ text: e.message, type: "err" });
        }
      }

      async function softDelete(id) {
        setConfirmState({
          open: true,
          text: "Mahsulotni nofaol qilish?",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/products/" + id, { method: "DELETE" });
              setMsg({ text: "Mahsulot nofaol qilindi", type: "ok" });
              load();
            } catch (e) {
              setMsg({ text: e.message, type: "err" });
            }
          }
        });
      }

      return (
        <div>
          <ConfirmModal
            open={confirmState.open}
            text={confirmState.text}
            onCancel={function () { setConfirmState({ open: false, text: "", onConfirm: null }); }}
            onConfirm={function () { if (confirmState.onConfirm) confirmState.onConfirm(); }}
          />
          <PageHead title="Mahsulotlar va narxlar" sub="Bazadagi narx = optom. Kichik xaridga qo'shimcha chegirma Sozlamada." />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">
            <h2>Yangi mahsulot</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e); }}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-2">Mahsulot kodi *</label>
                  <input id="f-2" value={form.sku} onChange={function (e) { setForm({ ...form, sku: e.target.value }); }} />
                  <FieldErr text={ferr.sku} />
                </div>
                <div>
                  <label htmlFor="f-3">Ogirlik (kg)</label>
                  <input id="f-3" type="number" step="0.1" value={form.weight_kg} onChange={function (e) { setForm({ ...form, weight_kg: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-4">Optom narx (so'm)</label>
                  <input id="f-4" type="number" min="0" step="1" value={form.price} onChange={function (e) { setForm({ ...form, price: e.target.value }); }} />
                  <FieldErr text={ferr.price} />
                  {form.price ? (
                    <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                      Mijoz: {money(mijozNarx(form.price))} so'm
                    </div>
                  ) : null}
                </div>
                <div>
                  <label htmlFor="f-cost">Tannarx qo'lda (0 = avto)</label>
                  <input id="f-cost" type="number" min="0" step="1" value={form.cost_price} onChange={function (e) { setForm({ ...form, cost_price: e.target.value }); }} />
                  {form.price && Number(form.cost_price) > 0 ? (
                    <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                      Foyda: {money(Math.round(Number(form.price) - Number(form.cost_price)))} so'm
                    </div>
                  ) : (
                    <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                      0 = avto tannarx. Foyda = sotish − tannarx.
                    </div>
                  )}
                </div>
              </div>
              <details className="dash-details">
                <summary>Qo'shimcha</summary>
                <div className="form-row">
                  <div>
                    <label htmlFor="f-5">Batafsil (mijozga)</label>
                    <textarea id="f-5" rows={4} placeholder="Mahsulot haqida matn — mijoz Batafsilida chiqadi" value={form.description} onChange={function (e) { setForm({ ...form, description: e.target.value }); }} />
                  </div>
                </div>
                <div className="form-row">
                  <div>
                    <label htmlFor="f-img1">Rasm 1 URL</label>
                    <input id="f-img1" value={form.img1} onChange={function (e) { setForm({ ...form, img1: e.target.value }); }} placeholder="https://lh3.googleusercontent.com/d/..." />
                  </div>
                  <div>
                    <label htmlFor="f-img2">Rasm 2 URL</label>
                    <input id="f-img2" value={form.img2} onChange={function (e) { setForm({ ...form, img2: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-img3">Rasm 3 URL</label>
                    <input id="f-img3" value={form.img3} onChange={function (e) { setForm({ ...form, img3: e.target.value }); }} />
                  </div>
                </div>
                <p className="muted" style={{ fontSize: "0.72rem", marginTop: -4 }}>Drive fayl ID: https://lh3.googleusercontent.com/d/FILE_ID — bot galereyasida shu tartibda chiqadi.</p>
              </details>
              <button className="btn" type="submit">Qo'shish</button>
            </form>
          </div>

          {editId ? (
            <div className="card">
              <h2>Mahsulotni tahrirlash</h2>
              <form onSubmit={saveEdit} onKeyDown={function (e) { formKeyDown(e, cancelEdit); }}>
                <div className="form-row">
                  <div>
                    <label htmlFor="f-6">Mahsulot kodi *</label>
                    <input id="f-6" value={editForm.sku} onChange={function (e) { setEditForm({ ...editForm, sku: e.target.value }); }} required />
                  </div>
                  <div>
                    <label htmlFor="f-7">Ogirlik (kg)</label>
                    <input id="f-7" type="number" step="0.1" value={editForm.weight_kg} onChange={function (e) { setEditForm({ ...editForm, weight_kg: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-8">Optom narx (so'm)</label>
                    <input id="f-8" type="number" min="0" step="1" value={editForm.price} onChange={function (e) { setEditForm({ ...editForm, price: e.target.value }); }} />
                    {editForm.price ? (
                      <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                        Mijoz: {money(mijozNarx(editForm.price))} so'm
                      </div>
                    ) : null}
                  </div>
                  <div>
                    <label htmlFor="f-ecost">Tannarx qo'lda (0 = avto)</label>
                    <input id="f-ecost" type="number" min="0" step="1" value={editForm.cost_price} onChange={function (e) { setEditForm({ ...editForm, cost_price: e.target.value }); }} />
                    {editForm.price && Number(editForm.cost_price) > 0 ? (
                      <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                        Foyda: {money(Math.round(Number(editForm.price) - Number(editForm.cost_price)))} so'm
                      </div>
                    ) : (
                      <div className="muted" style={{ fontSize: "0.72rem", marginTop: -4, marginBottom: 8 }}>
                        0 = avto tannarx. Foyda = sotish − tannarx.
                      </div>
                    )}
                  </div>
                  <div>
                    <label htmlFor="f-10">Holat</label>
                    <select id="f-10" value={editForm.is_active ? "1" : "0"} onChange={function (e) { setEditForm({ ...editForm, is_active: e.target.value === "1" }); }}>
                      <option value="1">Faol</option>
                      <option value="0">Nofaol</option>
                    </select>
                  </div>
                </div>
                <details className="dash-details">
                  <summary>Qo'shimcha</summary>
                  <div className="form-row">
                    <div>
                      <label htmlFor="f-9">Batafsil (mijozga)</label>
                      <textarea id="f-9" rows={4} placeholder="Mahsulot haqida matn — mijoz Batafsilida chiqadi" value={editForm.description} onChange={function (e) { setEditForm({ ...editForm, description: e.target.value }); }} />
                    </div>
                  </div>
                <div className="form-row">
                  <div>
                    <label htmlFor="f-eimg1">Rasm 1 URL</label>
                    <input id="f-eimg1" value={editForm.img1} onChange={function (e) { setEditForm({ ...editForm, img1: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-eimg2">Rasm 2 URL</label>
                    <input id="f-eimg2" value={editForm.img2} onChange={function (e) { setEditForm({ ...editForm, img2: e.target.value }); }} />
                  </div>
                  <div>
                    <label htmlFor="f-eimg3">Rasm 3 URL</label>
                    <input id="f-eimg3" value={editForm.img3} onChange={function (e) { setEditForm({ ...editForm, img3: e.target.value }); }} />
                  </div>
                </div>
                </details>
                <h3 style={{ fontSize: "0.85rem", margin: "12px 0 8px" }}>Retsept — 1 dona uchun xomashyo</h3>
                <p className="muted" style={{ fontSize: "0.72rem", marginTop: 0 }}>Miqdor va summani qo'lda yozing. Summa bo'sh qolsa: miqdor × material narxi. Tan narx = qatorlar yig'indisi.</p>
                <div className="table-wrap list-dense">
                  <table>
                    <thead>
                      <tr><th>Xomashyo</th><th>Miqdor</th><th>Summa (so'm)</th><th></th></tr>
                    </thead>
                    <tbody>
                      {recipeRows.map(function (row, idx) {
                        return (
                          <tr key={idx}>
                            <td>
                              <select value={row.material_id} onChange={function (e) {
                                const next = recipeRows.slice();
                                next[idx] = { ...row, material_id: e.target.value };
                                setRecipeRows(next);
                              }}>
                                <option value="">— tanlang —</option>
                                {materials.map(function (m) {
                                  return <option key={m.id} value={m.id}>{m.name} ({m.unit})</option>;
                                })}
                              </select>
                            </td>
                            <td>
                              <input type="number" step="0.0001" value={row.qty} onChange={function (e) {
                                const next = recipeRows.slice();
                                next[idx] = { ...row, qty: e.target.value };
                                setRecipeRows(next);
                              }} />
                            </td>
                            <td>
                              <input type="number" min="0" step="1" value={row.line_amount} placeholder={String(Math.round((Number(row.qty) || 0) * matPrice(row.material_id)))} onChange={function (e) {
                                const next = recipeRows.slice();
                                next[idx] = { ...row, line_amount: e.target.value };
                                setRecipeRows(next);
                              }} />
                            </td>
                            <td>
                              <button type="button" className="btn-ghost btn-sm" onClick={function () {
                                setRecipeRows(recipeRows.filter(function (_, i) { return i !== idx; }));
                              }}>O'chirish</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "8px 0 12px" }}>
                  <button type="button" className="btn-ghost btn-sm" onClick={function () {
                    setRecipeRows(recipeRows.concat([{ material_id: "", qty: "", line_amount: "" }]));
                  }}>+ qator</button>
                  <span className="muted">Tan narx: <strong>{money(recipeTotal())}</strong> so'm</span>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn" type="submit">Saqlash</button>
                  <button className="btn-ghost" type="button" onClick={cancelEdit}>Bekor</button>
                </div>
              </form>
            </div>
          ) : null}

          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>Mahsulotlar ({list.filter(function (p) { return matchQ(q, [p.sku, p.description]); }).length})</h2>
              <input type="search" placeholder="Qidiruv: mahsulot..." value={q} onChange={function (e) { setQ(e.target.value); }} />
            </div>
            <div className="table-wrap list-dense"><table>
              <thead>
                <tr><th>Mahsulot</th><th>kg</th><th>Tannarx</th><th>Optom</th><th>Foyda</th><th>Mijoz</th><th>Rasm</th><th>Holat</th><th></th></tr>
              </thead>
              <tbody>
                {list.filter(function (p) { return matchQ(q, [p.sku, p.description]); }).map(function (p) {
                  return (
                    <tr key={p.id}>
                      <td data-label="Mahsulot">{p.sku}</td>
                      <td data-label="kg">{p.weight_kg}</td>
                      <td data-label="Tannarx">{money(p.unit_cost != null ? p.unit_cost : p.cost_price)}</td>
                      <td data-label="Optom">
                        {inlineId === p.id ? (
                          <input
                            className="inline-edit"
                            type="number"
                            autoFocus
                            value={inlineVal}
                            onChange={function (e) { setInlineVal(e.target.value); }}
                            onBlur={function () { saveInlinePrice(p); }}
                            onKeyDown={function (e) {
                              if (e.key === "Enter") { e.preventDefault(); saveInlinePrice(p); }
                              if (e.key === "Escape") setInlineId(null);
                            }}
                          />
                        ) : (
                          <span className="price-edit">
                            <span className="price-cell">{money(p.price)}</span>
                            <button type="button" aria-label="Narxni tahrirlash" onClick={function () { setInlineId(p.id); setInlineVal(String(Math.round(Number(p.price) || 0))); }}>✎</button>
                          </span>
                        )}
                      </td>
                      <td data-label="Foyda">{money(Math.round(Number(p.price || 0) - Number(p.unit_cost != null ? p.unit_cost : p.cost_price || 0)))}</td>
                      <td data-label="Mijoz">{money(mijozNarx(p.price))}</td>
                      <td>{(p.image_urls && p.image_urls.length) ? p.image_urls.length : 0}</td>
                      <td>
                        <StatusBadge status={p.is_active ? "active" : "closed"}>{p.is_active ? "faol" : "nofaol"}</StatusBadge>
                      </td>
                      <td>
                        <button type="button" className="btn-ghost btn-sm" onClick={function () { startEdit(p); }}>Tahrir</button>
                        {" "}
                        {p.is_active ? (
                          <button type="button" className="btn-danger btn-sm" onClick={function () { softDelete(p.id); }}>O'chirish</button>
                        ) : null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table></div>
          </div>
        </div>
      );
    }

    function Materials(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [form, setForm] = useState({ name: "", unit: "kg", price: "", initial_stock: "" });
      const [editId, setEditId] = useState(null);
      const [editForm, setEditForm] = useState({ name: "", unit: "kg", price: "", is_active: true });
      const [mov, setMov] = useState({ material_id: "", qty: "", unit_price: "", note: "" });
      const [msg, setMsg] = useAutoMsg();
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [q, setQ] = useState("");
      const [ferr, setFerr] = useState({});
      const [inlineId, setInlineId] = useState(null);
      const [inlineVal, setInlineVal] = useState("");

      const load = useCallback(function () {
        api("/api/materials?active=0")
          .then(function (r) { setList(r.data || []); })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      const part = props.part || "all";
      const showCreate = part === "all" || part === "catalog";
      const showIn = part === "all" || part === "inbound";
      const showList = part === "all" || part === "catalog";

      async function saveInlinePrice(m) {
        const next = Number(inlineVal);
        setInlineId(null);
        if (!Number.isFinite(next) || next < 0) {
          setMsg({ text: "Narx noto'g'ri", type: "err" });
          return;
        }
        if (next === Number(m.price || 0)) return;
        try {
          await api("/api/materials/" + m.id, {
            method: "PUT",
            body: JSON.stringify({
              name: m.name,
              unit: m.unit || "kg",
              price: next,
              is_active: m.is_active !== false
            })
          });
          setMsg({ text: "Narx saqlandi", type: "ok" });
          load();
        } catch (e) {
          setMsg({ text: e.message, type: "err" });
        }
      }

      async function submitMat(e) {
        e.preventDefault();
        const next = {};
        if (!String(form.name || "").trim()) next.name = "Nomi majburiy";
        setFerr(next);
        if (next.name) return;
        try {
          await api("/api/materials", {
            method: "POST",
            body: JSON.stringify({
              name: form.name,
              unit: form.unit || "kg",
              price: Number(form.price) || 0,
              initial_stock: Number(form.initial_stock) || 0
            })
          });
          setMsg({ text: "Material qo'shildi", type: "ok" });
          setForm({ name: "", unit: "kg", price: "", initial_stock: "" });
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function startEdit(m) {
        setEditId(m.id);
        setEditForm({
          name: m.name || "",
          unit: m.unit || "kg",
          price: String(m.price != null ? m.price : ""),
          is_active: m.is_active !== false
        });
      }

      async function saveEdit(e) {
        e.preventDefault();
        try {
          await api("/api/materials/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              name: editForm.name,
              unit: editForm.unit || "kg",
              price: Number(editForm.price) || 0,
              is_active: !!editForm.is_active
            })
          });
          setMsg({ text: "Material yangilandi", type: "ok" });
          setEditId(null);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function softDelete(id) {
        setConfirmState({
          open: true,
          text: "Materialni nofaol qilish?",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/materials/" + id, { method: "DELETE" });
              setMsg({ text: "Material nofaol qilindi", type: "ok" });
              load();
            } catch (err) {
              setMsg({ text: err.message, type: "err" });
            }
          }
        });
      }

      async function submitIn(e) {
        e.preventDefault();
        try {
          await api("/api/material-movements", {
            method: "POST",
            body: JSON.stringify({
              material_id: Number(mov.material_id),
              movement_type: "in",
              qty: Number(mov.qty),
              unit_price: Number(mov.unit_price) || 0,
              note: mov.note || "Kirim"

          setMsg({ text: err.message, type: "err" });

            <h2>Yangi xomashyo</h2>

              <button className="btn" type="submit">Qo'shish</button>

                </div>
                <div>
                  <label htmlFor="f-18">Izoh</label>
                  <input id="f-18" value={mov.note} onChange={function (e) { setMov({ ...mov, note: e.target.value }); }} />
                </div>
              </div>
              <button className="btn" type="submit">Kirim</button>
            </form>
          </div>
          ) : null}
          {editId && showCreate ? (
            <div className="card">
              <h2>Tahrirlash #{editId}</h2>
              <form onSubmit={saveEdit} onKeyDown={function (e) { formKeyDown(e, function () { setEditId(null); }); }}>
                <div className="form-row">
                  <div>
                    <label>Nomi</label>
                    <input value={editForm.name} onChange={function (e) { setEditForm({ ...editForm, name: e.target.value }); }} required />
                  </div>
                  <div>
                    <label>Birlik</label>
                    <input value={editForm.unit} onChange={function (e) { setEditForm({ ...editForm, unit: e.target.value }); }} />
                  </div>
                  <div>
                    <label>Narx</label>
                    <input type="number" value={editForm.price} onChange={function (e) { setEditForm({ ...editForm, price: e.target.value }); }} />
                  </div>
                  <div>
                    <label>Faol</label>
                    <select value={editForm.is_active ? "1" : "0"} onChange={function (e) { setEditForm({ ...editForm, is_active: e.target.value === "1" }); }}>
                      <option value="1">Ha</option>
                      <option value="0">Yo'q</option>
                    </select>
                  </div>
                </div>
                <button className="btn" type="submit">Saqlash</button>
                <button className="btn-ghost" type="button" onClick={function () { setEditId(null); }}>Bekor</button>

          {showList ? (
          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>Xomashyo ro'yxati ({list.filter(function (m) { return matchQ(q, [m.name, m.unit]); }).length})</h2>
              <input type="search" placeholder="Qidiruv: nomi..." value={q} onChange={function (e) { setQ(e.target.value); }} />
            </div>
            <div className="table-wrap list-dense">
              <table>
                <thead>
                  <tr>
                    <th>ID</th><th>Nomi</th><th>Birlik</th><th>Narx</th><th>Holat</th>
                    <th className="sticky-actions">Amallar</th>
                  </tr>
                </thead>
                <tbody>
                  {list.filter(function (m) { return matchQ(q, [m.name, m.unit]); }).map(function (m) {
                    return (
                      <tr key={m.id}>
                        <td data-label="ID">{m.id}</td>
                        <td data-label="Nomi">{m.name}</td>
                        <td data-label="Birlik">{m.unit}</td>
                        <td>
                          {inlineId === m.id ? (
                            <input
                              className="inline-edit"
                              type="number"
                              autoFocus
                              value={inlineVal}
                              onChange={function (e) { setInlineVal(e.target.value); }}
                              onBlur={function () { saveInlinePrice(m); }}
                              onKeyDown={function (e) {
                                if (e.key === "Enter") { e.preventDefault(); saveInlinePrice(m); }
                                if (e.key === "Escape") setInlineId(null);
                              }}

                            <span className="price-edit">
                              <span className="price-cell">{money(m.price)}</span>
                              <button type="button" aria-label="Narxni tahrirlash" onClick={function () { setInlineId(m.id); setInlineVal(String(m.price != null ? m.price : "")); }}>✎</button>
