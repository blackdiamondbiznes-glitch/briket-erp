<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Briket ERP - Admin</title>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a;
      --text: #e8eaed; --muted: #9aa0a6; --accent: #c9a227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.45;
    }
    .shell { min-height: 100vh; }
    .sidebar {
      display: none;
      position: fixed; inset: 0 auto 0 0; width: 220px;
      background: var(--card); border-right: 1px solid var(--border);
      padding: 16px 12px; z-index: 20; flex-direction: column;
    }
    .sidebar .brand-kicker {
      font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    }
    .sidebar .brand-title {
      color: var(--accent); font-weight: 700; font-size: 1.05rem; margin: 4px 0 16px;
    }
    .side-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .side-nav button, .bottom-nav button {
      background: transparent; border: none; color: var(--muted);
      text-align: left; padding: 11px 12px; border-radius: 8px;
      cursor: pointer; font-size: 0.88rem; font-weight: 500;
    }
    .side-nav button.active, .bottom-nav button.active {
      background: var(--accent); color: #111; font-weight: 600;
    }
    .side-nav button:hover:not(.active) { background: #12151b; color: var(--text); }
    .main {
      padding: 12px 14px 88px;
      max-width: 1120px; margin: 0 auto;
    }
    .mobile-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .mobile-top h1 { font-size: 1rem; color: var(--accent); margin: 0; }
    .segment {
      display: flex; flex-wrap: wrap; gap: 4px;
      background: #12151b; border: 1px solid var(--border);
      border-radius: 10px; padding: 4px; margin-bottom: 14px;
    }
    .segment button {
      flex: 1; min-width: 72px; border: none; background: transparent;
      color: var(--muted); padding: 9px 10px; border-radius: 8px;
      cursor: pointer; font-size: 0.82rem; font-weight: 500;
    }
    .segment button.active {
      background: var(--accent); color: #111; font-weight: 600;
    }
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--card); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-nav button {
      text-align: center; font-size: 0.65rem; padding: 8px 4px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      min-height: 56px; justify-content: center;
    }
    .bottom-nav .ico { font-size: 0.95rem; line-height: 1; opacity: 0.9; }
    @media (min-width: 860px) {
      .sidebar { display: flex; }
      .main { margin-left: 220px; padding: 22px 28px 28px; max-width: none; }
      .mobile-top { display: none; }
      .bottom-nav { display: none; }
    }
    /* legacy nav kept inert */
    .nav { display: none; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; margin-bottom: 12px;
    }
    .card h2 { font-size: 0.92rem; margin-bottom: 10px; color: var(--accent); }
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .kpi {
      background: #12151b; border-radius: 10px; padding: 12px; border: 1px solid var(--border);
    }
    .kpi .label { font-size: 0.72rem; color: var(--muted); }
    .kpi .value { font-size: 1.15rem; font-weight: 700; margin-top: 4px; }
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -2px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 480px; }
    th, td { text-align: left; padding: 7px 5px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; font-size: 0.72rem; }
    input, select, textarea {
      width: 100%; background: #12151b; border: 1px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 8px;
    }
    label { font-size: 0.72rem; color: var(--muted); display: block; margin-bottom: 2px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 700px) {
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }
    .btn {
      background: var(--accent); color: #111; border: none; padding: 9px 15px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
    }
    .btn:disabled { opacity: 0.5; }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .msg { padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; }
    .msg.ok { background: #14301f; color: #81c995; }
    .msg.err { background: #3c1518; color: #f28b82; }
    .muted { color: var(--muted); font-size: 0.8rem; }
    .badge {
      display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 0.68rem;
      background: #2a2f3a; color: var(--muted);
    }
    .badge.active, .badge.paid { background: #14301f; color: #81c995; }
    .badge.closed { background: #2a2f3a; color: var(--muted); }
    .badge.partial { background: #3d2e0a; color: #fdd663; }
    .badge.pending, .badge.confirmed { background: #1a2a3a; color: #8ab4f8; }
    .badge.rejected, .badge.cancelled { background: #3c1518; color: #f28b82; }
    .empty { text-align: center; padding: 20px; color: var(--muted); }
    /* Dashboard — ixcham (Linear / Vercel uslubi) */
    .dash-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .dash-kpi {
      background: #12151b; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px;
    }
    .dash-kpi .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .dash-kpi .value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; line-height: 1.25; }
    .dash-meta {
      display: flex; flex-wrap: wrap; gap: 6px 12px;
      margin-bottom: 10px; padding: 8px 10px;
      background: #12151b; border: 1px solid var(--border); border-radius: 10px;
      font-size: 0.75rem; color: var(--muted);
    }
    .dash-meta strong { color: var(--text); font-weight: 600; }
    .dash-alert {
      font-size: 0.78rem; padding: 6px 10px; border-radius: 8px; margin-bottom: 6px;
    }
    .dash-alert.danger { background: #3c1518; color: #f28b82; }
    .dash-alert.warn { background: #3d2e0a; color: #fdd663; }
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
    }
    .card.tight { padding: 12px; margin-bottom: 10px; }
    .card.tight h2 { font-size: 0.82rem; margin-bottom: 8px; }
    .card.tight table { font-size: 0.75rem; }
    .card.tight th, .card.tight td { padding: 5px 4px; }
    .order-row-code { font-family: ui-monospace, monospace; font-size: 0.7rem; color: var(--muted); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .neg { color: #f28b82; font-weight: 700; }
    @media (max-width: 700px) {
      .dash-kpis { grid-template-columns: 1fr 1fr; }
      .dash-grid { grid-template-columns: 1fr; }
    }
    .settings-bar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .settings-bar > div { flex: 1; min-width: 160px; }
    .line-items { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .line-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 6px; align-items: end; margin-bottom: 6px; }
    @media (max-width: 600px) { .line-row { grid-template-columns: 1fr 1fr; } }
    .total-box {
      background: #12151b; border-radius: 8px; padding: 10px 12px; margin: 8px 0;
      display: flex; justify-content: space-between; font-weight: 600;
    }

    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #0a0a0b;
    }
    .login-card {
      width: 100%; max-width: 380px; background: #141210; border: 1px solid #2e2a22;
      border-radius: 16px; padding: 28px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .login-card h1 { font-size: 1.15rem; color: #e8d5a3; margin-bottom: 4px; }
    .login-card p { font-size: 0.8rem; color: #8a8270; margin-bottom: 18px; }
    .login-card label { display: block; font-size: 0.75rem; color: #b0a894; margin-bottom: 6px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #3f3a30;
      background: #1a1814; color: #f5f0e6; font-size: 0.95rem; margin-bottom: 14px;
    }
    .login-card input:focus { outline: none; border-color: #c9a227; }
    .login-card .btn {
      width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 700;
      background: linear-gradient(180deg, #d4b03a, #c9a227); color: #1a1408; cursor: pointer;
    }
    .login-card .err { color: #fca5a5; font-size: 0.85rem; margin-bottom: 10px; }
    .logout-btn {
      margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px;
      border: 1px solid #2e2a22; background: transparent; color: #8a8270;
      font-size: 0.75rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const DEFAULT_API = window.location.origin;

    function money(n) {
      return Number(n || 0).toLocaleString("uz-UZ");
    }

    function useApi() {
      const [apiBase, setApiBase] = useState(function () {
        return localStorage.getItem("erp_api") || DEFAULT_API;
      });
      const [adminKey, setAdminKey] = useState(function () {
        return localStorage.getItem("erp_key") || "";
      });

      function saveSettings(base, key) {
        setApiBase(base);
        setAdminKey(key);
        localStorage.setItem("erp_api", base);
        localStorage.setItem("erp_key", key);
      }

      const api = useCallback(async function (path, opts) {
        opts = opts || {};
        const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
        if (adminKey) headers["x-admin-key"] = adminKey;
        const res = await fetch(apiBase.replace(/\/$/, "") + path, Object.assign({}, opts, { headers: headers }));
        const data = await res.json().catch(function () { return {}; });
        if (res.status === 401) {
          const err = new Error(data.error || "Unauthorized");
          err.code = 401;
          throw err;
        }
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || res.statusText || "Xato");
        }
        return data;
      }, [apiBase, adminKey]);

      function logout() {
        setAdminKey("");
        localStorage.removeItem("erp_key");
      }

      return { api: api, apiBase: apiBase, adminKey: adminKey, saveSettings: saveSettings, logout: logout };
    }

    function LoginScreen(props) {
      const [key, setKey] = useState("");
      const [err, setErr] = useState("");
      const [busy, setBusy] = useState(false);

      async function submit(e) {
        e.preventDefault();
        if (!key.trim()) {
          setErr("Admin kalitini kiriting");
          return;
        }
        setBusy(true);
        setErr("");
        try {
          const base = (props.apiBase || window.location.origin).replace(/\/$/, "");
          const res = await fetch(base + "/api/dashboard", {
            headers: { "x-admin-key": key.trim() }
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            setErr(data.error || "Kalit noto'g'ri");
            setBusy(false);
            return;
          }
          props.onLogin(key.trim());
        } catch (ex) {
          setErr(ex.message || "Ulanish xatosi");
        }
        setBusy(false);
      }

      return (
        <div className="login-wrap">
          <form className="login-card" onSubmit={submit}>
            <h1>Black Diamond Admin</h1>
            <p>Operatsion panel — faqat xodimlar uchun</p>
            {err ? <div className="err">{err}</div> : null}
            <label>Admin kaliti (ADMIN_KEY)</label>
            <input
              type="password"
              value={key}
              onChange={function (e) { setKey(e.target.value); }}
              placeholder="Kalitni kiriting"
              autoComplete="current-password"
              autoFocus
            />
            <button className="btn" type="submit" disabled={busy}>
              {busy ? "Tekshirilmoqda..." : "Kirish"}
            </button>
          </form>
        </div>
      );
    }

    function Msg(props) {
      if (!props.text) return null;
      return (
        <div className={"msg " + (props.type || "ok")} onClick={props.onClose}>
          {props.text}
        </div>
      );
    }

    // ---------- Dashboard (ixcham) ----------
    function Dashboard(props) {
      const api = props.api;
      const [data, setData] = useState(null);
      const [err, setErr] = useState("");

      function load() {
        api("/api/dashboard")
          .then(function (r) { setData(r.data); setErr(""); })
          .catch(function (e) { setErr(e.message); });
      }

      useEffect(function () { load(); }, [api]);

      if (err) return <div className="msg err">{err}</div>;
      if (!data) return <div className="muted">Yuklanmoqda...</div>;

      const alerts = data.alerts || [];
      const skuStock = data.sku_stock || [];
      const mats = data.material_stock || [];
      const batches = data.active_batches || [];
      const orders = data.recent_orders || [];

      function shortCode(code) {
        if (!code) return "—";
        const s = String(code);
        if (s.length <= 14) return s;
        return s.slice(0, 6) + "…" + s.slice(-4);
      }

      return (
        <div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <h2 style={{ color: "var(--accent)", fontSize: "0.95rem", margin: 0 }}>Dashboard</h2>
            <button className="btn-ghost" type="button" onClick={load}>Yangilash</button>
          </div>

          {/* Asosiy 4 ko'rsatkich */}
          <div className="dash-kpis">
            <div className="dash-kpi">
              <div className="label">Bugun savdo</div>
              <div className="value">{money(data.bugungi_savdo)}</div>
            </div>
            <div className="dash-kpi">
              <div className="label">Bugun qadoq</div>
              <div className="value">{Number(data.bugungi_qadoq_kg || 0).toFixed(1)} kg</div>
            </div>
            <div className="dash-kpi">
              <div className="label">Bugun xarajat</div>
              <div className="value">{money(data.bugungi_xarajat)}</div>
            </div>
            <div className="dash-kpi">
              <div className="label">Qarz</div>
              <div className="value">{money(data.jami_qarz)}</div>
            </div>
          </div>

          {/* Oylik va ishlab chiqarish — bitta qator */}
          <div className="dash-meta">
            <span>Oy savdo: <strong>{money(data.oylik_savdo || 0)}</strong></span>
            <span>Oy qadoq: <strong>{Number(data.oylik_qadoq_kg || 0).toFixed(1)} kg</strong></span>
            <span>Oy xarajat: <strong>{money(data.oylik_xarajat || 0)}</strong></span>
            <span>Partiya: <strong>{data.faol_partiya}</strong></span>
            <span>Quruq: <strong>{Number(data.quruq_qoldiq_kg || 0).toFixed(1)} kg</strong></span>
            <span>SKU: <strong>{data.faol_sku}</strong></span>
          </div>

          {alerts.length > 0 ? (
            <div style={{ marginBottom: 10 }}>
              {alerts.map(function (a, i) {
                return (
                  <div key={i} className={"dash-alert " + (a.type === "danger" ? "danger" : "warn")}>
                    {a.text}
                  </div>
                );
              })}
            </div>
          ) : null}

          {/* Ombor + material yonma-yon */}
          <div className="dash-grid">
            <div className="card tight">
              <h2>Tayyor mahsulot</h2>
              {skuStock.length === 0 ? (
                <div className="empty" style={{ padding: 12 }}>Qoldiq yo‘q</div>
              ) : (
                <table>
                  <thead>
                    <tr>
                      <th>SKU</th>
                      <th>Qadoq</th>
                      <th>Sotilgan</th>
                      <th>Qoldiq</th>
                      <th>Qiymat</th>
                    </tr>
                  </thead>
                  <tbody>
                    {skuStock.map(function (s) {
                      const bal = Number(s.balance_qty);
                      return (
                        <tr key={s.id}>
                          <td>{s.sku}</td>
                          <td>{Number(s.packed_qty)}</td>
                          <td>{Number(s.sold_qty)}</td>
                          <td className={bal < 0 ? "neg" : ""}><strong>{bal}</strong></td>
                          <td>{money(s.value)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>

            <div className="card tight">
              <h2>Material</h2>
              {mats.length === 0 ? (
                <div className="empty" style={{ padding: 12 }}>Yo‘q</div>
              ) : (
                <table>
                  <thead>
                    <tr><th>Nomi</th><th>Birlik</th><th>Qoldiq</th></tr>
                  </thead>
                  <tbody>
                    {mats.map(function (m) {
                      const bal = Number(m.balance);
                      return (
                        <tr key={m.id}>
                          <td>{m.name}</td>
                          <td>{m.unit}</td>
                          <td className={bal < 0 ? "neg" : ""}><strong>{bal}</strong></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          </div>

          <div className="dash-grid">
            <div className="card tight">
              <h2>Faol partiyalar</h2>
              {batches.length === 0 ? (
                <div className="empty" style={{ padding: 12 }}>Faol partiya yo‘q</div>
              ) : (
                <table>
                  <thead>
                    <tr><th>Kod</th><th>Quruq</th><th>Qolgan</th><th>%</th></tr>
                  </thead>
                  <tbody>
                    {batches.map(function (b) {
                      return (
                        <tr key={b.id}>
                          <td>{b.batch_code}</td>
                          <td>{b.dry_kg}</td>
                          <td><strong>{b.remaining_kg}</strong></td>
                          <td>{b.loss_percent}%</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>

            <div className="card tight">
              <h2>So‘nggi buyurtmalar</h2>
              {orders.length === 0 ? (
                <div className="empty" style={{ padding: 12 }}>Buyurtma yo‘q</div>
              ) : (
                <table>
                  <thead>
                    <tr><th>Kod</th><th>Mijoz</th><th>Summa</th><th>Holat</th></tr>
                  </thead>
                  <tbody>
                    {orders.map(function (o) {
                      const st = orderStatusLabel(o.status);
                      return (
                        <tr key={o.id}>
                          <td title={o.order_code} className="order-row-code">{shortCode(o.order_code)}</td>
                          <td>{o.customer_name}</td>
                          <td>
                            {money(o.total_amount)}
                            {Number(o.debt_amount) > 0 ? (
                              <div className="muted" style={{ fontSize: "0.65rem" }}>qarz {money(o.debt_amount)}</div>
                            ) : null}
                          </td>
                          <td>
                            <span className={"badge " + st.cls}>{st.text}</span>
                            {Number(o.paid_amount) > 0 && String(o.status) === "pending" ? (
                              <div className="muted" style={{ fontSize: "0.65rem" }}>niyat {money(o.paid_amount)}</div>
                            ) : null}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Stock(props) {
      const api = props.api;
      const [materials, setMaterials] = useState([]);
      const [products, setProducts] = useState([]);
      const [err, setErr] = useState("");

      useEffect(function () {
        Promise.all([api("/api/stock/materials"), api("/api/stock/products")])
          .then(function (arr) {
            setMaterials(arr[0].data || []);
            setProducts(arr[1].data || []);
          })
          .catch(function (e) { setErr(e.message); });
      }, [api]);

      if (err) return <div className="msg err">{err}</div>;

      return (
        <div>
          <div className="card">
            <h2>Material qoldiq</h2>
            {materials.length === 0 ? (
              <div className="empty">Bosh</div>
            ) : (
              <table>
                <thead>
                  <tr><th>Nomi</th><th>Birlik</th><th>Kirim</th><th>Chiqim</th><th>Qoldiq</th></tr>
                </thead>
                <tbody>
                  {materials.map(function (m) {
                    return (
                      <tr key={m.id}>
                        <td>{m.name}</td>
                        <td>{m.unit}</td>
                        <td>{Number(m.total_in)}</td>
                        <td>{Number(m.total_out)}</td>
                        <td><strong>{Number(m.balance)}</strong></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
          <div className="card">
            <h2>Mahsulot qoldiq</h2>
            {products.length === 0 ? (
              <div className="empty">Bosh</div>
            ) : (
              <table>

        e.preventDefault();

        } catch (err) {

        }

      function startEdit(p) {
        setEditId(p.id);
        setEditForm({
          sku: p.sku || "",
          weight_kg: String(p.weight_kg != null ? p.weight_kg : ""),
          price: String(p.price != null ? p.price : ""),
          description: p.description || "",
          is_active: p.is_active !== false
        });
      }

      function cancelEdit() {
        setEditId(null);
      }

      async function saveEdit(e) {
        e.preventDefault();
        try {
          await api("/api/products/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              sku: editForm.sku,
              weight_kg: Number(editForm.weight_kg) || 0,
              price: Number(editForm.price) || 0,
              description: editForm.description || null,
              is_active: !!editForm.is_active

          setEditId(null);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }

        if (!window.confirm("SKU ni nofaol qilish?")) return;
        try {
          await api("/api/products/" + id, { method: "DELETE" });
          setMsg({ text: "SKU nofaol qilindi", type: "ok" });

                </div>
              </div>
              <button className="btn" type="submit">Qoshish</button>
            </form>
          </div>

          {editId ? (

              <h2>SKU tahrirlash</h2>

                  </div>
                  <div>
                    <label>Ogirlik (kg)</label>
                    <input type="number" step="0.1" value={editForm.weight_kg} onChange={function (e) { setEditForm(Object.assign({}, editForm, { weight_kg: e.target.value })); }} />
                  </div>
                  <div>

                <div style={{ display: "flex", gap: 8 }}>

    function orderStatusLabel(s) {
      var low = String(s || "").toLowerCase();
      if (low === "pending" || low === "partial") return { text: "Ko'rib chiqilmoqda", cls: "pending" };
      if (low === "confirmed") return { text: "Tasdiqlandi", cls: "confirmed" };
      if (low === "rejected") return { text: "Rad etildi", cls: "rejected" };
      if (low === "cancelled") return { text: "Bekor", cls: "cancelled" };
      if (low === "paid" || low === "closed") return { text: "Tasdiqlandi", cls: "paid" };
      return { text: s, cls: s };
    }

      const api = props.api;
      const [list, setList] = useState([]);
      const [products, setProducts] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [form, setForm] = useState({
        customer_id: "", customer_name: "", phone: "", paid_amount: "", note: ""
      });
      const [lines, setLines] = useState([{ product_id: "", qty: "", unit_price: "" }]);
      const [msg, setMsg] = useState({});

      const load = useCallback(function () {
        Promise.all([
          api("/api/orders?limit=50"),
          api("/api/products"),
          api("/api/customers")
        ])
          .then(function (arr) {
            setList(arr[0].data || []);
            setProducts(arr[1].data || []);
            setCustomers(arr[2].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      function onCustomer(id) {
        const c = customers.find(function (x) { return String(x.id) === String(id); });
        setForm(function (f) {
          return Object.assign({}, f, {
            customer_id: id,
            customer_name: c ? c.name : f.customer_name,
            phone: c && c.phone ? c.phone : f.phone
          });
        });
      }

      function setLine(i, field, val) {
        setLines(function (prev) {
          const next = prev.slice();
          next[i] = Object.assign({}, next[i], { [field]: val });
          if (field === "product_id") {
            const p = products.find(function (x) { return String(x.id) === String(val); });
            if (p) next[i].unit_price = String(p.price);
          }
          return next;
        });
      }

      const total = lines.reduce(function (s, l) {
        return s + (Number(l.qty) || 0) * (Number(l.unit_price) || 0);
      }, 0);

      async function submit(e) {
        e.preventDefault();
        const items = lines
          .filter(function (l) { return l.product_id && Number(l.qty) > 0; })
          .map(function (l) {
            return {
              product_id: Number(l.product_id),
              qty: Number(l.qty),
              unit_price: Number(l.unit_price) || 0
            };
          });
        if (!items.length) {
          setMsg({ text: "Kamida 1 ta mahsulot kiriting", type: "err" });
          return;
        }
        try {
          await api("/api/orders", {
            method: "POST",
            body: JSON.stringify({
              customer_id: form.customer_id ? Number(form.customer_id) : null,
              customer_name: form.customer_name,
              phone: form.phone || null,
              paid_amount: Number(form.paid_amount) || 0,
              note: form.note || null,
              items: items
            })
          });
          setMsg({ text: "Buyurtma yaratildi", type: "ok" });
          setForm({ customer_id: "", customer_name: "", phone: "", paid_amount: "", note: "" });
          setLines([{ product_id: "", qty: "", unit_price: "" }]);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      async function setStatus(id, status) {
        try {
          await api("/api/orders/" + id + "/status", {
            method: "PATCH",
            body: JSON.stringify({ status: status })
          });
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      return (
        <div>
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">
            <h2>Yangi buyurtma</h2>
            <form onSubmit={submit}>
              <div className="form-row">
                <div>
                  <label>Mijoz (royxat)</label>
                  <select value={form.customer_id} onChange={function (e) { onCustomer(e.target.value); }}>
                    <option value="">-</option>
                    {customers.map(function (c) {
                      return <option key={c.id} value={c.id}>{c.name}</option>;
                    })}
                  </select>
                </div>
                <div>
                  <label>Ism *</label>
                  <input value={form.customer_name} onChange={function (e) { setForm(Object.assign({}, form, { customer_name: e.target.value })); }} required />
                </div>
                <div>
                  <label>Telefon</label>
                  <input value={form.phone} onChange={function (e) { setForm(Object.assign({}, form, { phone: e.target.value })); }} />
                </div>
                <div>
                  <label>Tolangan</label>
                  <input type="number" value={form.paid_amount} onChange={function (e) { setForm(Object.assign({}, form, { paid_amount: e.target.value })); }} />
                </div>
              </div>
              <div className="line-items">
                <label style={{ marginBottom: 8 }}>Mahsulotlar</label>
                {lines.map(function (l, i) {
                  return (
                    <div className="line-row" key={i}>
                      <div>
                        <label>SKU</label>
                        <select value={l.product_id} onChange={function (e) { setLine(i, "product_id", e.target.value); }}>
                          <option value="">Tanlang</option>
                          {products.map(function (p) {
                            return <option key={p.id} value={p.id}>{p.sku}</option>;
                          })}
                        </select>
                      </div>
                      <div>
                        <label>Dona</label>
                        <input type="number" value={l.qty} onChange={function (e) { setLine(i, "qty", e.target.value); }} />
                      </div>
                      <div>
                        <label>Narx</label>
                        <input type="number" value={l.unit_price} onChange={function (e) { setLine(i, "unit_price", e.target.value); }} />
                      </div>
                      <button
                        type="button"
                        className="btn-ghost btn-sm"
                        disabled={lines.length === 1}
                        onClick={function () {
                          setLines(function (prev) { return prev.filter(function (_, j) { return j !== i; }); });
                        }}
                      >
                        x
                      </button>
                    </div>
                  );
                })}
                <button
                  type="button"
                  className="btn-ghost"
                  onClick={function () {
                    setLines(function (p) { return p.concat([{ product_id: "", qty: "", unit_price: "" }]); });
                  }}
                >
                  + qator
                </button>
              </div>
              <div className="total-box">
                <span>Jami</span>
                <span>{money(total)} som</span>
              </div>
              <div>
                <label>Izoh</label>
                <input value={form.note} onChange={function (e) { setForm(Object.assign({}, form, { note: e.target.value })); }} />
              </div>
              <button className="btn" type="submit">Buyurtma yaratish</button>
            </form>
          </div>
          <div className="card">
            <h2>Buyurtmalar</h2>
            <p className="muted" style={{ marginBottom: 10, fontSize: "0.78rem" }}>
              Telegram/PWA buyurtmalari <b>pending</b> — Tasdiq yoki Rad.
            </p>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Buyurtma</th>
                    <th>Mijoz</th>
                    <th>Summa</th>
                    <th>Holat</th>
                    <th>Amallar</th>
                  </tr>
                </thead>
                <tbody>
                  {list.map(function (o) {
                    var src = o.source || "admin";
                    var srcLabel = src === "telegram" ? "TG" : (src === "pwa" ? "PWA" : "Admin");
                    var st = orderStatusLabel(o.status);
                    var itemsLine = o.items && o.items.length
                      ? o.items.map(function (i) { return i.sku + "×" + i.qty; }).join(", ")
                      : "";
                    return (
                      <tr
                        key={o.id}
                        style={
                          o.status === "pending" && (src === "telegram" || src === "pwa")
                            ? { background: "rgba(201,162,39,0.08)" }
                            : undefined
                        }
                      >
                        <td>
                          <span className="badge" style={{ marginRight: 4 }}>{srcLabel}</span>
                          <span className="order-row-code" title={o.order_code}>
                            {o.order_code && o.order_code.length > 16
                              ? o.order_code.slice(0, 8) + "…" + o.order_code.slice(-4)
                              : o.order_code}
                          </span>
                          {itemsLine ? (
                            <div className="muted" style={{ fontSize: "0.7rem", marginTop: 2 }}>{itemsLine}</div>
                          ) : null}
                        </td>
                        <td>
                          <div>{o.customer_name || "—"}</div>
                          {o.phone ? (
                            <div className="muted" style={{ fontWeight: 600, color: "#e8d5a3", fontSize: "0.72rem" }}>
                              {o.phone}
                            </div>
                          ) : null}
                          {o.note ? (
                            <div className="muted" style={{ fontSize: "0.7rem" }}>{o.note}</div>
                          ) : null}
                        </td>
                        <td>
                          {money(o.total_amount)}
                          {Number(o.debt_amount) > 0 ? (
                            <div className="muted" style={{ fontSize: "0.68rem" }}>qarz {money(o.debt_amount)}</div>
                          ) : null}
                        </td>
                        <td>
                          <span className={"badge " + st.cls}>{st.text}</span>
                          {Number(o.paid_amount) > 0 && String(o.status) === "pending" ? (
                            <div className="muted" style={{ fontSize: "0.68rem" }}>niyat {money(o.paid_amount)}</div>
                          ) : null}
                        </td>
                        <td style={{ whiteSpace: "nowrap" }}>
                          {o.status === "pending" ? (
                            <span>
                              <button
                                className="btn-ghost btn-sm"
                                type="button"
                                onClick={function () { setStatus(o.id, "confirmed"); }}
                              >
                                Tasdiq
                              </button>
                              {" "}
                              <button
                                className="btn-ghost btn-sm"
                                type="button"
                                onClick={function () {
                                  if (window.confirm("Buyurtmani rad etasizmi?")) setStatus(o.id, "rejected");
                                }}
                              >
                                Rad
                              </button>
                            </span>
                          ) : null}
                          {o.status === "confirmed" ? (
                            <button
                              className="btn-ghost btn-sm"
                              type="button"
                              onClick={function () { setStatus(o.id, "closed"); }}
                            >
                              Yopish
                            </button>
                          ) : null}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Payments ----------
    function Payments(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [orders, setOrders] = useState([]);
      const [form, setForm] = useState({
        customer_id: "", order_id: "", amount: "", method: "cash", note: ""
      });
      const [msg, setMsg] = useState({});

      const load = useCallback(function () {
        Promise.all([
          api("/api/payments?limit=30"),
          api("/api/customers"),
          api("/api/orders?limit=50")
        ])
          .then(function (arr) {
            setList(arr[0].data || []);
            setCustomers(arr[1].data || []);
            setOrders((arr[2].data || []).filter(function (x) { return Number(x.debt_amount) > 0; }));
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function submit(e) {
        e.preventDefault();
        try {
          const r = await api("/api/payments", {
            method: "POST",
            body: JSON.stringify({
              customer_id: form.customer_id ? Number(form.customer_id) : null,
              order_id: form.order_id ? Number(form.order_id) : null,
              amount: Number(form.amount),
              method: form.method || "cash",
              note: form.note || null
            })
          });
          setMsg({
            text: "Tolov qabul qilindi. Qollandi: " + money(r.applied) + (r.leftover > 0 ? ", qoldi: " + money(r.leftover) : ""),
            type: "ok"
          });
          setForm({ customer_id: "", order_id: "", amount: "", method: "cash", note: "" });
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      return (
        <div>
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">
            <h2>Qarz tolovi</h2>
            <form onSubmit={submit}>
              <div className="form-row">
                <div>
                  <label>Mijoz</label>
                  <select
                    value={form.customer_id}
                    onChange={function (e) {
                      setForm(Object.assign({}, form, { customer_id: e.target.value, order_id: "" }));
                    }}
                  >
                    <option value="">-</option>
                    {customers.map(function (c) {
                      return <option key={c.id} value={c.id}>{c.name}</option>;
                    })}
                  </select>
                </div>
                <div>
                  <label>Buyurtma (ixtiyoriy)</label>
                  <select value={form.order_id} onChange={function (e) { setForm(Object.assign({}, form, { order_id: e.target.value })); }}>
                    <option value="">Barcha qarzlarga (FIFO)</option>
                    {orders
                      .filter(function (o) {
                        return !form.customer_id || String(o.customer_id) === String(form.customer_id);
                      })
                      .map(function (o) {
                        return (
                          <option key={o.id} value={o.id}>
                            {o.order_code} - qarz {money(o.debt_amount)}
                          </option>
                        );
                      })}
                  </select>
                </div>
                <div>
                  <label>Summa *</label>
                  <input type="number" value={form.amount} onChange={function (e) { setForm(Object.assign({}, form, { amount: e.target.value })); }} required />
                </div>
                <div>
                  <label>Usul</label>
                  <select value={form.method} onChange={function (e) { setForm(Object.assign({}, form, { method: e.target.value })); }}>
                    <option value="cash">Naqd</option>
                    <option value="card">Karta</option>
                    <option value="transfer">Otkazma</option>
                  </select>
                </div>
                <div>
                  <label>Izoh</label>
                  <input value={form.note} onChange={function (e) { setForm(Object.assign({}, form, { note: e.target.value })); }} />
                </div>
              </div>
              <button className="btn" type="submit">Tolov qabul qilish</button>
            </form>
          </div>
          <div className="card">
            <h2>Songgi tolovlar</h2>
            <table>
              <thead>
                <tr><th>Sana</th><th>Mijoz</th><th>Buyurtma</th><th>Summa</th><th>Usul</th></tr>
              </thead>
              <tbody>
                {list.map(function (p) {
                  return (
                    <tr key={p.id}>
                      <td>{p.paid_at ? new Date(p.paid_at).toLocaleString("uz-UZ") : "-"}</td>
                      <td>{p.customer_name || "-"}</td>
                      <td>{p.order_code || "-"}</td>
                      <td><strong>{money(p.amount)}</strong></td>
                      <td>{p.method}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ---------- Expenses ----------
    function Expenses(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [form, setForm] = useState({ category: "", amount: "", payment_method: "cash", note: "" });
      const [msg, setMsg] = useState({});
      const cats = ["Elektr", "Transport", "Ijara", "Ish haqi", "Tamirlash", "Boshqa"];

      const load = useCallback(function () {
        api("/api/expenses?limit=40")
          .then(function (r) { setList(r.data || []); })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function submit(e) {
        e.preventDefault();
        try {
          await api("/api/expenses", {
            method: "POST",
            body: JSON.stringify({
              category: form.category,
              amount: Number(form.amount),
              payment_method: form.payment_method || "cash",
              note: form.note || null
            })
          });
          setMsg({ text: "Xarajat yozildi", type: "ok" });

          load();

          setMsg({ text: err.message, type: "err" });

      return (
        <div>
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card">
            <h2>Yangi xarajat</h2>
            <form onSubmit={submit}>
              <div className="form-row">
                <div>
                  <label>Kategoriya *</label>
                  <input list="exp-cats" value={form.category} onChange={function (e) { setForm(Object.assign({}, form, { category: e.target.value })); }} required />
                  <datalist id="exp-cats">
                    {cats.map(function (c) { return <option key={c} value={c} />; })}
                  </datalist>
                </div>
                <div>
                  <label>Summa *</label>
                  <input type="number" value={form.amount} onChange={function (e) { setForm(Object.assign({}, form, { amount: e.target.value })); }} required />
                </div>
                <div>
                  <label>Usul</label>
                  <select value={form.payment_method} onChange={function (e) { setForm(Object.assign({}, form, { payment_method: e.target.value })); }}>
                    <option value="cash">Naqd</option>
                    <option value="card">Karta</option>
                    <option value="transfer">Otkazma</option>
                  </select>
                </div>
                <div>
                  <label>Izoh</label>
                  <input value={form.note} onChange={function (e) { setForm(Object.assign({}, form, { note: e.target.value })); }} />
                </div>
              </div>
              <button className="btn" type="submit">Saqlash</button>
            </form>
          </div>
          <div className="card">
            <h2>Xarajatlar</h2>
            <table>
              <thead>
                <tr><th>Sana</th><th>Kategoriya</th><th>Summa</th><th>Usul</th><th>Izoh</th></tr>
              </thead>
              <tbody>
                {list.map(function (x) {
                  return (
                    <tr key={x.id}>
                      <td>{x.expense_date ? new Date(x.expense_date).toLocaleDateString("uz-UZ") : "-"}</td>
                      <td>{x.category}</td>
                      <td><strong>{money(x.amount)}</strong></td>
                      <td>{x.payment_method}</td>
                      <td>{x.note || "-"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );

    // ---------- App ----------
    function App() {
      const apiHook = useApi();
      const api = apiHook.api;
      const apiBase = apiHook.apiBase;
      const adminKey = apiHook.adminKey;
      const saveSettings = apiHook.saveSettings;
      const logout = apiHook.logout;

      if (!adminKey) {
        return (
          <LoginScreen
            apiBase={apiBase}
            onLogin={function (k) { saveSettings(apiBase || window.location.origin, k); }}
          />
        );
      }

      const modules = [
        {
          id: "boshqaruv",
          label: "Boshqaruv",
          short: "Bosh",
          ico: "BD",
          tabs: [{ id: "dashboard", label: "Dashboard" }]
        },
        {
          id: "ishlab",
          label: "Ishlab chiqarish",
          short: "Ishlab",
          ico: "IC",
          tabs: [
            { id: "batches", label: "Partiya" },
            { id: "packaging", label: "Qadoq" },
            { id: "stock", label: "Ombor" }
          ]
        },
        {
          id: "savdo",
          label: "Savdo",
          short: "Savdo",
          ico: "SV",
          tabs: [
            { id: "orders", label: "Buyurtma" },
            { id: "payments", label: "Tolov" },
            { id: "expenses", label: "Xarajat" }
          ]
        },
        {
          id: "hamkor",
          label: "Hamkorlar",
          short: "Hamkor",
          ico: "HM",
          tabs: [{ id: "customers", label: "Mijoz" }]
        },
        {
          id: "katalog",
          label: "Katalog",
          short: "Katalog",
          ico: "KT",
          tabs: [
            { id: "products", label: "SKU" },
            { id: "materials", label: "Material" },
            { id: "settings", label: "Sozlama" }
          ]
        }
      ];

      const [moduleId, setModuleId] = useState("boshqaruv");
      const [tab, setTab] = useState("dashboard");
      const [tmpApi, setTmpApi] = useState(apiBase);
      const [tmpKey, setTmpKey] = useState(adminKey);

      const currentModule = modules.find(function (m) { return m.id === moduleId; }) || modules[0];

      function openModule(id) {
        const m = modules.find(function (x) { return x.id === id; });
        if (!m) return;
        setModuleId(id);
        setTab(m.tabs[0].id);
      }

      function openSub(id) {
        setTab(id);
      }

      let content = null;
      if (tab === "dashboard") content = <Dashboard api={api} />;
      else if (tab === "stock") content = <Stock api={api} />;
      else if (tab === "batches") content = <Batches api={api} />;
      else if (tab === "packaging") content = <Packaging api={api} />;
      else if (tab === "orders") content = <Orders api={api} />;
      else if (tab === "payments") content = <Payments api={api} />;
      else if (tab === "expenses") content = <Expenses api={api} />;
      else if (tab === "products") content = <Products api={api} />;
      else if (tab === "materials") content = <Materials api={api} />;
      else if (tab === "customers") content = <Customers api={api} />;
      else if (tab === "settings") {
        content = (
          <div className="card">
            <h2>Tizim sozlama</h2>
            <div className="settings-bar">
              <div>
                <label>API URL</label>
                <input value={tmpApi} onChange={function (e) { setTmpApi(e.target.value); }} />
              </div>
              <div>
                <label>Admin key</label>
                <input value={tmpKey} onChange={function (e) { setTmpKey(e.target.value); }} placeholder="ADMIN_KEY" />
              </div>
              <button
                className="btn"
                type="button"
                onClick={function () {
                  saveSettings(tmpApi, tmpKey);
                  alert("Saqlandi. Sahifani yangilang.");
                }}
              >
                Saqlash
              </button>
            </div>
            <p className="muted" style={{ marginTop: 10 }}>
              API: {apiBase || "(bo'sh)"}
            </p>
          </div>
        );
      }

      return (
        <div className="shell">
          <aside className="sidebar">
            <div>
              <div className="brand-kicker">Black Diamond</div>
              <div className="brand-title">Briket ERP</div>
            </div>
            <nav className="side-nav">
              {modules.map(function (m) {
                return (
                  <button
                    key={m.id}
                    type="button"
                    className={moduleId === m.id ? "active" : ""}
                    onClick={function () { openModule(m.id); }}
                  >
                    {m.label}
                  </button>
                );
              })}
            </nav>
            <p className="muted" style={{ fontSize: "0.7rem", marginTop: 12 }}>Operator paneli</p>
            <button type="button" className="logout-btn" onClick={logout}>Chiqish</button>
          </aside>

          <div className="main">
            <div className="mobile-top">
              <h1>Briket ERP</h1>
              <span className="muted" style={{ fontSize: "0.75rem" }}>{currentModule.label}</span>
            </div>

            {currentModule.tabs.length > 1 ? (
              <div className="segment">
                {currentModule.tabs.map(function (t) {
                  return (
                    <button
                      key={t.id}
                      type="button"
                      className={tab === t.id ? "active" : ""}
                      onClick={function () { openSub(t.id); }}
                    >
                      {t.label}
                    </button>
                  );
                })}
              </div>
            ) : null}

            {content}
          </div>

          <nav className="bottom-nav">
            {modules.map(function (m) {
              return (
                <button
                  key={m.id}
                  type="button"
                  className={moduleId === m.id ? "active" : ""}
                  onClick={function () { openModule(m.id); }}
                >
                  <span className="ico">{m.ico}</span>
                  {m.short}
                </button>
              );
            })}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
