    function Batches(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [form, setForm] = useState({
        bags_count: "", bag_price: "", dry_kg: "", workers_count: "", press_wage: "", note: "", material_id: ""
      });
      const [materials, setMaterials] = useState([]);
      const [msg, setMsg] = useAutoMsg();
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [ferr, setFerr] = useState({});
      const [busy, setBusy] = useState(false);

      function copyBatch(b) {
        setForm({
          bags_count: String(b.bags_count != null ? b.bags_count : ""),
          bag_price: String(b.bag_price != null ? b.bag_price : ""),
          dry_kg: String(b.dry_kg != null ? b.dry_kg : ""),
          workers_count: String(b.workers_count != null ? b.workers_count : ""),
          press_wage: String(b.press_wage != null ? b.press_wage : ""),
          note: b.note ? ("Nusxa: " + b.note) : "Nusxa"
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function deleteBatch(id) {
        setConfirmState({
          open: true,
          text: "Partiyani o'chirish? (faqat qadoqlanmagan)",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/batches/" + id, { method: "DELETE" });
              setMsg({ text: "Partiya o'chirildi", type: "ok" });
              load();
            } catch (err) {
              setMsg({ text: err.message, type: "err" });
            }
          }
        });
      }

        Promise.all([api("/api/batches"), api("/api/materials")])
          .then(function (arr) {
            setList(arr[0].data || []);
            setMaterials(arr[1].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);
      useFocusForm(props.pageFilter, "batch");

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!(Number(form.bags_count) > 0)) next.bags_count = "Qop soni musbat bo'lsin";
        if (!(Number(form.bag_price) > 0)) next.bag_price = "Qop narxi musbat bo'lsin";
        if (!(Number(form.dry_kg) > 0)) next.dry_kg = "Quruq kg musbat bo'lsin";
        setFerr(next);
        if (Object.keys(next).length) return;
        if (busy) return;
        setBusy(true);
        try {
          const r = await api("/api/batches", {
            method: "POST",
            body: JSON.stringify({
              bags_count: Number(form.bags_count),
              bag_price: Number(form.bag_price),
              dry_kg: Number(form.dry_kg),
              workers_count: Number(form.workers_count) || 0,
              press_wage: Number(form.press_wage) || 0,
              note: form.note || null,
              material_id: form.material_id ? Number(form.material_id) : null
            })
          });
          setMsg({ text: (r && r.warning) ? ("Partiya yaratildi. " + r.warning) : "Partiya yaratildi", type: (r && r.warning) ? "err" : "ok" });
          setForm({ bags_count: "", bag_price: "", dry_kg: "", workers_count: "", press_wage: "", note: "", material_id: form.material_id || "" });
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
        setBusy(false);
      }

      return (
        <div>
          <ConfirmModal
            open={confirmState.open}
            text={confirmState.text}
            onCancel={function () { setConfirmState({ open: false, text: "", onConfirm: null }); }}
            onConfirm={function () { if (confirmState.onConfirm) confirmState.onConfirm(); }}
          />
          <PageHead title="Partiyalar" sub="Avval partiya, keyin shu bo'limdagi Qadoqlash qadami." />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card" id="form-batch">
            <h2>Yangi partiya</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e); }}>
              <div className="form-row-3">
                <div>
                  <label htmlFor="f-19">Qop soni *</label>
                  <input id="f-19" type="number" value={form.bags_count} onChange={function (e) { setForm({ ...form, bags_count: e.target.value }); }} />
                  <FieldErr text={ferr.bags_count} />
                </div>
                <div>
                  <label htmlFor="f-20">1 qop narxi *</label>
                  <input id="f-20" type="number" value={form.bag_price} onChange={function (e) { setForm({ ...form, bag_price: e.target.value }); }} />
                  <FieldErr text={ferr.bag_price} />
                </div>
                <div>
                  <label htmlFor="f-21">Quruq kg *</label>
                  <input id="f-21" type="number" step="0.1" value={form.dry_kg} onChange={function (e) { setForm({ ...form, dry_kg: e.target.value }); }} />
                  <FieldErr text={ferr.dry_kg} />
                </div>
                <div>
                  <label htmlFor="f-22">Ishchilar</label>
                  <input id="f-22" type="number" value={form.workers_count} onChange={function (e) { setForm({ ...form, workers_count: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-23">Press ish haqi</label>
                  <input id="f-23" type="number" value={form.press_wage} onChange={function (e) { setForm({ ...form, press_wage: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-24m">Material</label>
                  <select id="f-24m" value={form.material_id} onChange={function (e) { setForm({ ...form, material_id: e.target.value }); }}>
                    <option value="">Avto (ko'mir)</option>
                    {materials.map(function (m) {
                      return <option key={m.id} value={m.id}>{m.name}</option>;
                    })}
                  </select>
                </div>
                <div>
                  <label htmlFor="f-24">Izoh</label>
                  <input id="f-24" value={form.note} onChange={function (e) { setForm({ ...form, note: e.target.value }); }} />
                </div>
              </div>
              <button className="btn" type="submit" disabled={busy}>{busy ? "Saqlanmoqda..." : "Partiya yaratish"}</button>
            </form>
          </div>
          <div className="card">
            <h2>Partiyalar ({list.length})</h2>
            <div className="table-wrap list-dense"><table>
              <thead>
                <tr>
                  <th>Kod</th><th>Holat</th><th>Qop</th><th>Quruq</th><th>Qadoqlangan</th><th>Qolgan</th><th>Yoqotish %</th>

    // ---------- Packaging ----------
    function Packaging(props) {
      const api = props.api;
      const PAGE = 40;
      const [list, setList] = useState([]);
      const [products, setProducts] = useState([]);
      const [batches, setBatches] = useState([]);
      const [form, setForm] = useState({
        product_id: "", qty: "", unit_wage: "700", workers_count: "1", batch_id: ""
      });
      const [msg, setMsg] = useAutoMsg();
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [ferr, setFerr] = useState({});
      const [loading, setLoading] = useState(true);
      const [loadingMore, setLoadingMore] = useState(false);
      const [offset, setOffset] = useState(0);
      const [hasMore, setHasMore] = useState(true);
      const [busyPack, setBusyPack] = useState(false);

      function deleteBatch(id) {
        setConfirmState({
          open: true,
          text: "Partiyani o'chirish? (faqat qadoqlanmagan)",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/batches/" + id, { method: "DELETE" });
              setMsg({ text: "Partiya o'chirildi", type: "ok" });
              load();
            } catch (err) {
              setMsg({ text: err.message, type: "err" });
            }
          }
        });
      }

      const load = useCallback(function () {
        setLoading(true);
        setOffset(0);
        Promise.all([
          api("/api/packaging?limit=" + PAGE + "&offset=0"),
          api("/api/products"),
          api("/api/batches?status=active")
        ])
          .then(function (arr) {
            const rows = arr[0].data || [];
            setList(rows);
            setHasMore(rows.length >= PAGE);
            setProducts(arr[1].data || []);
            setBatches(arr[2].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); })
          .finally(function () { setLoading(false); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      async function loadMore() {
        if (loadingMore || !hasMore) return;
        setLoadingMore(true);
        const next = offset + PAGE;
        try {
          const r = await api("/api/packaging?limit=" + PAGE + "&offset=" + next);
          const rows = r.data || [];
          setList(function (prev) { return prev.concat(rows); });
          setOffset(next);
          setHasMore(rows.length >= PAGE);
        } catch (e) {
          setMsg({ text: e.message, type: "err" });
        }
        setLoadingMore(false);
      }

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!form.product_id) next.product_id = "Mahsulot majburiy";
        if (!(Number(form.qty) > 0)) next.qty = "Dona musbat bo'lsin";
        setFerr(next);
        if (next.product_id || next.qty) return;
        if (busyPack) return;
        setBusyPack(true);
        try {
          await api("/api/packaging", {
            method: "POST",
            body: JSON.stringify({
              product_id: Number(form.product_id),
              qty: Number(form.qty),
              unit_wage: Number(form.unit_wage) || 700,
              workers_count: Number(form.workers_count) || 1,
              batch_id: form.batch_id ? Number(form.batch_id) : null
            })
          });
          setMsg({ text: "Qadoqlandi", type: "ok" });
          setForm({ ...form, qty: "" });
          setFerr({});
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });

                    <option value="">Tanlang</option>
                    {products.map(function (p) {
                      return <option key={p.id} value={p.id}>{p.sku} ({p.weight_kg} kg)</option>;
                    })}
                  </select>
                  <FieldErr text={ferr.product_id} />
                </div>
                <div>
                  <label htmlFor="f-26">Dona *</label>
                  <input id="f-26" type="number" value={form.qty} onChange={function (e) { setForm({ ...form, qty: e.target.value }); }} />
                  <FieldErr text={ferr.qty} />
                </div>
                <div>
                  <label htmlFor="f-27">1 dona ish haqi</label>
                  <input id="f-27" type="number" value={form.unit_wage} onChange={function (e) { setForm({ ...form, unit_wage: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-28">Ishchilar</label>
                  <input id="f-28" type="number" value={form.workers_count} onChange={function (e) { setForm({ ...form, workers_count: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-29">Partiya (bosh = FIFO)</label>
                  <select id="f-29" value={form.batch_id} onChange={function (e) { setForm({ ...form, batch_id: e.target.value }); }}>
                    <option value="">Avto (FIFO)</option>
                    {batches.map(function (b) {
                      return <option key={b.id} value={b.id}>{b.batch_code} - {b.remaining_kg} kg</option>;
                    })}
                  </select>
                </div>
              </div>
              <button className="btn" type="submit" disabled={busyPack}>{busyPack ? "Saqlanmoqda..." : "Qadoqlash"}</button>
            </form>
          </div>
          <div className="card">
            <h2>So'nggi qadoqlash</h2>
            {loading ? (
              <div className="muted">Yuklanmoqda...</div>
            ) : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>Mahsulot</th><th>Dona</th><th>kg</th><th>Partiya</th><th>Ish haqi</th></tr>

                  {list.map(function (p) {
                    return (
                      <tr key={p.id}>
                        <td data-label="Mahsulot">{p.sku}</td>
                        <td data-label="Dona">{p.qty}</td>
                        <td data-label="kg">{p.kg}</td>
                        <td data-label="Partiya">{p.batch_code || "-"}</td>
                        <td data-label="Ish haqi">{money(p.total_wage)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table></div>
            )}
            {!loading && hasMore ? (
              <div style={{ marginTop: 12, textAlign: "center" }}>
                <button type="button" className="btn-ghost" disabled={loadingMore} onClick={loadMore}>

                </button>

    // ---------- Customers ----------
    function Customers(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [form, setForm] = useState({ name: "", phone: "", address: "", credit_limit: "" });
      const [editId, setEditId] = useState(null);
      const [editForm, setEditForm] = useState({ name: "", phone: "", address: "", credit_limit: "", is_active: true });
      const [msg, setMsg] = useAutoMsg();
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [q, setQ] = useState("");
      const [ferr, setFerr] = useState({});

      const includeInactive = !!props.includeInactive;
      const load = useCallback(function () {
        api("/api/customers" + (includeInactive ? "?active=0" : ""))
          .then(function (r) { setList(r.data || []); })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api, includeInactive]);

      useEffect(function () { load(); }, [load]);

      const editBoot = useRef(null);
      useEffect(function () {
        if (!props.initialEditId || !list.length) return;
        if (editBoot.current === String(props.initialEditId)) return;
        var c = list.find(function (x) { return String(x.id) === String(props.initialEditId); });
        if (!c) return;
        editBoot.current = String(props.initialEditId);
        startEdit(c);
      }, [list, props.initialEditId]);

      function phoneSoftOk(ph) {
        if (!ph) return true;
        return /^\+?\d{9,13}$/.test(String(ph).replace(/[\s\-()]/g, ""));
      }

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!String(form.name || "").trim()) next.name = "Ism majburiy";
        if (form.phone && !phoneSoftOk(form.phone)) next.phone = "Telefon formati shubhali (+998...)";
        setFerr(next);
        if (next.name || next.phone) return;
        try {
          await api("/api/customers", {
            method: "POST",
            body: JSON.stringify({
              name: form.name,
              phone: form.phone || null,
              address: form.address || null,
              credit_limit: Number(form.credit_limit) || 0
            })
          });
          if (typeof props.onSaved === "function") props.onSaved("Mijoz qo'shildi");
          else setMsg({ text: "Mijoz qo'shildi", type: "ok" });
          setForm({ name: "", phone: "", address: "", credit_limit: "" });
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function startEdit(c) {
        setEditId(c.id);
        setEditForm({
          name: c.name || "",
          phone: c.phone || "",
          address: c.address || "",
          credit_limit: String(c.credit_limit != null ? c.credit_limit : ""),
          is_active: c.is_active !== false
        });
      }

      async function saveEdit(e) {
        e.preventDefault();
        if (editForm.phone && !phoneSoftOk(editForm.phone)) {
          setMsg({ text: "Telefon formati shubhali", type: "err" });
          return;
        }
        try {
          await api("/api/customers/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              name: editForm.name,
              phone: editForm.phone || null,
              address: editForm.address || null,
              credit_limit: Number(editForm.credit_limit) || 0,
              is_active: !!editForm.is_active
            })
          });
          if (typeof props.onSaved === "function") props.onSaved("Mijoz yangilandi");
          else setMsg({ text: "Mijoz yangilandi", type: "ok" });
          setEditId(null);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function softDelete(id) {
        setConfirmState({
          open: true,
          text: "Mijozni nofaol qilish?",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              await api("/api/customers/" + id, { method: "DELETE" });
              setMsg({ text: "Mijoz nofaol qilindi", type: "ok" });
              load();
            } catch (err) {
              setMsg({ text: err.message, type: "err" });
            }
          }
        });
      }

      return (
        <div>
          <ConfirmModal
            open={confirmState.open}
            text={confirmState.text}
            onCancel={function () { setConfirmState({ open: false, text: "", onConfirm: null }); }}
            onConfirm={function () { if (confirmState.onConfirm) confirmState.onConfirm(); }}
          />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          {props.hideCreate ? null : (
          <div className="card" id="form-customer">
            <h2>Yangi chakana mijoz</h2>
            <div className="hint-box">Chakana mijoz buyurtmada tanlanadi. Diler va hamkor shu bo'limdagi filtrda, alohida jadvalda qoladi.</div>
            <form onSubmit={submit}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-30">Ism</label>
                  <input id="f-30" value={form.name} onChange={function (e) { setForm({ ...form, name: e.target.value }); }} />
                  <FieldErr text={ferr.name} />
                </div>
                <div>
                  <label htmlFor="f-31">Telefon</label>
                  <input id="f-31" value={form.phone} onChange={function (e) { setForm({ ...form, phone: e.target.value }); }} placeholder="+998..." />
                  <FieldErr text={ferr.phone} />
                </div>
                <div>
                  <label htmlFor="f-32">Manzil</label>
                  <input id="f-32" value={form.address} onChange={function (e) { setForm({ ...form, address: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-33">Kredit limiti</label>
                  <input id="f-33" type="number" value={form.credit_limit} onChange={function (e) { setForm({ ...form, credit_limit: e.target.value }); }} />
                </div>
              </div>
              <button className="btn" type="submit">Qo'shish</button>
            </form>
          </div>
          )}
          {editId && (
            <div className="card">
              <h2>Tahrirlash #{editId}</h2>
              <form onSubmit={saveEdit} onKeyDown={function (e) { formKeyDown(e, function () { setEditId(null); }); }}>
                <div className="form-row">
                  <div>
                    <label>Ism</label>
                    <input value={editForm.name} onChange={function (e) { setEditForm({ ...editForm, name: e.target.value }); }} required />
                  </div>
                  <div>
                    <label>Telefon</label>
                    <input value={editForm.phone} onChange={function (e) { setEditForm({ ...editForm, phone: e.target.value }); }} />
                  </div>
                  <div>
                    <label>Manzil</label>
                    <input value={editForm.address} onChange={function (e) { setEditForm({ ...editForm, address: e.target.value }); }} />
                  </div>
                  <div>
                    <label>Kredit limiti</label>
                    <input type="number" value={editForm.credit_limit} onChange={function (e) { setEditForm({ ...editForm, credit_limit: e.target.value }); }} />
                  </div>
                  <div>
                    <label>Faol</label>
                    <select value={editForm.is_active ? "1" : "0"} onChange={function (e) { setEditForm({ ...editForm, is_active: e.target.value === "1" }); }}>
                      <option value="1">Ha</option>
                      <option value="0">Yo'q</option>
                    </select>
                  </div>
                </div>
                <button className="btn" type="submit">Saqlash</button>
                <button className="btn-ghost" type="button" onClick={function () { setEditId(null); }}>Bekor</button>
              </form>
            </div>
          )}
          {props.hideList ? null : (
          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>Mijozlar ro'yxati</h2>
              <input type="search" placeholder="Qidiruv: ism, telefon..." value={q} onChange={function (e) { setQ(e.target.value); }} />
            </div>
            <div className="table-wrap list-dense">
              <table>
                <thead>
                  <tr>
                    <th>ID</th><th>Ism</th><th>Telefon</th><th>Limit</th><th>Holat</th>
                    <th className="sticky-actions">Amallar</th>
                  </tr>
                </thead>
                <tbody>
                  {list.filter(function (c) { return matchQ(q, [c.name, c.phone, c.address]); }).map(function (c) {
                    return (
                      <tr key={c.id}>
                        <td data-label="ID">{c.id}</td>
                        <td data-label="Ism">{c.name}</td>
                        <td data-label="Telefon">{c.phone || "—"}</td>
                        <td data-label="Limit">{money(c.credit_limit)}</td>
                        <td data-label="Holat"><StatusBadge status={c.is_active === false ? "closed" : "active"}>{c.is_active === false ? "nofaol" : "faol"}</StatusBadge></td>
                        <td className="sticky-actions" data-label="Amallar">
                          <button type="button" className="btn-ghost btn-sm" onClick={function () { startEdit(c); }}>Tahrir</button>
                          {c.is_active !== false && (
                            <button type="button" className="btn-danger btn-sm" onClick={function () { softDelete(c.id); }}>O'chirish</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
          )}
        </div>
      );
    }

    function Orders(props) {
      const api = props.api;
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const [list, setList] = useState([]);
      const [products, setProducts] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [form, setForm] = useState({
        customer_id: "", customer_name: "", phone: "", paid_amount: "", note: ""
      });
      const [lines, setLines] = useState([{ product_id: "", qty: "", unit_price: "" }]);
      const [priceCfg, setPriceCfg] = useState({ bulk_discount: 3000, bulk_min_qty: 500, bulk_min_kg: 1000 });
      const [msg, setMsg] = useAutoMsg();
      const [q, setQ] = useState("");
      const [dateFrom, setDateFrom] = useState("");
      const [dateTo, setDateTo] = useState("");
      const [ferr, setFerr] = useState({});
      const [selected, setSelected] = useState({});
      const [busy, setBusy] = useState(false);
      const debtOnlyInit = !!(props.pageFilter && props.pageFilter.debtOnly);
      const [debtOnly, setDebtOnly] = useState(debtOnlyInit);

      useEffect(function () {
        setDebtOnly(!!(props.pageFilter && props.pageFilter.debtOnly));
      }, [props.pageFilter]);
      useFocusForm(props.pageFilter, "order");

      function unitForProduct(p, qty) {
        if (!p) return 0;
        const optom = Math.round(Number(p.price) || 0);
        const disc = Number(priceCfg.bulk_discount) || 3000;
        const minQty = Number(priceCfg.bulk_min_qty) || 500;
        const minKg = Number(priceCfg.bulk_min_kg) || 1000;
        const q = Number(qty) || 0;
        const kg = q * (Number(p.weight_kg) || 0);
        const isBulk = q >= minQty || kg >= minKg;
        return isBulk ? optom : optom + disc;
      }

      const load = useCallback(function () {
        Promise.all([
          api("/api/orders?limit=50"),
          api("/api/products"),
          api("/api/customers"),
          api("/api/settings")
        ])
          .then(function (arr) {
            setList(arr[0].data || []);
            setProducts(arr[1].data || []);
            setCustomers(arr[2].data || []);
            const map = (arr[3] && arr[3].data) || {};
            setPriceCfg({
              bulk_discount: Number(map.bulk_discount) || 3000,
              bulk_min_qty: Number(map.bulk_min_qty) || 500,
              bulk_min_kg: Number(map.bulk_min_kg) || 1000
            });
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      function onCustomer(id) {
        const c = customers.find(function (x) { return String(x.id) === String(id); });
        setForm(function (f) {
          return Object.assign({}, f, {
            customer_id: id,
            customer_name: c ? c.name : f.customer_name,
            phone: c && c.phone ? c.phone : f.phone
          });
        });
      }

      function setLine(i, field, val) {
        setLines(function (prev) {
          const next = prev.slice();
          next[i] = Object.assign({}, next[i], { [field]: val });
          if (field === "product_id" || field === "qty") {
            const p = products.find(function (x) { return String(x.id) === String(next[i].product_id); });
            if (p) next[i].unit_price = String(unitForProduct(p, next[i].qty));
          }
          return next;
        });
      }

      const total = lines.reduce(function (s, l) {
        return s + (Number(l.qty) || 0) * (Number(l.unit_price) || 0);
      }, 0);

      async function submit(e) {
        e.preventDefault();
        if (busy) return;
        const items = lines
          .filter(function (l) { return l.product_id && Number(l.qty) > 0; })
          .map(function (l) {
            return {
              product_id: Number(l.product_id),
              qty: Number(l.qty),
              unit_price: Number(l.unit_price) || 0
            };
          });
        const next = {};
        if (!String(form.customer_name || "").trim()) next.customer_name = "Ism majburiy";
        if (!items.length) next.items = "Kamida 1 ta mahsulot kiriting";
        setFerr(next);
        if (next.customer_name || next.items) return;
        setBusy(true);
        try {
          await api("/api/orders", {
            method: "POST",
            body: JSON.stringify({
              customer_id: form.customer_id ? Number(form.customer_id) : null,
              customer_name: form.customer_name,
              phone: form.phone || null,
              paid_amount: Number(form.paid_amount) || 0,
              note: form.note || null,
              items: items
            })
          });
          setMsg({ text: "Buyurtma yaratildi", type: "ok" });
          setForm({ customer_id: "", customer_name: "", phone: "", paid_amount: "", note: "" });
          setLines([{ product_id: "", qty: "", unit_price: "" }]);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
        setBusy(false);
      }

      async function setStatus(id, status) {
        try {
          await api("/api/orders/" + id + "/status", {
            method: "PATCH",
            body: JSON.stringify({ status: status })
          });
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function copyOrder(o) {
        setForm({
          customer_id: o.customer_id ? String(o.customer_id) : "",
          customer_name: o.customer_name || "",
          phone: o.phone || "",
          paid_amount: "",
          note: o.note ? ("Nusxa: " + o.note) : "Nusxa"
        });
        const its = (o.items && o.items.length)
          ? o.items.map(function (it) {
              return {
                product_id: it.product_id ? String(it.product_id) : "",
                qty: String(it.qty != null ? it.qty : ""),
                unit_price: String(it.unit_price != null ? it.unit_price : "")
              };
            })
          : [{ product_id: "", qty: "", unit_price: "" }];
        setLines(its);
        setFerr({});
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      const shown = list.filter(function (o) {
        if (debtOnly && !(Number(o.debt_amount) > 0)) return false;
        if (!inDateRange(o.ordered_at || o.created_at, dateFrom, dateTo)) return false;
        return matchQ(q, [
          o.order_code, o.customer_name, o.phone, o.status, statusLabel(o.status),
          o.note, o.admin_note, o.source
        ]);
      });
      const pendingIds = shown.filter(function (o) { return o.status === "pending"; }).map(function (o) { return o.id; });
      const selectedPending = pendingIds.filter(function (id) { return !!selected[id]; });

      async function bulkConfirm() {
        if (!selectedPending.length) return;
        let ok = 0;
        let fail = 0;
        for (let i = 0; i < selectedPending.length; i++) {
          try {
            await api("/api/orders/" + selectedPending[i] + "/status", {
              method: "PATCH",
              body: JSON.stringify({ status: "confirmed" })
            });
            ok += 1;
          } catch (e) {
            fail += 1;
          }
        }
        setSelected({});
        setMsg({
          text: fail ? (ok + " tasdiqlandi, " + fail + " xato") : (ok + " buyurtma tasdiqlandi"),
          type: fail ? "err" : "ok"
        });
        load();
      }

      return (
        <div>
          <ConfirmModal
            open={confirmState.open}
            text={confirmState.text}
            onCancel={function () { setConfirmState({ open: false, text: "", onConfirm: null }); }}
            onConfirm={function () { if (confirmState.onConfirm) confirmState.onConfirm(); }}
          />
          <PageHead title="Buyurtmalar" sub={"Kutilayotgan buyurtma omborga tegmaydi. " + priceCfg.bulk_min_qty + " donagacha mijoz = optom + " + money(priceCfg.bulk_discount) + " so'm."} />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card" id="form-order">
            <h2>Yangi sotuv</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e); }}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-34">Mijoz (ro'yxat)</label>
                  <select id="f-34" value={form.customer_id} onChange={function (e) { onCustomer(e.target.value); }}>
                    <option value="">-</option>
                    {customers.map(function (c) {
                      return <option key={c.id} value={c.id}>{c.name}</option>;
                    })}
                  </select>
                </div>
                <div>
                  <label htmlFor="f-35">Ism *</label>
                  <input id="f-35" value={form.customer_name} onChange={function (e) { setForm({ ...form, customer_name: e.target.value }); }} />
                  <FieldErr text={ferr.customer_name} />
                </div>
                <div>
                  <label htmlFor="f-36">Telefon</label>
                  <input id="f-36" value={form.phone} onChange={function (e) { setForm({ ...form, phone: e.target.value }); }} />
                </div>
                <div>
                  <label htmlFor="f-37">To'langan</label>
                  <input id="f-37" type="number" value={form.paid_amount} onChange={function (e) { setForm({ ...form, paid_amount: e.target.value }); }} />
                </div>
              </div>
              <div className="line-items">
                <label style={{ marginBottom: 8 }}>Mahsulotlar</label>
                {lines.map(function (l, i) {
                  return (
                    <div className="line-row" key={i}>
                      <div>
                        <label htmlFor={"sku-" + i}>Mahsulot</label>
                        <select id={"sku-" + i} value={l.product_id} onChange={function (e) { setLine(i, "product_id", e.target.value); }}>
                          <option value="">Tanlang</option>
                          {products.map(function (p) {
                            return <option key={p.id} value={p.id}>{p.sku} · optom {money(p.price)}</option>;
                          })}
                        </select>
                      </div>
                      <div>
                        <label htmlFor={"qty-" + i}>Dona</label>
                        <input id={"qty-" + i} type="number" min="1" step="1" value={l.qty} onChange={function (e) { setLine(i, "qty", e.target.value); }} />
                      </div>
                      <div>
                        <label htmlFor={"price-" + i}>Birlik narx</label>
                        <input id={"price-" + i} type="number" min="0" step="1" value={l.unit_price} onChange={function (e) { setLine(i, "unit_price", e.target.value); }} />
                      </div>
                      <button
                        type="button"
                        className="btn-ghost btn-sm"
                        disabled={lines.length === 1}
                        onClick={function () {
                          setLines(function (prev) { return prev.filter(function (_, j) { return j !== i; }); });
                        }}
                      >
                        x
                      </button>
                    </div>
                  );
                })}
                <button
                  type="button"
                  className="btn-ghost"
                  onClick={function () {
                    setLines(function (p) { return p.concat([{ product_id: "", qty: "", unit_price: "" }]); });

                  + qator

              <div>
                <label htmlFor="f-41">Izoh</label>
                <input id="f-41" value={form.note} onChange={function (e) { setForm({ ...form, note: e.target.value }); }} />
              </div>
              <button className="btn" type="submit" disabled={busy}>{busy ? "Saqlanmoqda..." : "Buyurtma yaratish"}</button>
            </form>
          </div>
          <div className="card">
            <h2>Buyurtmalar ({shown.length})</h2>
            <p className="muted" style={{ marginBottom: 10, fontSize: "0.78rem" }}>
              Telegram/PWA buyurtmalari <b>pending</b> - Tasdiq yoki Rad.
            </p>
            <div className="toolbar">
              <input
                type="search"
                placeholder="Qidiruv: kod, mijoz, tel..."
                value={q}
                onChange={function (e) { setQ(e.target.value); }}
              />
              <input type="date" value={dateFrom} onChange={function (e) { setDateFrom(e.target.value); }} title="Dan" />
              <input type="date" value={dateTo} onChange={function (e) { setDateTo(e.target.value); }} title="Gacha" />
              <label className="stat-mini" style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                <input
                  type="checkbox"
                  checked={debtOnly}
                  onChange={function (e) { setDebtOnly(e.target.checked); }}
                  style={{ width: "auto", margin: 0 }}
                />

              </label>
              <button
                type="button"
                className="btn-ghost btn-sm"
                onClick={function () {
                  downloadCsv("buyurtmalar.csv", shown, [
                    { label: "Kod", get: function (r) { return r.order_code; } },
                    { label: "Mijoz", get: function (r) { return r.customer_name; } },
                    { label: "Tel", get: function (r) { return r.phone; } },
                    { label: "Holat", get: function (r) { return statusLabel(r.status); } },
                    { label: "Summa", get: function (r) { return Math.round(Number(r.total_amount) || 0); } },
                    { label: "Qarz", get: function (r) { return Math.round(Number(r.debt_amount) || 0); } },
                    { label: "Sana", get: function (r) { return ymdTashkent(r.ordered_at || r.created_at); } }

                }}
              >
                CSV
              </button>
            </div>
            {selectedPending.length > 0 ? (
              <div className="bulk-bar">
                <strong>{selectedPending.length} ta tanlandi</strong>
                <button type="button" className="btn btn-sm" onClick={bulkConfirm}>Tasdiqlash</button>
                <button type="button" className="btn-ghost btn-sm" onClick={function () { setSelected({}); }}>Bekor</button>
              </div>
            ) : null}
            <div className="table-wrap list-dense">
              <table>
                <thead>
                  <tr>
                    <th>
                      <input
                        type="checkbox"
                        style={{ width: "auto", margin: 0 }}
                        checked={pendingIds.length > 0 && selectedPending.length === pendingIds.length}
                        onChange={function (e) {
                          const on = e.target.checked;
                          const next = Object.assign({}, selected);
                          pendingIds.forEach(function (id) { next[id] = on; });
                          setSelected(next);
                        }}
                        aria-label="Barcha pending"
                      />
                    </th>
                    <th>Buyurtma</th>
                    <th>Mijoz</th>
                    <th>Izoh</th>
                    <th>Summa</th>
                    <th>Holat</th>
                    <th className="sticky-actions">Amallar</th>
                  </tr>
                </thead>
                <tbody>
                  {shown.map(function (o) {
                    var src = o.source || "admin";
                    var srcLabel = src === "telegram" ? "TG" : (src === "pwa" ? "PWA" : "Admin");
                    var itemsLine = o.items && o.items.length
                      ? o.items.map(function (i) { return i.sku + " x " + i.qty; }).join(", ")
                      : "";
                    var trail = o.admin_note || o.updated_by || o.operator_name || "";
                    return (
                      <tr
                        key={o.id}
                        style={
                          o.status === "pending" && (src === "telegram" || src === "pwa")
                            ? { background: "rgba(201,162,39,0.08)" }
                            : undefined
                        }
                      >
                        <td data-label="">
                          {o.status === "pending" ? (
                            <input
                              type="checkbox"
                              style={{ width: "auto", margin: 0 }}
                              checked={!!selected[o.id]}
                              onChange={function (e) {
                                setSelected(Object.assign({}, selected, { [o.id]: e.target.checked }));
                              }}
                              aria-label={"Tanlash " + (o.order_code || o.id)}
                            />
                          ) : null}
                        </td>
                        <td data-label="Buyurtma">
                          <span className="badge" style={{ marginRight: 4 }}>{srcLabel}</span>
                          <span className="order-row-code" title={o.order_code}>
                            {o.order_code && o.order_code.length > 16
                              ? o.order_code.slice(0, 8) + "-" + o.order_code.slice(-4)
                              : o.order_code}
                          </span>
                          {itemsLine ? (
                            <div className="muted" style={{ fontSize: "0.7rem", marginTop: 2 }}>{itemsLine}</div>
                          ) : null}
                        </td>
                        <td data-label="Mijoz" className="cell-stack order-customer-cell">
                          <div className="order-customer-name">{o.customer_name || "-"}</div>
                          {o.phone ? (
                            <div className="order-phone muted">
                              {o.phone}
                            </div>
                          ) : null}
                          {trail ? (
                            <div className="muted order-trail">Oxirgi: {trail}</div>
                          ) : null}
                        </td>
                        <td className="cell-note" data-label="Izoh">
                          {o.note ? <div className="note-text muted" style={{ fontSize: "0.78rem" }}>{o.note}</div> : <span className="muted">—</span>}
                        </td>
                        <td data-label="Summa" className="order-summa-cell">
                          <span className="order-summa">{money(o.total_amount)}</span>
                          {Number(o.debt_amount) > 0 ? (
                            <div className="muted order-debt">qarz {money(o.debt_amount)}</div>
                          ) : null}
                        </td>
                        <td data-label="Holat">
                          <StatusBadge status={o.status} />
                          {Number(o.paid_amount) > 0 && String(o.status) === "pending" ? (
                            <div className="muted" style={{ fontSize: "0.68rem" }}>niyat {money(o.paid_amount)}</div>
                          ) : null}
                        </td>
                        <td className="sticky-actions" data-label="Amallar">
                          <button className="btn-ghost btn-sm" type="button" onClick={function () { copyOrder(o); }}>Nusxa</button>
                          {" "}
                          {o.status === "pending" ? (
                            <span>
                              <button
                                className="btn btn-sm"
                                type="button"
                                onClick={function () { setStatus(o.id, "confirmed"); }}
                              >
                                Tasdiq
                              </button>
                              {" "}
                              <button
                                className="btn-danger btn-sm"
                                type="button"
                                onClick={function () {
                                  setConfirmState({
                                    open: true,
                                    text: "Buyurtmani rad etasizmi?",
                                    onConfirm: function () {
                                      setConfirmState({ open: false, text: "", onConfirm: null });
                                      setStatus(o.id, "rejected");
                                    }
                                  });
                                }}
                              >
                                Rad
                              </button>
                            </span>
                          ) : null}
                          {o.status === "confirmed" ? (
                            <button
                              className="btn-ghost btn-sm"
                              type="button"
                              onClick={function () { setStatus(o.id, "closed"); }}
                            >
                              Yopish
                            </button>
                          ) : null}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Payments ----------
    function Payments(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [orders, setOrders] = useState([]);
      const [form, setForm] = useState({
        customer_id: "", order_id: "", amount: "", method: "cash", note: ""
      });
      const [msg, setMsg] = useAutoMsg();
      const [q, setQ] = useState("");
      const [dateFrom, setDateFrom] = useState("");
      const [dateTo, setDateTo] = useState("");
      const [ferr, setFerr] = useState({});
      const [busy, setBusy] = useState(false);

      const load = useCallback(function () {
        Promise.all([
          api("/api/payments?limit=30"),
          api("/api/customers"),
          api("/api/orders?limit=50")
        ])
          .then(function (arr) {
            setList(arr[0].data || []);
            setCustomers(arr[1].data || []);
            setOrders((arr[2].data || []).filter(function (x) { return Number(x.debt_amount) > 0; }));
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);
      useFocusForm(props.pageFilter, "payment");
      useEffect(function () {
        const id = props.pageFilter && props.pageFilter.customerId;
        if (!id) return;
        setForm(function (f) { return Object.assign({}, f, { customer_id: String(id), order_id: "" }); });
      }, [props.pageFilter]);

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!(Number(form.amount) > 0)) next.amount = "Summa musbat bo'lsin";
        setFerr(next);
        if (next.amount) return;
        if (busy) return;
        setBusy(true);
        try {
          const r = await api("/api/payments", {
            method: "POST",
            body: JSON.stringify({
              customer_id: form.customer_id ? Number(form.customer_id) : null,
              order_id: form.order_id ? Number(form.order_id) : null,
              amount: Number(form.amount),
              method: form.method || "cash",
              note: form.note || null
            })
          });
          setMsg({
            text: "Tolov qabul qilindi. Qollandi: " + money(r.applied) + (r.leftover > 0 ? ", qoldi: " + money(r.leftover) : ""),
            type: "ok"
          });
          setForm({ customer_id: "", order_id: "", amount: "", method: "cash", note: "" });
          setFerr({});
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
        setBusy(false);
      }

      const shown = list.filter(function (p) {
        if (!inDateRange(p.paid_at || p.created_at, dateFrom, dateTo)) return false;
        return matchQ(q, [p.customer_name, p.order_code, p.method, p.note, p.amount]);
      });

      return (
        <div>
          <PageHead title="To'lovlar" sub="Qarz yozuvi. Kutilayotgan buyurtma to'lov bilan o'zi tasdiqlanmaydi." />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card" id="form-payment">
            <h2>To'lov olish</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e); }}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-42">Mijoz</label>
                  <select id="f-42"
                    value={form.customer_id}
                    onChange={function (e) {
                      setForm({ ...form, customer_id: e.target.value, order_id: "" });
                    }}
                  >
                    <option value="">-</option>
                    {customers.map(function (c) {
                      return <option key={c.id} value={c.id}>{c.name}</option>;
                    })}
                  </select>
                </div>
                <div>
                  <label htmlFor="f-43">Buyurtma (ixtiyoriy)</label>
                  <select id="f-43" value={form.order_id} onChange={function (e) { setForm({ ...form, order_id: e.target.value }); }}>
                    <option value="">Barcha qarzlarga (FIFO)</option>
                    {orders
                      .filter(function (o) {
                        return !form.customer_id || String(o.customer_id) === String(form.customer_id);
                      })
                      .map(function (o) {
                        return (
                          <option key={o.id} value={o.id}>
                            {o.order_code} - qarz {money(o.debt_amount)}
                          </option>
                        );
                      })}
                  </select>
                </div>
                <div>
                  <label htmlFor="f-44">Summa *</label>
                  <input id="f-44" type="number" value={form.amount} onChange={function (e) { setForm({ ...form, amount: e.target.value }); }} />
                  <FieldErr text={ferr.amount} />
                </div>
                <div>
                  <label htmlFor="f-45">Usul</label>
                  <select id="f-45" value={form.method} onChange={function (e) { setForm({ ...form, method: e.target.value }); }}>
                    <option value="cash">Naqd</option>
                    <option value="card">Karta</option>
                    <option value="transfer">O'tkazma</option>
                  </select>
                </div>
                <div>
                  <label htmlFor="f-46">Izoh</label>
                  <input id="f-46" value={form.note} onChange={function (e) { setForm({ ...form, note: e.target.value }); }} />
                </div>
              </div>
              <button className="btn" type="submit" disabled={busy}>{busy ? "Saqlanmoqda..." : "Tolov qabul qilish"}</button>
            </form>
          </div>
          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>So'nggi to'lovlar ({shown.length})</h2>
              <input type="search" placeholder="Qidiruv: mijoz, kod..." value={q} onChange={function (e) { setQ(e.target.value); }} />
              <input type="date" value={dateFrom} onChange={function (e) { setDateFrom(e.target.value); }} />
              <input type="date" value={dateTo} onChange={function (e) { setDateTo(e.target.value); }} />
              <button
                type="button"
                className="btn-ghost btn-sm"
                onClick={function () {
                  downloadCsv("tolovlar.csv", shown, [
                    { label: "Sana", get: function (r) { return ymdTashkent(r.paid_at || r.created_at); } },
                    { label: "Mijoz", get: function (r) { return r.customer_name; } },
                    { label: "Buyurtma", get: function (r) { return r.order_code; } },
                    { label: "Summa", get: function (r) { return Math.round(Number(r.amount) || 0); } },
                    { label: "Usul", get: function (r) { return r.method; } }
                  ]);
                }}
              >
                CSV
              </button>
            </div>
            <div className="table-wrap list-dense"><table>
              <thead>
                <tr><th>Sana</th><th>Mijoz</th><th>Buyurtma</th><th>Summa</th><th>Usul</th></tr>
              </thead>
              <tbody>
                {shown.map(function (p) {
                  return (
                    <tr key={p.id}>
                      <td>{p.paid_at ? new Date(p.paid_at).toLocaleString("uz-UZ") : "-"}</td>
                      <td data-label="Mijoz">{p.customer_name || "-"}</td>
                      <td data-label="Buyurtma">{p.order_code || "-"}</td>
                      <td><strong>{money(p.amount)}</strong></td>
                      <td>{p.method}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table></div>
          </div>
        </div>
      );
    }

    // ---------- Expenses ----------
    function Expenses(props) {
      const api = props.api;
      const [list, setList] = useState([]);
      const [form, setForm] = useState({ category: "", amount: "", payment_method: "cash", note: "" });
      const [editId, setEditId] = useState(null);
      const [editForm, setEditForm] = useState({ category: "", amount: "", payment_method: "cash", note: "" });
      const [msg, setMsg] = useAutoMsg();
      const [q, setQ] = useState("");
      const [dateFrom, setDateFrom] = useState("");
      const [dateTo, setDateTo] = useState("");
      const [ferr, setFerr] = useState({});
      const cats = ["Elektr", "Transport", "Ijara", "Ish haqi", "Tamirlash", "Boshqa"];

      const load = useCallback(function () {
        api("/api/expenses?limit=40")
          .then(function (r) { setList(r.data || []); })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      useEffect(function () { load(); }, [load]);
      useFocusForm(props.pageFilter, "expense");

      async function submit(e) {
        e.preventDefault();
        const next = {};
        if (!String(form.category || "").trim()) next.category = "Kategoriya majburiy";
        if (!(Number(form.amount) > 0)) next.amount = "Summa musbat bo'lsin";
        setFerr(next);
        if (next.category || next.amount) return;
        try {
          await api("/api/expenses", {
            method: "POST",
            body: JSON.stringify({
              category: form.category,
              amount: Number(form.amount),
              payment_method: form.payment_method || "cash",
              note: form.note || null
            })
          });
          setMsg({ text: "Xarajat yozildi", type: "ok" });
          setForm({ category: "", amount: "", payment_method: "cash", note: "" });
          setFerr({});
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      function startEdit(x) {
        setEditId(x.id);
        setEditForm({
          category: x.category || "",
          amount: String(Math.round(Number(x.amount || 0))),
          payment_method: x.payment_method || "cash",
          note: x.note || ""
        });
      }

      async function saveEdit(e) {
        e.preventDefault();
        try {
          await api("/api/expenses/" + editId, {
            method: "PUT",
            body: JSON.stringify({
              category: editForm.category,
              amount: Math.round(Number(editForm.amount) || 0),
              payment_method: editForm.payment_method || "cash",
              note: editForm.note || null
            })
          });
          setMsg({ text: "Xarajat yangilandi", type: "ok" });
          setEditId(null);
          load();
        } catch (err) {
          setMsg({ text: err.message, type: "err" });
        }
      }

      const shown = list.filter(function (x) {
        if (!inDateRange(x.expense_date || x.created_at, dateFrom, dateTo)) return false;
        return matchQ(q, [x.category, x.payment_method, x.note, x.amount]);
      });

      return (
        <div>
          <PageHead title="Xarajatlar" sub="Pul chiqimini yozing. Mahsulot tannarxi Sozlamada, bu yerga aralashmaydi." />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <div className="card" id="form-expense">
            <h2>Xarajat yozish</h2>
            <form onSubmit={submit} onKeyDown={function (e) { formKeyDown(e, function () { setFerr({}); }); }}>
              <div className="form-row">
                <div>
                  <label htmlFor="f-47">Kategoriya *</label>
                  <input id="f-47" list="exp-cats" value={form.category} onChange={function (e) { setForm({ ...form, category: e.target.value }); }} />
                  <datalist id="exp-cats">
                    {cats.map(function (c) { return <option key={c} value={c} />; })}
                  </datalist>
                  <FieldErr text={ferr.category} />
                </div>
                <div>
                  <label htmlFor="f-48">Summa *</label>
                  <input id="f-48" type="number" value={form.amount} onChange={function (e) { setForm({ ...form, amount: e.target.value }); }} />
                  <FieldErr text={ferr.amount} />
                </div>
                <div>
                  <label htmlFor="f-49">Usul</label>
                  <select id="f-49" value={form.payment_method} onChange={function (e) { setForm({ ...form, payment_method: e.target.value }); }}>
                    <option value="cash">Naqd</option>
                    <option value="card">Karta</option>
                    <option value="transfer">O'tkazma</option>
                  </select>
                </div>
                <div>
                  <label htmlFor="f-50">Izoh</label>
                  <input id="f-50" value={form.note} onChange={function (e) { setForm({ ...form, note: e.target.value }); }} />
                </div>
              </div>
              <button className="btn" type="submit">Saqlash</button>
            </form>
          </div>
          {editId ? (
            <div className="card">
              <h2>Xarajatni tuzatish</h2>
              <form onSubmit={saveEdit} onKeyDown={function (e) { formKeyDown(e, function () { setEditId(null); }); }}>
                <div className="form-row">
                  <div>
                    <label>Kategoriya</label>
                    <input value={editForm.category} onChange={function (e) { setEditForm({ ...editForm, category: e.target.value }); }} required />
                  </div>
                  <div>
                    <label>Summa</label>
                    <input type="number" min="0" step="1" value={editForm.amount} onChange={function (e) { setEditForm({ ...editForm, amount: e.target.value }); }} required />
                  </div>
                  <div>
                    <label>Usul</label>
                    <select value={editForm.payment_method} onChange={function (e) { setEditForm({ ...editForm, payment_method: e.target.value }); }}>
                      <option value="cash">Naqd</option>
                      <option value="card">Karta</option>
                      <option value="transfer">O'tkazma</option>
                    </select>
                  </div>
                  <div>
                    <label>Izoh</label>
                    <input value={editForm.note} onChange={function (e) { setEditForm({ ...editForm, note: e.target.value }); }} />
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn" type="submit">Saqlash</button>
                  <button className="btn-ghost" type="button" onClick={function () { setEditId(null); }}>Bekor</button>
                </div>
              </form>
            </div>
          ) : null}
          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>Xarajatlar ({shown.length})</h2>
              <input type="search" placeholder="Qidiruv: kategoriya, izoh..." value={q} onChange={function (e) { setQ(e.target.value); }} />
              <input type="date" value={dateFrom} onChange={function (e) { setDateFrom(e.target.value); }} />
              <input type="date" value={dateTo} onChange={function (e) { setDateTo(e.target.value); }} />
              <button
                type="button"
                className="btn-ghost btn-sm"
                onClick={function () {
                  downloadCsv("xarajatlar.csv", shown, [
                    { label: "Sana", get: function (r) { return ymdTashkent(r.expense_date || r.created_at); } },
                    { label: "Kategoriya", get: function (r) { return r.category; } },
                    { label: "Summa", get: function (r) { return Math.round(Number(r.amount) || 0); } },
                    { label: "Usul", get: function (r) { return r.payment_method; } },
                    { label: "Izoh", get: function (r) { return r.note; } }
                  ]);
                }}
              >
                CSV
              </button>
            </div>
            <div className="table-wrap list-dense"><table>
              <thead>
                <tr><th>Sana</th><th>Kategoriya</th><th>Summa</th><th>Usul</th><th>Izoh</th><th></th></tr>
              </thead>
              <tbody>
                {shown.map(function (x) {
                  return (
                    <tr key={x.id}>
                      <td>{x.expense_date ? new Date(x.expense_date).toLocaleDateString("uz-UZ") : "-"}</td>
                      <td>{x.category}</td>
                      <td><strong>{money(x.amount)}</strong></td>
                      <td>{x.payment_method}</td>
                      <td>{x.note || "-"}</td>
                      <td>
                        <button type="button" className="btn-ghost btn-sm" onClick={function () { startEdit(x); }}>Tahrir</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table></div>
          </div>
        </div>
      );
    }

    function RecipePanel(props) {
      const api = props.api;
      const [products, setProducts] = useState([]);
      const [materials, setMaterials] = useState([]);
      const [openId, setOpenId] = useState(null);
      const [lines, setLines] = useState([]);
      const [msg, setMsg] = useAutoMsg();

      useEffect(function () {
        Promise.all([api("/api/products?active=0"), api("/api/materials?active=0")])
          .then(function (arr) {
            setProducts(arr[0].data || []);
            setMaterials(arr[1].data || []);
          })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }, [api]);

      function matName(id) {
        const m = materials.filter(function (x) { return String(x.id) === String(id); })[0];
        return m ? m.name : ("#" + id);
      }

      function openRecipe(id) {
        if (String(openId) === String(id)) { setOpenId(null); return; }
        setOpenId(id);
        setLines([]);
        api("/api/products/" + id + "/recipes")
          .then(function (r) { setLines(r.data || []); })
          .catch(function (e) { setMsg({ text: e.message, type: "err" }); });
      }

      return (
        <div className="card">
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          <h2>Retseptlar</h2>
          <p className="muted" style={{ marginBottom: 10 }}>Har bir mahsulotning 1 donasiga ketadigan xomashyo. O'zgartirish: Mahsulotlar va narxlar → Tahrir.</p>
          {products.length === 0 ? <div className="empty">Mahsulot yo'q</div> : (
            <div>
              {products.map(function (p) {
                const open = String(openId) === String(p.id);
                return (
                  <div key={p.id} style={{ borderTop: "1px solid var(--border-subtle)", padding: "8px 0" }}>
                    <button type="button" className="btn-ghost" onClick={function () { openRecipe(p.id); }}>
                      {open ? "Yopish" : "Ko'rish"} · {p.sku}
                    </button>
                    {open ? (
                      lines.length === 0 ? <div className="muted">Retsept yozilmagan</div> : (
                        <div className="table-wrap list-dense">
                          <table>
                            <thead><tr><th>Xomashyo</th><th>Miqdor</th><th>Summa</th></tr></thead>
                            <tbody>
                              {lines.map(function (ln, i) {
                                return (
                                  <tr key={i}>
                                    <td data-label="Xomashyo">{matName(ln.material_id)}</td>
                                    <td data-label="Miqdor">{ln.qty}</td>
                                    <td data-label="Summa">{money(ln.line_amount)}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      )
                    ) : null}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    function MoneyReports(props) {
      const api = props.api;
      const [dash, setDash] = useState(null);
      const [expenses, setExpenses] = useState([]);
      const [err, setErr] = useState("");

      useEffect(function () {
        Promise.all([
          api("/api/dashboard"),
          api("/api/expenses?limit=200")
        ]).then(function (arr) {
          setDash(arr[0].data || {});
          setExpenses(arr[1].data || []);
          setErr("");
        }).catch(function (e) { setErr(e.message); });
      }, [api]);

      if (err) return <div className="msg err">{err}</div>;
      if (!dash) return <div className="muted">Hisobot yuklanmoqda...</div>;

      const byCat = {};
      expenses.forEach(function (x) {
        const k = x.category || "Boshqa";
        byCat[k] = (byCat[k] || 0) + Number(x.amount || 0);
      });
      const cats = Object.keys(byCat);

      function Kpi(props2) {
        return (
          <div className="dash-kpi">
            <div className="label">{props2.label}</div>
            <div className={"value" + (props2.neg ? " neg" : "")}>{money(props2.value)}</div>
          </div>
        );
      }

      return (
        <div>
          <PageHead title="Hisobot" sub="Bugungi va shu oydagi pul. Raqamlar mavjud hisob-kitobdan." />
          <div className="dash-section-title">Bugun</div>
          <div className="dash-kpis cols-5">
            <Kpi label="Savdo" value={dash.bugungi_savdo} />
            <Kpi label="Tushum" value={dash.bugungi_naqd_tushum} />
            <Kpi label="Xarajat" value={dash.bugungi_xarajat} />
            <Kpi label="Qolgan" value={dash.bugungi_foyda} neg={Number(dash.bugungi_foyda) < 0} />
          </div>
          <div className="dash-section-title">Shu oy</div>
          <div className="dash-kpis cols-5">
            <Kpi label="Savdo" value={dash.oylik_savdo} />
            <Kpi label="Tushum" value={dash.oylik_naqd_tushum} />
            <Kpi label="Xarajat" value={dash.oylik_xarajat} />
            <Kpi label="Qolgan" value={dash.oylik_foyda} neg={Number(dash.oylik_foyda) < 0} />
          </div>
          <div className="card">
            <h2>Jami qarz</h2>
            <div className="dash-kpi"><div className="value">{money(dash.jami_qarz)}</div></div>
            <p className="muted">Kim qarzdor — Mijozlar → Qarzdorlar.</p>
          </div>
          <div className="card">
            <h2>Xarajat turlari</h2>
            <p className="muted">So'nggi yozuvlar bo'yicha.</p>
            {cats.length === 0 ? <div className="empty">Xarajat yo'q</div> : (
              <div className="table-wrap list-dense"><table>
                <thead><tr><th>Tur</th><th>Summa</th></tr></thead>
                <tbody>
                  {cats.map(function (c) {
                    return <tr key={c}><td data-label="Tur">{c}</td><td data-label="Summa"><strong>{money(byCat[c])}</strong></td></tr>;
                  })}
                </tbody>
              </table></div>
            )}
          </div>
        </div>
      );
    }

    function DiscountLimits(props) {
      const api = props.api;
      const onNavigate = props.onNavigate;
      const [partners, setPartners] = useState([]);
      const [err, setErr] = useState("");
      useEffect(function () {
        api("/api/partners?active=0")
          .then(function (r) { setPartners(r.data || []); })
          .catch(function (e) { setErr(e.message); });
      }, [api]);
      const typeLabel = { customer: "Hamkor", dealer: "Diler", agent: "Hamkor" };
      const discLabel = { none: "Yo'q", bulk: "Yirik xarid", fixed_amount: "Doimiy so'm", fixed_percent: "Doimiy %" };
      return (
        <div>
          <PageHead title="Chegirma va limitlar" sub="Umumiy qoida shu yerda. Har bir diler yoki hamkorning o'z chegirmasi jadvalda." />
          {err ? <div className="msg err">{err}</div> : null}
          {window.BizSettings
            ? React.createElement(window.BizSettings, { api: api })
            : <div className="card">Sozlama moduli yuklanmadi — sahifani yangilang.</div>}
          <div className="card">
            <h2>Kimda qanday chegirma</h2>
            <div className="table-wrap list-dense"><table>
              <thead><tr><th>Ism</th><th>Tur</th><th>Chegirma</th><th>Limit</th><th></th></tr></thead>
              <tbody>
                {partners.length === 0 ? (
                  <tr><td colSpan="5">Hamkor yo'q</td></tr>
                ) : partners.map(function (p) {
                  return (
                    <tr key={p.id}>
                      <td data-label="Ism">{p.name}</td>
                      <td data-label="Tur">{typeLabel[p.type] || p.type}</td>
                      <td data-label="Chegirma">{(discLabel[p.discount_type] || p.discount_type)}{Number(p.discount_value) > 0 ? " · " + money(p.discount_value) : ""}</td>
                      <td data-label="Limit">{money(p.credit_limit)}</td>
                      <td>
                        <button type="button" className="btn-ghost btn-sm" onClick={function () {
                          if (onNavigate) onNavigate("people", { editPartnerId: p.id, openKey: "p-" + p.id });
                        }}>Tahrir</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table></div>
          </div>
        </div>
      );
