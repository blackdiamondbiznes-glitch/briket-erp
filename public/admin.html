<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="color-scheme" content="dark" />
  <title>Black Diamond — Operatsion tizim</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="theme.js"></script>
  <script src="confirm-sheet.js"></script>
  <script>
    (function () {
      function readyTg() {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          if (tg.expand) tg.expand();
          if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        } catch (e) {}
      }
      readyTg();
      document.addEventListener("DOMContentLoaded", readyTg);
      window.addEventListener("pageshow", readyTg);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
  <script type="text/babel" src="/admin-v2-components.jsx"></script>
  <style>
    /* ========== Design tokens - Black Diamond ERP ========== */
    :root {
      --nav-h: 76px;
      --row-h: 44px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      font-size: var(--fs-body-lg);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding: 0 0 calc(var(--nav-h) + 48px + env(safe-area-inset-bottom, 0px));
    }
    button, input, select, textarea { font-family: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }
    .shell { min-height: 100vh; }

    /* Eski Index.html qobig'i: sticky header + 4 pastki menyu */
    .header {
      background: color-mix(in srgb, var(--header-bg) 94%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px 12px;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      display: flex; align-items: center; gap: 12px;
      max-width: 640px; margin: 0 auto;
    }
    .header-role {
      font-size: 12px; color: var(--accent); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .header-mark {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(145deg, #d4b03a 0%, #c9a227 50%, #8a6f12 100%);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(201,162,39,0.4);
    }
    .header-mark img { width: 100%; height: 100%; object-fit: cover; }
    .header h1 {
      font-size: 17px; font-weight: 700; letter-spacing: -0.03em;
      color: var(--text); line-height: 1.2;
    }
    .header p {
      font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 500;
    }
    .header-right {
      margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    }
    .header .logout-btn { width: auto; margin: 0; padding: 10px 12px; min-height: 44px; }

    .main {
      padding: 14px 16px 28px;
      max-width: 640px; margin: 0 auto;
    }

    /* Segment (sub-tabs) — eski .segments */
    .segment {
      display: flex; background: var(--bg-elevated);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 3px; margin-bottom: 16px; gap: 2px;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .segment::-webkit-scrollbar { display: none; }
    .segment button, .segment a {
      flex: 1; min-width: 72px; border: none; background: transparent;
      color: var(--muted); padding: 10px 12px; border-radius: 6px;
      min-height: 44px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      white-space: nowrap; text-decoration: none; text-align: center;
    }
    .segment button.active {
      background: linear-gradient(180deg, #d4b03a 0%, #c9a227 100%);
      color: #1a1408; box-shadow: 0 2px 8px rgba(201,162,39,0.3);
    }
    .segment button:hover:not(.active), .segment a:hover { color: var(--text); }
    .segment button:focus-visible, .segment a:focus-visible { outline: none; box-shadow: var(--focus-ring); }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
      display: flex;
      min-height: var(--nav-h);
      height: auto;
      background: color-mix(in srgb, var(--header-bg) 94%, transparent);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding-top: 4px;
      padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 20px rgba(40, 32, 12, 0.1);
    }
    .bottom-nav button {
      flex: 1; text-align: center; font-size: 12px; padding: 6px 2px;
      min-height: 48px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      background: transparent; border: none; color: var(--muted);
      cursor: pointer; font-weight: 600; font-family: inherit; line-height: 1.15;
    }
    .bottom-nav button .nav-label {
      display: block; max-width: 68px; white-space: normal;
    }
    .bottom-nav button.active {
      color: var(--accent);
      background: color-mix(in srgb, var(--accent-fill) 18%, transparent);
      border-radius: 12px;
      margin: 4px 3px;
    }
    .bottom-nav button .nav-ico { width: 22px; height: 22px; }
    .bottom-nav button .nav-ico svg { width: 22px; height: 22px; display: block; stroke-width: 1.7; }
    .bottom-nav button.active .nav-ico svg { stroke-width: 2.2; stroke: var(--accent); }
    .bottom-nav button:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .card h2 {
      font-size: 0.8125rem; margin-bottom: 12px;
      color: var(--muted); font-weight: 600;
      letter-spacing: 0.02em; text-transform: uppercase;
    }
    .card.tight { padding: 12px 14px; margin-bottom: 10px; }
    .card.tight h2 { font-size: 0.75rem; margin-bottom: 8px; }
    .card.tight table { font-size: 0.75rem; }
    .card.tight th, .card.tight td { padding: 6px 8px; height: auto; }


    .dash-alerts-sticky { margin-bottom: 12px; }
    .dash-alert { font-weight: 600; border-width: 1.5px; }
    tr.row-zero td, tr.row-zero { background: var(--warning-bg); }
    tr.row-zero td[data-label="Qoldiq"] strong { color: var(--warning); }
    .dash-kpi { min-height: var(--tap-min); }
    .dash-section-title {
      font-size: var(--fs-label); font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted); margin: 14px 0 8px;
    }

    /* KPI */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px;
    }
    .kpi, .dash-kpi {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 12px 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: visible;
    }
    .kpi-top {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .kpi-ico {
      width: 28px; height: 28px; flex: 0 0 28px;
      display: grid; place-items: center;
      border-radius: 8px;
      background: var(--accent-muted);
      color: var(--accent);
    }
    .kpi-ico svg { width: 16px; height: 16px; display: block; }
    .kpi .label, .dash-kpi .label {
      font-size: 0.75rem; color: var(--hint);
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
      line-height: 1.2;
    }
    .kpi .value, .dash-kpi .value {
      font-size: 1.05rem; font-weight: 700; margin-top: 8px;
      line-height: 1.1; font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em; color: var(--text);
      display: flex; flex-wrap: nowrap; align-items: baseline; gap: 4px;
      white-space: nowrap;
    }
    .kpi-unit { font-size: 0.75rem; font-weight: 650; color: var(--hint); letter-spacing: 0; flex: 0 0 auto; }
    .dash-kpi .value > span { white-space: nowrap; flex-shrink: 0; }
    .kpi-delta {
      margin-top: 6px; font-size: 0.75rem; font-weight: 700;
      font-variant-numeric: tabular-nums; line-height: 1.3;
    }
    .kpi-delta.up { color: var(--success); }
    .kpi-delta.down { color: var(--danger); }
    .kpi-delta.flat { color: var(--hint); }
    .kpi-delta.bad-up { color: var(--danger); }
    .kpi-delta.good-down { color: var(--success); }
    .kpi-delta-vs { font-weight: 600; color: var(--hint); }
    .kpi .trend, .dash-kpi .trend {
      margin-top: 6px; font-size: 0.75rem; color: var(--hint);
      min-height: 1em;
    }
    .dash-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .dash-kpis.cols-5 {
      grid-template-columns: 1fr 1fr;
    }
    @media (min-width: 720px) {
      .dash-kpis { grid-template-columns: repeat(4, 1fr); gap: 10px; }
      .dash-kpis.cols-5 { grid-template-columns: repeat(5, 1fr); }
      .dash-kpi .value { font-size: 1.28rem; }
    }
    @media (max-width: 380px) {
      .dash-kpis, .dash-kpis.cols-5 { grid-template-columns: 1fr 1fr; }
      .dash-kpi .value { font-size: 1.12rem; }
    }
    .dash-charts {
      display: grid; grid-template-columns: 1fr; gap: 8px; margin: 4px 0 10px;
    }
    @media (min-width: 960px) {
      .dash-charts { grid-template-columns: 1fr 1fr; }
      .chart-card.wide { grid-column: 1 / -1; }
    }
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px; box-shadow: var(--shadow); min-width: 0;
    }
    .chart-card h2 { margin: 0 0 8px; font-size: 0.95rem; }
    .chart-legend { display: flex; gap: 14px; font-size: 0.75rem; color: var(--hint); margin-bottom: 6px; }
    .chart-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }
    .chart-svg { width: 100%; height: auto; display: block; }
    .hbar { display: grid; grid-template-columns: minmax(72px, 34%) 1fr auto; gap: 8px; align-items: center; margin-top: 8px; }
    .hbar-name, .hbar-val { font-size: 0.75rem; font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar-val { font-variant-numeric: tabular-nums; color: var(--text); }
    .hbar-track { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--text) 8%, transparent); overflow: hidden; }
    .hbar-fill { height: 100%; border-radius: 99px; background: var(--accent-fill); }
    .dash-kpi-danger {
      border-color: var(--danger-border);
      background: var(--danger-bg);
    }
    .dash-meta {
      display: flex; flex-wrap: wrap; gap: 6px 14px;
      margin-bottom: 12px; padding: 10px 12px;
      background: var(--bg-elevated); border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      font-size: 0.75rem; color: var(--muted);
    }
    .dash-meta strong { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .dash-alert {
      font-size: 0.78rem; padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 6px;
      border: 1px solid transparent;
    }
    .dash-alert.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .dash-alert.warn { background: var(--warning-bg); color: var(--warning); border-color: var(--warning-border); }
    .dash-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;
    }
    .neg {
      color: var(--danger); font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 700px) {
      .dash-grid { grid-template-columns: 1fr; }
      .main { padding-left: 12px; padding-right: 12px; overflow-x: hidden; }
      .dash-kpi { padding: 10px 12px; min-width: 0; }
      .dash-kpi .value {
        font-size: 1.15rem;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .dash-meta {
        gap: 6px 10px;
        font-size: 0.75rem;
      }
      .table-wrap { margin: 0 -4px; }
    }

    /* Tables - dense enterprise */
    .table-wrap {
      width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 560px;
    }
    th, td {
      text-align: left;
      padding: 0 10px;
      height: var(--row-h);
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }
    th {
      color: var(--muted); font-weight: 650; font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.04em;
      background: var(--bg-mid);
      position: sticky; top: 0; z-index: 1;
      height: 30px;
    }
    tbody tr:nth-child(even) { background: rgba(154,123,20,0.035); }
    tbody tr:hover { background: var(--card-hover); }
    tbody tr:last-child td { border-bottom: none; }
    .order-row-code {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
      max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .note-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: 280px;
    }

    /* Forms */
    input, select, textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      font-size: 16px;
      margin-bottom: 8px;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: var(--focus-ring);
    }
    label {
      font-size: var(--fs-label); color: var(--muted);
      display: block; margin-bottom: 4px;
      font-weight: 500; letter-spacing: 0.02em;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 700px) {
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }
    .field-error {
      font-size: 0.75rem; color: var(--danger); margin: -4px 0 8px;
    }

    /* Buttons */
    .btn {
      background: var(--accent-fill); color: var(--accent-text); border: none;
      padding: 8px 14px; border-radius: var(--radius-sm);
      font-weight: 600; cursor: pointer; font-size: 0.84rem;
      letter-spacing: 0.01em; min-height: var(--tap);
      transition: background 0.12s ease, transform 0.08s ease;
    }
    .btn:hover { background: var(--accent-fill-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn-ghost {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 0 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.75rem; font-weight: 600; min-height: var(--tap);
      transition: border-color 0.12s ease, background 0.12s ease;
    }
    .btn-ghost:hover { border-color: var(--accent); background: var(--accent-muted); color: var(--accent-hover); }
    .btn-sm { padding: 0 10px; font-size: 0.75rem; border-radius: 8px; min-height: var(--tap); }
    .btn-danger {
      background: var(--danger-bg); color: var(--danger);
      border: 1px solid var(--danger-border);
      padding: 0 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.75rem; font-weight: 600; min-height: var(--tap);
    }
    .btn-danger:hover { background: var(--danger-bg); filter: brightness(0.97); }
    .btn-danger.btn-sm { padding: 0 10px; font-size: 0.75rem; border-radius: 8px; min-height: var(--tap); }

    /* Messages — toast */
    .msg {
      padding: 10px 12px; border-radius: var(--radius-sm);
      margin-bottom: 10px; font-size: 0.84rem;
      border: 1px solid transparent;
    }
    .msg.ok { background: var(--success-bg); color: var(--success); border-color: var(--success-border); }
    .msg.err { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .msg.toast {
      position: fixed; top: 16px; right: 16px; z-index: 240;
      margin: 0; min-width: 220px; max-width: min(360px, calc(100vw - 32px));
      box-shadow: var(--shadow); cursor: pointer;
    }
    .muted { color: var(--muted); font-size: 0.8rem; }

    /* Badges - 4 semantic states */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 99px;
      font-size: 0.75rem; font-weight: 550; letter-spacing: 0.01em;
      background: var(--bg-mid); color: var(--muted);
      border: 1px solid transparent;
    }
    .badge .mark { font-size: 0.75rem; line-height: 1; }
    .badge.active, .badge.paid, .badge.success,
    .badge.confirmed {
      background: var(--success-bg); color: var(--success); border-color: var(--success-border);
    }
    .badge.closed, .badge.neutral {
      background: var(--bg-mid); color: var(--muted);
    }
    .badge.partial, .badge.pending, .badge.warning {
      background: var(--warning-bg); color: var(--warning); border-color: var(--warning-border);
    }
    .badge.rejected, .badge.cancelled, .badge.danger {
      background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border);
    }
    .badge.info {
      background: var(--info-bg); color: var(--info); border-color: var(--info-border);
    }

    .empty {
      text-align: center; padding: 28px 16px; color: var(--muted);
      font-size: 0.84rem;
    }
    .empty-title { color: var(--text); font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }

    .settings-bar { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .settings-bar > div { flex: 1; min-width: 160px; }
    .line-items {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 10px; margin-bottom: 10px;
    }
    .line-row {
      display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 6px;
      align-items: end; margin-bottom: 6px;
    }
    @media (max-width: 600px) { .line-row { grid-template-columns: 1fr 1fr; } }
    .total-box {
      background: var(--bg-elevated); border-radius: var(--radius-sm);
      padding: 10px 12px; margin: 8px 0;
      display: flex; justify-content: space-between; font-weight: 600;
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--border-subtle);
    }

    /* Login — eski PIN oynasi uslubi, lekin ADMIN_KEY */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 70% 45% at 50% -10%, rgba(201,162,39,0.15), transparent),
        var(--bg);
    }
    .login-card {
      width: 100%; max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }
    .login-card h1 { font-size: 1.1rem; color: var(--text); margin-bottom: 4px; font-weight: 650; }
    .login-card p { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; }
    .login-card label { display: block; font-size: var(--fs-label); color: var(--muted); margin-bottom: 6px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 16px; margin-bottom: 14px;
    }
    .login-card input:focus {
      outline: none; border-color: var(--accent); box-shadow: var(--focus-ring);
    }
    .login-card .btn {
      width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
      font-weight: 700; background: var(--accent-fill); color: var(--accent-text); cursor: pointer; min-height: var(--tap);
    }
    .login-card .btn:hover { background: var(--accent-fill-hover); }
    .login-card .err { color: var(--danger); font-size: 0.85rem; margin-bottom: 10px; }
    .logout-btn {
      margin-top: 8px; width: 100%; padding: 8px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle); background: transparent; color: var(--muted);
