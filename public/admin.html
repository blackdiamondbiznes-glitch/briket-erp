    function PeopleHub(props) {
      const api = props.api;
      const mode = props.mode || "list";
      const onNavigate = props.onNavigate;
      const [customers, setCustomers] = useState([]);
      const [partners, setPartners] = useState([]);
      const [orders, setOrders] = useState([]);
      const [payments, setPayments] = useState([]);
      const [shipments, setShipments] = useState([]);
      const [fieldSales, setFieldSales] = useState([]);
      const [partnerDebt, setPartnerDebt] = useState({});
      const [tur, setTur] = useState("all");
      const [q, setQ] = useState("");
      const [msg, setMsg] = useAutoMsg();
      const [editor, setEditor] = useState(null);
      const [openKey, setOpenKey] = useState("");
      const [err, setErr] = useState("");
      const [confirmState, setConfirmState] = useState({ open: false, text: "", onConfirm: null });
      const pfBoot = useRef("");

      const load = useCallback(function () {
        Promise.all([
          api("/api/customers?active=0"),
          api("/api/partners?active=0"),
          api("/api/orders?limit=100"),
          api("/api/payments?limit=200"),
          api("/api/shipments?limit=100"),
          api("/api/agent/admin/waybills?scope=admin").catch(function () { return { data: [] }; })
        ]).then(function (arr) {
          const parts = arr[1].data || [];
          setCustomers(arr[0].data || []);
          setPartners(parts);
          setOrders(arr[2].data || []);
          setPayments(arr[3].data || []);
          setShipments(arr[4].data || []);
          setFieldSales(arr[5].data || []);
          setErr("");
          return Promise.all(parts.map(function (p) {
            return api("/api/partners/" + p.id + "/debt")
              .then(function (r) { return { id: p.id, debt: r.data || null }; })
              .catch(function () { return { id: p.id, debt: null }; });
          }));
        }).then(function (rows) {
          const map = {};
          (rows || []).forEach(function (x) { map[x.id] = x.debt; });
          setPartnerDebt(map);
        }).catch(function (e) { setErr(e.message); });
      }, [api]);

      useEffect(function () { load(); }, [load]);

      useEffect(function () {
        const pf = props.pageFilter || {};
        const key = [pf.editCustomerId || "", pf.editPartnerId || "", pf.openKey || ""].join("|");
        if (!pf.editCustomerId && !pf.editPartnerId && !pf.openKey) return;
        if (pf.editPartnerId && !partners.length) return;
        if (pfBoot.current === key) return;
        pfBoot.current = key;
        if (pf.editCustomerId) setEditor({ kind: "customer", id: pf.editCustomerId });
        if (pf.editPartnerId) {
          const p = partners.find(function (x) { return String(x.id) === String(pf.editPartnerId); });
          setEditor({ kind: "partner", id: pf.editPartnerId, presetType: p ? p.type : "dealer" });
        }
        if (pf.openKey) setOpenKey(String(pf.openKey));
      }, [props.pageFilter, partners]);

      function debtForCustomer(c) {
        const fromOrders = orders.reduce(function (s, o) {
          if (String(o.customer_id || "") !== String(c.id)) return s;
          return s + Number(o.debt_amount || 0);
        }, 0);
        const fromField = fieldSales.reduce(function (s, w) {
          if (String(w.customer_id || "") !== String(c.id)) return s;
          return s + Number(w.debt_amount || 0);
        }, 0);
        return fromOrders + fromField;
      }

      const rows = [];
      customers.forEach(function (c) {
        rows.push({
          key: "c-" + c.id, kind: "customer", id: c.id, tur: "chakana", turLabel: "Chakana",
          name: c.name || "", phone: c.phone || "", address: c.address || "",
          active: c.is_active !== false, debt: debtForCustomer(c), limit: c.credit_limit
        });
      });
      partners.forEach(function (p) {
        const isDealer = p.type === "dealer";
        const d = partnerDebt[p.id];
        rows.push({
          key: "p-" + p.id, kind: "partner", id: p.id,
          tur: isDealer ? "diler" : "hamkor",
          turLabel: isDealer ? "Diler" : "Hamkor",
          name: p.name || "", phone: p.phone || "", address: p.address || "",
          active: p.is_active !== false,
          debt: d ? Number(d.estimated_balance || 0) : 0,
          debtInfo: d,
          limit: p.credit_limit,
          partnerType: p.type
        });
      });

      const shown = rows.filter(function (r) {
        if (tur !== "all" && r.tur !== tur) return false;
        if (mode === "debtors" && !(Number(r.debt) > 0)) return false;
        return matchQ(q, [r.name, r.phone, r.turLabel, r.address]);
      }).sort(function (a, b) { return Number(b.debt) - Number(a.debt) || String(a.name).localeCompare(String(b.name), "uz"); });

      const opened = rows.filter(function (r) { return r.key === openKey; })[0] || null;
      const cardOrders = opened ? orders.filter(function (o) {
        if (opened.kind === "customer") return String(o.customer_id || "") === String(opened.id);
        return String(o.partner_id || "") === String(opened.id);
      }) : [];
      const cardPays = opened ? payments.filter(function (p) {
        if (opened.kind === "customer") return String(p.customer_id || "") === String(opened.id);
        return String(p.partner_id || "") === String(opened.id);
      }) : [];
      const cardShips = opened && opened.kind === "partner" ? shipments.filter(function (s) {
        return String(s.to_partner_id || "") === String(opened.id);
      }) : [];

      function askOff(row) {
        setConfirmState({
          open: true,
          text: row.name + " ni nofaol qilish? Ma'lumot o'chmaydi, ro'yxatdan yashirinadi.",
          onConfirm: async function () {
            setConfirmState({ open: false, text: "", onConfirm: null });
            try {
              const path = row.kind === "customer" ? "/api/customers/" : "/api/partners/";
              await api(path + row.id, { method: "DELETE" });
              setMsg({ text: "Nofaol qilindi", type: "ok" });
              setOpenKey("");
              load();
            } catch (e) {
              setMsg({ text: e.message, type: "err" });
            }
          }
        });
      }

      function saved(text) {
        setMsg({ text: text || "Saqlandi", type: "ok" });
        setEditor(null);
        load();
      }

      return (
        <div>
          <ConfirmModal
            open={confirmState.open}
            text={confirmState.text}
            onCancel={function () { setConfirmState({ open: false, text: "", onConfirm: null }); }}
            onConfirm={function () { if (confirmState.onConfirm) confirmState.onConfirm(); }}
          />
          <PageHead
            title={mode === "debtors" ? "Qarzdorlar" : "Mijozlar va qarzlar"}
            sub="Chakana, diler va hamkor bitta ro'yxatda. Jadvallar alohida qoladi."
          />
          <Msg text={msg.text} type={msg.type} onClose={function () { setMsg({}); }} />
          {err ? <div className="msg err">{err}</div> : null}
          <div className="chip-row" role="tablist">
            {[["all", "Hammasi"], ["chakana", "Chakana"], ["diler", "Diler"], ["hamkor", "Hamkor"]].map(function (pair) {
              return (
                <button key={pair[0]} type="button" className={tur === pair[0] ? "on" : ""} onClick={function () { setTur(pair[0]); }}>{pair[1]}</button>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
            <button type="button" className="btn" onClick={function () { setEditor({ kind: "customer" }); }}>+ Chakana</button>
            <button type="button" className="btn" onClick={function () { setEditor({ kind: "partner", presetType: "dealer" }); }}>+ Diler</button>
            <button type="button" className="btn" onClick={function () { setEditor({ kind: "partner", presetType: "agent" }); }}>+ Hamkor</button>
          </div>
          {editor && editor.kind === "customer" ? (
            <Customers api={api} hideList includeInactive initialEditId={editor.id || null} hideCreate={!!editor.id} onSaved={saved} />
          ) : null}
          {editor && editor.kind === "partner" ? (
            window.Partners
              ? React.createElement(window.Partners, {
                  api: api, hideList: true, includeInactive: true,
                  presetType: editor.presetType || "dealer",
                  initialEditId: editor.id || null,
                  onSaved: saved
                })
              : <div className="card">Hamkor moduli yuklanmadi — sahifani yangilang.</div>
          ) : null}
          <div className="card">
            <div className="toolbar">
              <h2 style={{ margin: 0 }}>{mode === "debtors" ? "Qarzi borlar" : "Ro'yxat"} ({shown.length})</h2>
              <input type="search" placeholder="Ism yoki telefon" value={q} onChange={function (e) { setQ(e.target.value); }} />
            </div>
            {shown.length === 0 ? <EmptyState icon="users" title="Hech kim yo'q" sub={mode === "debtors" ? "Qarzdor topilmadi" : "Yuqoridan qo'shing"} /> : (
              <div className="table-wrap list-dense"><table>
                <thead>
                  <tr><th>Ism</th><th>Tur</th><th>Telefon</th><th>Qarz</th><th>Holat</th><th></th></tr>
                </thead>
                <tbody>
                  {shown.map(function (r) {
                    return (
                      <tr key={r.key}>
                        <td data-label="Ism">
                          <button type="button" className="btn-ghost btn-sm" onClick={function () { setOpenKey(openKey === r.key ? "" : r.key); }}>{r.name}</button>
                        </td>
                        <td data-label="Tur">{r.turLabel}</td>
                        <td data-label="Telefon">{r.phone || "—"}</td>
                        <td data-label="Qarz"><strong className={Number(r.debt) > 0 ? "neg" : ""}>{money(r.debt)}</strong></td>
                        <td data-label="Holat">{r.active ? "faol" : "nofaol"}</td>
                        <td className="sticky-actions" data-label="Amallar">
                          <button type="button" className="btn-ghost btn-sm" onClick={function () { setOpenKey(r.key); }}>Karta</button>
                          <button type="button" className="btn-ghost btn-sm" onClick={function () {
                            setEditor(r.kind === "customer"
                              ? { kind: "customer", id: r.id }
                              : { kind: "partner", id: r.id, presetType: r.partnerType || "agent" });
                          }}>Tahrir</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table></div>
            )}
          </div>
          {opened ? (
            <div className="card person-card">
              <h2>{opened.name}</h2>
              <p className="muted">{opened.turLabel}{opened.phone ? " · " + opened.phone : ""}{opened.address ? " · " + opened.address : ""}</p>
              <div className="dash-kpis">
                <div className="dash-kpi"><div className="label">Qarz</div><div className={"value" + (Number(opened.debt) > 0 ? " neg" : "")}>{money(opened.debt)}</div></div>
                <div className="dash-kpi"><div className="label">Limit</div><div className="value">{money(opened.limit)}</div></div>
              </div>
              {opened.debtInfo ? (
                <p className="muted">Buyurtma qarzi {money(opened.debtInfo.order_debt)} · berilgan tovar {money(opened.debtInfo.shipped_amount)} · to'langan {money(opened.debtInfo.paid_amount)}</p>
              ) : null}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", margin: "8px 0 12px" }}>
                {opened.kind === "customer" ? (
                  <button type="button" className="btn" onClick={function () {
                    if (onNavigate) onNavigate("payments", { focusForm: "payment", customerId: opened.id });
                  }}>To'lov olish</button>
                ) : null}
                <button type="button" className="btn-ghost" onClick={function () { askOff(opened); }}>Nofaol qilish</button>
              </div>
              <h3 style={{ fontSize: "0.9rem", margin: "8px 0" }}>Buyurtmalar</h3>
              {cardOrders.length === 0 ? <div className="muted">Buyurtma yo'q</div> : (
                <div className="table-wrap list-dense"><table>
                  <thead><tr><th>Kod</th><th>Summa</th><th>Qarz</th><th>Holat</th></tr></thead>
                  <tbody>
                    {cardOrders.map(function (o) {
                      return (
                        <tr key={o.id}>
                          <td data-label="Kod">{o.order_code}</td>
                          <td data-label="Summa">{money(o.total_amount)}</td>
                          <td data-label="Qarz">{money(o.debt_amount)}</td>
                          <td data-label="Holat"><StatusBadge status={o.status} /></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table></div>
              )}
              {opened.kind === "customer" ? (
                <div>
                  <h3 style={{ fontSize: "0.9rem", margin: "12px 0 8px" }}>Yuk tarqatish</h3>
                  {fieldSales.filter(function (w) { return String(w.customer_id || "") === String(opened.id); }).length === 0 ? (
                    <div className="muted">Yuk xati yo'q</div>
                  ) : (
                    <div className="table-wrap list-dense"><table>
                      <thead><tr><th>Kod</th><th>Summa</th><th>Qarz</th></tr></thead>
                      <tbody>
                        {fieldSales.filter(function (w) { return String(w.customer_id || "") === String(opened.id); }).map(function (w) {
                          return (
                            <tr key={w.id}>
                              <td data-label="Kod">{w.waybill_code}</td>
                              <td data-label="Summa">{money(w.total_amount)}</td>
                              <td data-label="Qarz">{money(w.debt_amount)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table></div>
                  )}
                </div>
              ) : null}
              <h3 style={{ fontSize: "0.9rem", margin: "12px 0 8px" }}>To'lovlar</h3>
              {cardPays.length === 0 ? <div className="muted">To'lov yo'q</div> : (
                <div className="table-wrap list-dense"><table>
                  <thead><tr><th>Sana</th><th>Summa</th><th>Usul</th></tr></thead>
                  <tbody>
                    {cardPays.map(function (p) {
                      return (
                        <tr key={p.id}>
                          <td data-label="Sana">{p.paid_at ? new Date(p.paid_at).toLocaleDateString("uz-UZ") : "-"}</td>
                          <td data-label="Summa">{money(p.amount)}</td>
                          <td data-label="Usul">{p.method}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table></div>
              )}
              {opened.kind === "partner" ? (
                <div>
                  <h3 style={{ fontSize: "0.9rem", margin: "12px 0 8px" }}>Dilerlarga berilgan tovar</h3>
                  {cardShips.length === 0 ? <div className="muted">Berilgan tovar yo'q</div> : (
                    <div className="table-wrap list-dense"><table>
                      <thead><tr><th>Kod</th><th>Mahsulot</th><th>Dona</th><th>Summa</th></tr></thead>
                      <tbody>
                        {cardShips.map(function (s) {
                          return (
                            <tr key={s.id}>
                              <td data-label="Kod">{s.shipment_code}</td>
                              <td data-label="Mahsulot">{s.sku}</td>
                              <td data-label="Dona">{s.qty}</td>
                              <td data-label="Summa">{money(s.total_amount)}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table></div>
                  )}
                </div>
              ) : null}
            </div>
          ) : null}
        </div>
      );
    }

    // ---------- App ----------
    function App() {
      const apiHook = useApi();
      const api = apiHook.api;
      const apiBase = apiHook.apiBase;
      const adminKey = apiHook.adminKey;
      const saveSettings = apiHook.saveSettings;
      const logout = apiHook.logout;
      const operatorName = apiHook.operatorName || "Admin";
      const [pageFilter, setPageFilter] = useState({});
      const [moduleId, setModuleId] = useState("bugun");
      const [tab, setTab] = useState("dashboard");
      const [moreOpen, setMoreOpen] = useState(false);
      const [agentsUi, setAgentsUi] = useState(false);

      useEffect(function () {
        if (!adminKey) return;
        api("/api/settings")
          .then(function (r) {
            const v = String((r.data && r.data.agents_ui_enabled) || "").toLowerCase();
            setAgentsUi(v === "1" || v === "true" || v === "yes");
          })
          .catch(function () { setAgentsUi(false); });
      }, [adminKey, api, tab]);

      useEffect(function () {
        if (!agentsUi && tab === "agents") {
          setModuleId("mijozlar");
          setTab("people");
        }
      }, [agentsUi, tab]);

      if (!adminKey) {
        return (
          <LoginScreen
            apiBase={apiBase}
            onLogin={function (k, remember) {
              saveSettings(apiBase || window.location.origin, k, "Admin", remember);
            }}
          />
        );
      }

      // Lucide-style line icons (inline SVG)
      function NavIcon(props) {
        return <Ico name={props.name} />;
      }

      const modules = [
        {
          id: "bugun",
          label: "Bugun",
          short: "Bugun",
          ico: "layout",
          bottom: true,
          tabs: [{ id: "dashboard", label: "Bugun" }]
        },
        {
          id: "sotuv",
          label: "Sotuv",
          short: "Sotuv",
          ico: "cart",
          bottom: true,
          tabs: [
            { id: "orders", label: "Buyurtmalar" },
            { id: "yuk-open", label: "Yuk tarqatish", href: "/yuk" },
            { id: "yukxati", label: "Tarix", sub: true },
            { id: "shipments", label: "Dilerlarga berilgan tovar" }
          ]
        },
        {
          id: "ishlab",
          label: "Ishlab chiqarish",
          short: "Ishlab chiqarish",
          ico: "factory",
          bottom: true,
          tabs: [
            { id: "batches", label: "Partiyalar" },
            { id: "packaging", label: "Qadoqlash" }
          ]
        },
        {
          id: "ombor",
          label: "Ombor",
          short: "Ombor",
          ico: "box",
          bottom: true,
          tabs: [
            { id: "stock-ready", label: "Tayyor mahsulot" },
            { id: "stock-raw", label: "Xomashyo" }
          ]
        },
        {
          id: "mijozlar",
          label: "Mijozlar va qarzlar",
          short: "Mijozlar",
          ico: "users",
          bottom: true,
          tabs: [
            { id: "people", label: "Ro'yxat" },
            { id: "people-debt", label: "Qarzdorlar" },
            { id: "payments", label: "To'lovlar" },
            { id: "agents", label: "Agentlar" }
          ]
        },
        {
          id: "pul",
          label: "Pul va hisobotlar",
          short: "Pul",
          ico: "coin",
          bottom: false,
          tabs: [
            { id: "expenses", label: "Xarajatlar" },
            { id: "reports", label: "Hisobot" }
          ]
        },
        {
          id: "sozlama",
          label: "Sozlamalar",
          short: "Sozlama",
          ico: "catalog",
          bottom: false,
          tabs: [
            { id: "products", label: "Mahsulotlar va narxlar" },
            { id: "materials", label: "Xomashyo va retseptlar" },
            { id: "limits", label: "Chegirma va limitlar" },
            { id: "settings", label: "Sozlama" }
          ]
        }
      ];

      const visModules = modules.map(function (m) {
        if (m.id !== "mijozlar" || agentsUi) return m;
        return Object.assign({}, m, {
          tabs: m.tabs.filter(function (t) { return t.id !== "agents"; })
        });
      });

      const currentModule = visModules.find(function (m) { return m.id === moduleId; }) || visModules[0] || modules[0];
      const currentTab = (currentModule && currentModule.tabs || []).find(function (x) { return x.id === tab; }) || (currentModule && currentModule.tabs[0]) || { id: tab, label: tab };

      function openModule(id) {
        const m = visModules.find(function (x) { return x.id === id; });
        if (!m) return;
        setModuleId(id);
        setTab(m.tabs[0].id);
        setPageFilter({});
      }

      function openSub(id) {
        setTab(id);
        setPageFilter({});
      }

      function goTo(tabId, extra) {
        const alias = {
          stock: "stock-ready",
          customers: "people",
          partners: "people"
        };
        const want = alias[tabId] || tabId;
        let found = null;
        visModules.forEach(function (m) {
          m.tabs.forEach(function (t) {
            if (t.id === want) found = { mid: m.id, tid: t.id };
          });
        });
        if (!found) return;
        setModuleId(found.mid);
        setTab(found.tid);
        setPageFilter(extra || {});
        setMoreOpen(false);
      }

      const TAB_ICO = {
        dashboard: "layout", batches: "factory", packaging: "box",
        "stock-ready": "box", "stock-raw": "catalog",
        orders: "cart", payments: "coin", shipments: "truck",
        materials: "catalog", expenses: "coin", products: "box",
        people: "users", "people-debt": "users", agents: "users", yukxati: "box", "yuk-open": "box", reports: "coin",
        limits: "catalog", settings: "catalog"
      };

      const bottomModules = visModules.filter(function (m) { return m.bottom; });
      const moreModules = visModules.filter(function (m) { return !m.bottom; });
      const moreActive = moreModules.some(function (m) { return m.id === moduleId; });

      let content = null;
      if (tab === "dashboard") content = <Dashboard api={api} onNavigate={goTo} />;
      else if (tab === "stock" || tab === "stock-ready") content = <Stock api={api} part="products" />;
      else if (tab === "stock-raw") content = (
        <div>
          <Stock api={api} part="materials" />
          <Materials api={api} part="inbound" />
        </div>
      );
      else if (tab === "batches") content = <Batches api={api} pageFilter={pageFilter} />;
      else if (tab === "packaging") content = <Packaging api={api} />;
      else if (tab === "orders") content = <Orders api={api} pageFilter={pageFilter} />;
      else if (tab === "payments") content = <Payments api={api} pageFilter={pageFilter} />;
      else if (tab === "expenses") content = <Expenses api={api} pageFilter={pageFilter} />;
      else if (tab === "reports") content = <MoneyReports api={api} />;
      else if (tab === "products") content = <Products api={api} />;
      else if (tab === "materials") content = (
        <div>
          <PageHead title="Xomashyo va retseptlar" sub="Xomashyo nomlari shu yerda. Kirim Ombor → Xomashyo da." />
          <Materials api={api} part="catalog" />
          <RecipePanel api={api} />
        </div>
      );
      else if (tab === "limits") content = <DiscountLimits api={api} onNavigate={goTo} />;
      else if (tab === "yukxati") content = window.YukXatiPanel
        ? React.createElement(window.YukXatiPanel, { api: api, apiBase: apiBase, adminKey: adminKey })
        : <div className="card">Yuk xati moduli yuklanmadi — sahifani yangilang.</div>;
      else if (tab === "agents") content = window.AgentsPanel
        ? React.createElement(window.AgentsPanel, { api: api })
        : <div className="card">Agentlar moduli yuklanmadi — sahifani yangilang.</div>;
      else if (tab === "people" || tab === "people-debt" || tab === "customers" || tab === "partners") content = (
        <PeopleHub api={api} mode={tab === "people-debt" ? "debtors" : "list"} pageFilter={pageFilter} onNavigate={goTo} />
      );
      else if (tab === "shipments") content = window.Shipments ? React.createElement(window.Shipments, { api: api }) : <div className="card">Diler moduli yuklanmadi — sahifani yangilang.</div>;
      else if (tab === "settings") content = window.BizSettings ? React.createElement(window.BizSettings, { api: api }) : <div className="card">Sozlama moduli yuklanmadi — sahifani yangilang.</div>;

      return (
        <div className="shell">
          <aside className="sidebar" aria-label="Sahifalar">
            <div className="sidebar-brand">Black Diamond</div>
            {visModules.map(function (m) {
              return (
                <div key={m.id}>
                  <div className="sidebar-group">{m.short}</div>
                  {m.tabs.map(function (t) {
                    var cls = (tab === t.id ? "active" : "") + (t.sub ? " sub" : "");
                    if (t.href) {
                      return (
                        <a key={t.id} href={t.href} className={cls}>
                          <span className="nav-ico"><NavIcon name={TAB_ICO[t.id] || m.ico} /></span>
                          {t.label}
                        </a>
                      );
                    }
                    return (
                      <button
                        key={t.id}
                        type="button"
                        className={cls}
                        onClick={function () { setModuleId(m.id); setTab(t.id); setPageFilter({}); }}
                      >
                        <span className="nav-ico"><NavIcon name={TAB_ICO[t.id] || m.ico} /></span>
                        {t.label}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </aside>

          <div className="header">
            <div className="header-inner">
              <div className="header-mark">
                <img src="/bd_logo.jpg" alt="" />
              </div>
              <div>
                <h1>Black Diamond OPS{currentTab ? " · " + currentTab.label : ""}</h1>
                <p className="crumb">{currentModule ? currentModule.label : ""}{currentTab && currentModule && currentTab.label !== currentModule.label ? " → " : ""}{currentTab && currentModule && currentTab.label !== currentModule.label ? <b>{currentTab.label}</b> : null}{operatorName ? " · " + operatorName : ""}</p>
              </div>
              <div className="header-right">
                <button type="button" className="logout-btn" onClick={logout}>Chiqish</button>
              </div>
            </div>
          </div>

          <div className="main">
            {currentModule && currentModule.tabs.length > 1 ? (
              <div className="segment mobile-only">
                {currentModule.tabs.map(function (t) {
                  if (t.href) {
                    return (
                      <a key={t.id} href={t.href}>{t.label}</a>
                    );
                  }
                  return (
                    <button
                      key={t.id}
                      type="button"
                      className={tab === t.id ? "active" : ""}
                      onClick={function () { openSub(t.id); }}
                    >
                      {t.label}
                    </button>
                  );
                })}
              </div>
            ) : null}

            {content}
          </div>

          <nav className="bottom-nav" aria-label="Asosiy menyu">
            {bottomModules.map(function (m) {
              return (
                <button
                  key={m.id}
                  type="button"
                  className={moduleId === m.id ? "active" : ""}
                  onClick={function () { setMoreOpen(false); openModule(m.id); }}
                  aria-current={moduleId === m.id ? "page" : undefined}
                >
                  <span className="nav-ico"><NavIcon name={m.ico} /></span>
                  <span className="nav-label">{m.short}</span>
                </button>
              );
            })}
            <button
              type="button"
              className={moreActive || moreOpen ? "active" : ""}
              onClick={function () { setMoreOpen(function (v) { return !v; }); }}
              aria-expanded={moreOpen ? "true" : "false"}
            >
              <span className="nav-ico"><NavIcon name="more" /></span>
              <span className="nav-label">Yana</span>
            </button>
          </nav>
          <div className={"more-backdrop" + (moreOpen ? " open" : "")} onClick={function () { setMoreOpen(false); }}>
            <div className="more-sheet" role="dialog" aria-label="Yana" onClick={function (e) { e.stopPropagation(); }}>
              <h2>Yana</h2>
              {moreModules.map(function (m) {
                return (
                  <div key={m.id}>
                    {m.tabs.map(function (t) {
                      return (
                        <button
                          key={t.id}
                          type="button"
                          className="more-item"
                          onClick={function () {
                            setModuleId(m.id);
                            setTab(t.id);
                            setPageFilter({});
                            setMoreOpen(false);
                          }}
                        >
                          {m.label} · {t.label}
                        </button>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    
    function labelTables() {
      try {
        document.querySelectorAll(".table-wrap table").forEach(function (table) {
          var headers = Array.prototype.map.call(
            table.querySelectorAll("thead th"),
            function (th) { return (th.textContent || "").trim(); }
          );
          if (!headers.length) return;
          table.querySelectorAll("tbody tr").forEach(function (tr) {
            var cells = tr.querySelectorAll("td");
            var hi = 0;
            for (var i = 0; i < cells.length; i++) {
              var cell = cells[i];
              if (cell.getAttribute("data-label")) { hi++; continue; }
              var span = Number(cell.getAttribute("colSpan") || cell.getAttribute("colspan") || 1);
              if (headers[hi]) cell.setAttribute("data-label", headers[hi]);
              hi += span;
            }
          });
        });
      } catch (e) {}
    }
    var _labelTimer = null;
    function scheduleLabelTables() {
      if (_labelTimer) clearTimeout(_labelTimer);
      _labelTimer = setTimeout(function () { labelTables(); }, 30);
    }
    function armLabelTables() {
      try {
        var root = document.getElementById("root");
        if (root && typeof MutationObserver !== "undefined") {
          if (!window.__bdTblObs) {
            window.__bdTblObs = new MutationObserver(function () { scheduleLabelTables(); });
            window.__bdTblObs.observe(root, { childList: true, subtree: true });
          }
        }
        scheduleLabelTables();
        setTimeout(labelTables, 120);
        setTimeout(labelTables, 600);
      } catch (e2) {}
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", armLabelTables);
    } else {
      armLabelTables();
    }
    (function bootAdmin() {
      if (!window.React || !window.ReactDOM) {
        setTimeout(bootAdmin, 40);
        return;
      }
      var el = document.getElementById("root");
      if (!el) {
        setTimeout(bootAdmin, 40);
        return;
      }
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) { tg.ready(); if (tg.expand) tg.expand(); }
      } catch (e1) {}
      const root = ReactDOM.createRoot(el);
      root.render(<App />);
      armLabelTables();
    })();
  </script>
</body>
</html>
